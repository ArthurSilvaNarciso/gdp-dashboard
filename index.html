es internos recebem visitantes, terceirizados e público. E nem todo colega pode ver dados pessoais de terceiros."},{"t":"Desligar o monitor, que tem o mesmo efeito de bloquear a sessão.","p":"troca","w":"Desligar o monitor só apaga a imagem. Basta ligá-lo de novo para usar a sessão, que continua desbloqueada."}]}]}];

// Avatar: só chaves conhecidas e valores curtos (o desenho é feito no app).

const W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];

  if (!c || !c.s) {

  } else {
    const r = retr(c, now), d = c.d;

    const due = seen.filter((q) => S.cards[q.id].due <= now).sort((a, b) => retr(S.cards[a.id]) - retr(S.cards[b.id]));
    const fresh = shuffle(pool.filter((q) => !(S.cards[q.id] && S.cards[q.id].s)));
    const rest = seen.filter((q) => S.cards[q.id].due > now).sort((a, b) => retr(S.cards[a.id]) - retr(S.cards[b.id]));

function startSimTimer() {
  const s = ui.session;
  s.simTick = setInterval(() => {

function finishSim() {
  const s = ui.session; if (!s || s.mode !== 'sim' || s.phase === 'summary') return;
  clearInterval(s.simTick);
  const L = todayLog();
  let ok = 0;
  s.queue.forEach((id) => {
    const q = QINDEX[id].q; const a = s.answers[id];
    const correct = a != null && a === q.a;
    if (correct) ok++;
    schedule(id, correct ? 3 : 1);
    if (a != null) { L.n++; if (correct) L.ok++; if (!correct) { const p = q.o[a].p; S.traps[p] = (S.traps[p] || 0) + 1; } }
    s.results.push({ id, correct, pick: a, time: 0 });
  });
  const score = Math.round((ok / s.queue.length) * 100);
  s.score = score; s.used = Date.now() - s.start;
  const gain = ok * 10; S.xp += gain; s.xp = gain;
  S.sims = (S.sims || []).concat([{ at: Date.now(), title: s.title, score, n: s.queue.length }]).slice(-20);
  bumpStreak();
  s.phase = 'summary'; L.cycles++; S.totals.cycles++;

function questionContext(q, pick) {

}
async function askTutor(text) {
  const s = ui.session; if (!aiReady() || !s || s.tutor.busy || !text.trim()) return;

/* ---------- Sessão ---------- */
function viewSession() {
  const s = ui.session;
  if (s.phase === 'summary') return s.mode === 'sim' ? viewSimSummary() : viewSummary();
  const id = s.queue[s.i]; const { q, deck } = QINDEX[id];
  const pct = (s.i / s.queue.length) * 100;
  const back = s.requeued[id] && s.results.some((r) => r.id === id) && s.phase !== 'feedback' && s.phase !== 'consol';
  const L = lookOf(deck);
  const head = `<div class="qmeta"><span class="tag ${TAG_COLOR[deck.tag] || 'c-blue'}">${esc(q.topic)}</span><span>${esc(deck.title)}</span>${back ? '<span class="tag c-peach">De volta para fixar</span>' : ''}</div>
    <div class="case"><span class="tile c-${L.pal === 'navy' ? 'blue' : L.pal}">${ico('file')}</span><span>${esc(q.c)}</span></div>
    <h2 class="qtext">${esc(q.q)}</h2>`;
  const top = (extra) => `<div class="sess-head"><div class="r"><button class="icon-btn" data-act="quit" aria-label="Sair">${ico('close')}</button><div class="pline" role="progressbar" aria-label="Progresso do ciclo" aria-valuemin="1" aria-valuenow="${s.i + 1}" aria-valuemax="${s.queue.length}"><i style="width:${Math.max(4, pct)}%"></i></div><span class="d num" style="font-weight:600;font-size:14px;min-width:40px;text-align:right">${s.i + 1}/${s.queue.length}</span></div>${extra}</div>`;
  const opts = (fb) => `<div class="opts${!fb && s.justRevealed ? ' in' : ''}">${s.order.map((oi, di) => fb ? `<button class="opt ${oi === q.a ? 'right' : oi === s.pick ? 'wrong' : 'dim'}" disabled><span class="L">${LETTERS[di]}</span><span>${esc(q.o[oi].t)}</span></button>` : `<button class="opt" data-act="pick" data-i="${oi}" aria-pressed="${s.pick === oi}"><span class="L">${LETTERS[di]}</span><span>${esc(q.o[oi].t)}</span></button>`).join('')}</div>`;
  if (s.mode === 'sim') {
    return `<div class="sess">${top(`<div class="r" style="justify-content:space-between;padding-left:6px"><span class="tag c-blue">Simulado · gabarito no final</span><span class="timer-chip" id="sim-timer">${mmss(s.deadline - Date.now())}</span></div>`)}
      <div class="sess-body">${head}${opts(false)}</div>
      <div class="dock"><div class="duo"><button class="btn btn-ghost" data-act="sim-skip">Pular</button><button class="btn btn-primary" data-act="sim-next" ${s.pick == null ? 'disabled' : ''}>${s.i + 1 >= s.queue.length ? 'Entregar' : 'Confirmar'}</button></div></div></div>`;
  }
  const phases = ['desafio', 'esforco', 'feedback', 'consol'], labels = ['Desafio', 'Esforço', 'Recompensa', 'Porquê'];
  const pi = phases.indexOf(s.phase);
  let body = '', dock = '';
  if (s.phase === 'desafio') {
    body = head + `<div class="think"><b>Responda de cabeça primeiro</b><p>Formule a resposta antes de ver as opções. Esse esforço é o que fixa o conteúdo.</p><span class="timer" id="recall-timer">0s pensando</span></div>`;
    dock = `<button class="btn btn-primary btn-block" data-act="reveal">Ver alternativas</button>`;
  } else if (s.phase === 'esforco') {
    body = head + opts(false);
    dock = s.pick == null ? `<p class="hint">Escolha uma alternativa</p>` :
      `<p class="q">Qual é a sua confiança?</p><div class="conf"><button class="c-peach" data-act="conf" data-c="chute">Chutei<small>não sei</small></button><button class="c-blue" data-act="conf" data-c="acho">Acho que sim<small>com dúvida</small></button><button class="c-mint" data-act="conf" data-c="certeza">Tenho certeza<small>sei explicar</small></button></div>`;
  } else if (s.phase === 'feedback') {
    const v = verdict(s);
    body = `<div class="verdict ${v.cls}" role="status"><span class="vi">${ico(v.icon)}</span><div style="flex:1;min-width:0"><h3>${v.title}</h3><p>${v.text}</p></div><span class="xp num">+${s.gain} XP</span></div>${s.bonus ? `<div class="combo" role="status"><b class="num">Combo ×${s.combo}</b><span>+${s.bonus} XP de bônus por acertos seguidos</span></div>` : ''}` + head + opts(true);
    dock = s.correct ? `<div class="duo"><button class="btn btn-soft" data-act="consol">Ver o porquê</button><button class="btn btn-primary" data-act="next">Próxima</button></div>` :
      `<button class="btn btn-orange btn-block" data-act="consol">Entender o erro</button>`;
  } else {
    const trap = s.correct ? null : q.o[s.pick].p;
    body = `<div class="blk" style="gap:4px"><span class="tiny" style="font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--orange-ink)">Engenharia reversa</span><h2 style="font-size:20px">Por que cada alternativa está certa ou errada</h2></div>
      ${trap ? `<div class="callout" style="background:var(--t-peach)"><span class="tile" style="background:var(--orange);color:#fff">${ico('alert')}</span><div><b>O que te pegou: ${PATTERNS[trap].l}</b><p>${PATTERNS[trap].d}</p></div></div>` : ''}
      <div class="alts">${s.order.map((oi, di) => { const o = q.o[oi]; const isR = oi === q.a, isP = oi === s.pick && !isR;
        return `<div class="alt ${isR ? 'is-right' : ''} ${isP ? 'is-picked' : ''}"><div class="hd"><span class="L">${LETTERS[di]}</span><span class="tag ${isR ? 'c-mint' : isP ? 'c-pink' : 'c-blue'}">${PATTERNS[o.p] ? PATTERNS[o.p].l : 'Incorreta'}</span>${isP ? '<span class="tiny" style="font-weight:700;color:var(--bad)">sua resposta</span>' : ''}</div><span class="t">${esc(o.t)}</span><span class="w">${esc(o.w)}</span></div>`; }).join('')}</div>
      ${q.src ? `<p class="tiny">Fonte: ${esc(q.src)}</p>` : ''}${viewTrain(s)}${viewTutor(s)}`;
    dock = `<button class="btn btn-primary btn-block" data-act="next">${s.i + 1 >= s.queue.length ? 'Ver resultado' : 'Próxima questão'}</button>`;
  }
  return `<div class="sess">${top(`<div class="steps4" aria-hidden="true">${labels.map((l, i) => `<span class="${i === pi ? 'on' : i < pi ? 'past' : ''}">${l}</span>`).join('')}</div>`)}
    <div class="sess-body">${body}</div><div class="dock">${dock}</div></div>`;
}
function viewTrain(s) {

    <button class="btn btn-orange btn-sm" data-act="train" ${t.busy ? 'disabled' : ''}>${t.busy ? 'Criando...' : 'Criar'}</button></div>`;
}
function viewTutor(s) {
  if (aiNeedsLogin()) return `<div class="card pad" style="flex-direction:row;align-items:center"><span class="avatar" style="width:40px;height:40px;background:var(--navy-2)">${ico('tutor')}</span><div style="flex:1;min-width:0"><b class="d" style="font-weight:600;display:block">Tutor com IA</b><span class="tiny" style="font-size:13px">Entre na conta para tirar dúvidas e treinar seus erros</span></div><button class="btn btn-primary btn-sm" data-act="auth-open" data-m="signup">Entrar</button></div>`;
  if (!aiReady()) return '';
  const t = s.tutor;
  const chips = ['Explique de outro jeito', 'Me dê um exemplo', 'Crie um macete'];
  return `<div class="tutor" id="tutor">
    <div class="hd"><span class="avatar" style="width:40px;height:40px;background:var(--navy-2)">${ico('tutor')}</span><div style="flex:1;min-width:0"><b class="d" style="font-weight:600;display:block">Tutor Memory</b><span class="tiny" style="font-size:13px">Tire dúvidas sobre esta questão</span></div></div>
    ${t.msgs.map((m) => `<div class="bubble ${m.role === 'user' ? 'me' : 'ai'}"><p>${m.role === 'user' ? esc(m.content) : richText(m.content)}</p></div>`).join('')}
    ${t.busy ? `<div class="bubble ai" id="tutor-live"><p>${t.live ? richText(t.live) : '<span class="typing"><i></i><i></i><i></i></span>'}</p></div>` : ''}
    ${t.err ? `<div class="notice err">${esc(t.err)}</div>` : ''}
    ${!t.busy && t.msgs.length < 2 ? `<div class="qchips">${chips.map((c) => `<button class="qchip" data-act="tutor-chip" data-q="${esc(c)}">${c}</button>`).join('')}</div>` : ''}
    <form class="composer" data-form="tutor"><input id="tutor-input" placeholder="Pergunte ao tutor" maxlength="300" autocomplete="off" aria-label="Pergunta ao tutor" ${t.busy ? 'disabled' : ''}><button aria-label="Enviar" ${t.busy ? 'disabled' : ''}>${ico('send')}</button></form>
  </div>`;
}
function verdict(s) {
  const when = s.days === 1 ? 'amanhã' : 'em ' + s.days + ' dias';
  if (s.correct) {
    if (s.conf === 'certeza') return { cls: 'ok', icon: 'check', title: 'Na mosca!', text: 'Conhecimento sólido. Volta ' + when + '.' };
    if (s.conf === 'acho') return { cls: 'ok', icon: 'check', title: 'Correto', text: 'Ainda havia dúvida. Volta ' + when + ' para reforçar.' };
    return { cls: 'warn', icon: 'check', title: 'Acertou no chute', text: 'Chute certo não é domínio. Volta ' + when + ' para confirmar.' };
  }
  const back = s.requeue ? 'Ela volta no fim deste ciclo.' : 'Volta para revisão ainda hoje.';
  if (s.conf === 'certeza') return { cls: 'bad', icon: 'alert', title: 'Ilusão de competência', text: 'Você tinha certeza e errou. É o erro mais valioso para corrigir agora. ' + back };
  if (s.conf === 'acho') return { cls: 'bad', icon: 'x', title: 'Quase', text: back };
  return { cls: 'bad', icon: 'x', title: 'Incorreto', text: 'Você sinalizou a dúvida. ' + back };

function viewSummary() {

/* ---------- Progresso ---------- */
function curveChart() {
  const ids = seenIds(); if (!ids.length) return '<p class="muted small">Responda o primeiro ciclo para ver sua curva de memória.</p>';
  const now = Date.now(), days = 30, Wd = 320, H = 150, pl = 32, pr = 6, pt = 14, pb = 22;
  const x = (d) => pl + (d / days) * (Wd - pl - pr), y = (p) => pt + (1 - p) * (H - pt - pb);
  const pts = []; for (let d = 0; d <= days; d++) pts.push([d, memoryNow(now + d * DAY)]);
  const line = pts.map(([d, p], i) => (i ? 'L' : 'M') + x(d).toFixed(1) + ' ' + y(p).toFixed(1)).join(' ');
  const area = line + ` L${x(days)} ${y(0)} L${x(0)} ${y(0)} Z`;
  const tgt = S.user.retention || 0.9; const end = pts[days][1];
  const grid = [1, 0.5, 0].map((p) => `<line x1="${pl}" x2="${Wd - pr}" y1="${y(p)}" y2="${y(p)}" class="g"/><text x="${pl - 6}" y="${y(p) + 3.5}" text-anchor="end" class="ax">${p * 100}%</text>`).join('');
  const xt = [[0, 'Hoje'], [7, '7 d'], [14, '14 d'], [30, '30 d']].map(([d, l]) => `<text x="${x(d)}" y="${H - 4}" text-anchor="${d === 30 ? 'end' : d === 0 ? 'start' : 'middle'}" class="ax">${l}</text>`).join('');
  return `<svg viewBox="0 0 ${Wd} ${H}" class="chart" role="img" aria-label="Sem revisar, a memória vai de ${Math.round(pts[0][1] * 100)}% para ${Math.round(end * 100)}% em 30 dias">
    ${grid}<line x1="${pl}" x2="${Wd - pr}" y1="${y(tgt)}" y2="${y(tgt)}" class="tg"/><text x="${Wd - pr}" y="${y(tgt) - 5}" text-anchor="end" class="ax tgl">Meta ${Math.round(tgt * 100)}%</text>
    <path d="${area}" class="ar"/><path d="${line}" class="ln"/><circle cx="${x(days)}" cy="${y(end)}" r="4" class="pt"/>${xt}</svg>
    <p class="small muted">Sem revisar, sua memória cairia de <b style="color:var(--ink)">${Math.round(pts[0][1] * 100)}%</b> para <b style="color:var(--ink)">${Math.round(end * 100)}%</b> em 30 dias.</p>`;
}

function runCounters(root) {

function ensurePdf() {

    pdfReady = loadScript(base + 'pdf.worker.min.js').then(() => loadScript(base + 'pdf.min.js')).then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; return window.pdfjsLib; });

async function readFile(file) {
  imp.error = ''; imp.file = file.name; imp.reading = true; imp.pages = 0; imp.text = '';
  if (!imp.title) imp.title = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').slice(0, 60);
  render();
  try {
    if (/\.pdf$/i.test(file.name) || file.type === 'application/pdf') {
      const lib = await ensurePdf();
      const pdf = await lib.getDocument({ data: await file.arrayBuffer(), isEvalSupported: false }).promise;
      imp.pages = pdf.numPages;
      const parts = [];
      for (let p = 1; p <= pdf.numPages; p++) {
        const tc = await (await pdf.getPage(p)).getTextContent();
        const t = tc.items.map((it) => it.str + (it.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+/g, ' ').trim();
        if (t) parts.push('[p. ' + p + ']\n' + t);
      }
      imp.text = parts.join('\n\n');
      if (!imp.text.trim()) imp.error = 'Não encontramos texto neste PDF. Ele parece ser digitalizado (imagem). Tente um PDF com texto selecionável ou cole o conteúdo.';
    } else imp.text = await file.text();
  } catch (e) { imp.error = 'Não foi possível ler este arquivo. Verifique se o PDF não está protegido por senha ou cole o texto manualmente.'; imp.file = null; }
  imp.reading = false; render();
}
function prepareMaterial(text, max = 60000) {
  if (text.length <= max) return { text, cut: false };
  const pages = text.split(/\n\n(?=\[p\. \d+\])/);
  if (pages.length > 3) {
    const per = Math.floor(max / pages.length);
    if (per > 400) return { text: pages.map((p) => p.slice(0, per)).join('\n\n'), cut: true };
    const step = pages.length / Math.floor(max / 1500); const picked = [];
    for (let i = 0; i < pages.length; i += step) picked.push(pages[Math.floor(i)].slice(0, 1500));
    return { text: picked.join('\n\n'), cut: true };
  }
  return { text: text.slice(0, max), cut: true };
}
function buildPrompt(material, n, title, focus) {
  return `Você é o motor de questões do Memory, um app de estudo baseado em prática de recuperação, feedback imediato e engenharia reversa de pegadinhas.

Com base EXCLUSIVAMENTE no material abaixo, crie ${n} questões de múltipla escolha em português do Brasil.

Regras:
- Cada questão começa com um caso curto e realista (campo "c", 1 a 3 frases) que aplica o conteúdo a uma situação prática. Depois vem a pergunta (campo "q").
- Exatamente 4 alternativas (campo "o"). Cada uma tem "t" (texto, até 160 caracteres), "p" (padrão) e "w" (por que está certa ou errada, 1 a 2 frases, apoiadas no material).
- Exatamente uma alternativa correta, com "p": "correta". As erradas devem ser plausíveis e usar um destes padrões de pegadinha: "inversao" (troca o sentido ou a ordem), "generalizacao" (transforma regra com exceção em absoluta), "restricao" (acrescenta condição que não existe), "extrapolacao" (vai além do que o material diz), "troca" (usa conceito vizinho no lugar do correto), "calculo" (erro de procedimento ou de conta).
- "a" é o índice (0 a 3) da alternativa correta. Varie a posição da correta entre as questões.
- "topic": assunto em até 4 palavras. "src": onde está no material, por exemplo "p. 12" quando houver marcação [p. N]; senão, o nome da seção.
- Cubra partes diferentes do material e priorize conceitos que costumam ser cobrados. Não pergunte sobre detalhes irrelevantes, como números de página ou dados de capa.
- Não invente fatos que não estejam no material.${focus ? '\n- Foco pedido pelo aluno: ' + focus : ''}

Responda SOMENTE com um array JSON, sem texto antes ou depois, neste formato:
[{"topic":"...","c":"...","q":"...","a":0,"src":"p. 3","o":[{"t":"...","p":"correta","w":"..."},{"t":"...","p":"troca","w":"..."},{"t":"...","p":"generalizacao","w":"..."},{"t":"...","p":"inversao","w":"..."}]}]

MATERIAL: ${title}
<<<
${material}
>>>`;
}
function validateQuestions(arr, prefix) {
  if (!Array.isArray(arr)) return [];
  const out = [];
  arr.forEach((x, i) => {
    if (!x || typeof x.q !== 'string' || !Array.isArray(x.o) || x.o.length < 3) return;
    const o = x.o.filter((y) => y && typeof y.t === 'string').slice(0, 5).map((y) => ({ t: String(y.t).slice(0, 400), p: PATTERNS[y.p] ? y.p : 'troca', w: String(y.w || '').slice(0, 600) }));
    if (o.length < 3) return;
    const a = Number.isInteger(x.a) && x.a >= 0 && x.a < o.length ? x.a : o.findIndex((y) => y.p === 'correta');
    if (a < 0) return;
    o.forEach((y, j) => { if (j === a) y.p = 'correta'; else if (y.p === 'correta') y.p = 'troca'; });
    out.push({ id: prefix + '_' + i, topic: String(x.topic || 'Seu material').slice(0, 40), c: String(x.c || '').slice(0, 800), q: x.q.slice(0, 500), a, src: String(x.src || '').slice(0, 80), o });
  });
  return out;
}

(function mountGlyphs() {
  const sym = Object.entries(GLYPHS).map(([k, v]) => `<symbol id="gi-${k}" viewBox="0 0 24 24">${v.n ? `<path class="gn" d="${v.n}"/>` : ''}${v.a ? `<path class="ga" d="${v.a}"/>` : ''}</symbol>`).join('');
  document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute" aria-hidden="true">${sym}</svg>`);
  for (const k of Object.keys(GLYPHS)) I[k] = `<use href="#gi-${k}"/>`;
  I.layers = I.decks; I.memory = I.mind; I.spark = I.recall;
})();

/* ---------- Ilustrações de estado (mesma linguagem dos ícones) ---------- */
function illo(name, cls = '') {
  const v = ILLOS[name]; if (!v) return '';
  return `<svg class="illo ${cls}" viewBox="0 0 ${v.w} ${v.h}" role="img" aria-hidden="true">${v.n ? `<path class="gn" d="${v.n}"/>` : ''}${v.a ? `<path class="ga" d="${v.a}"/>` : ''}</svg>`;
}

/* ================= Motivos para voltar todo dia ================= */

I.coin = '<circle cx="12" cy="12" r="10.5" class="cf"/><circle cx="12" cy="12" r="8" fill="none" class="cr"/><circle cx="9.6" cy="12" r="3.6" class="c1"/><circle cx="14.4" cy="12" r="3.6" class="c2"/>';

/* ---------- Moedas ---------- */
function coinsBal() { const c = S.coins || {}; return Math.max(0, (c.earned || 0) - (c.spent || 0)); }

}
function spendCoins(n) { if (coinsBal() < n) return false; S.coins = S.coins || { earned: 0, spent: 0 }; S.coins.spent += n; return true; }

/* ---------- Loja do avatar ---------- */
// Preço em moedas, ou desbloqueio por conquista/nível. O que não está aqui é grátis.
const AV_SHOP = {
  hat: { bonetras: 40, bucket: 60, viseira: 40, bandana: 60, fedora: 90, fone: 80, capelo: { badge: 'sim70', price: 150 }, coroa: { badge: 'streak30' } },

  acc: { argola: 40, piercing: 50, flor: 50, colar: 60, gravata: 60, cachecol: 80, lapis: { badge: 'q100', price: 100 } },

const itemKey = (k, v) => k + ':' + v;
function itemRule(k, v) { const r = (AV_SHOP[k] || {})[v]; return r == null ? null : typeof r === 'number' ? { price: r } : r; }
function itemOwned(k, v) {
  const r = itemRule(k, v); if (!r) return true;
  if (S.owned && S.owned[itemKey(k, v)]) return true;
  if (r.badge && S.badges && S.badges[r.badge]) return true;
  if (r.level && level() >= r.level) return true;
  return false;
}
function itemLockText(r) {
  const b = r.badge && BADGES.find((x) => x.id === r.badge);
  if (r.level) return 'Libera no nível ' + r.level;
  if (b && r.price) return `${r.price} moedas ou conquista “${b.l}”`;
  if (b) return 'Conquista “' + b.l + '”';
  return r.price + ' moedas';
}
function lockedInCfg(cfg) {
  const out = [];
  for (const k of Object.keys(AV_SHOP)) { const v = cfg[k]; if (!itemOwned(k, v)) out.push({ k, v, r: itemRule(k, v) }); }
  return out;
}

/* ---------- Objetivo com data ---------- */
function examInfo() {
  const e = S.user.exam; if (!e || !e.date) return null;
  const [y, m, d] = e.date.split('-').map(Number); const at = new Date(y, m - 1, d);
  const days = Math.ceil((at - new Date(new Date().toDateString())) / DAY);
  return { name: e.name || 'Sua prova', date: e.date, days, at };
}
function targetDecks() { return personaDecks().map(deckById).filter(Boolean); }
// Preparação: quanto do conteúdo-alvo você lembraria hoje (memória × cobertura).
function readiness() {
  let tot = 0, sum = 0, firm = 0;
  for (const d of targetDecks()) for (const q of d.questions) { tot++; const c = S.cards[q.id]; if (c && c.s) { sum += retr(c); if (c.s >= FIRM && c.g > 1) firm++; } }
  return { pct: tot ? Math.round((sum / tot) * 100) : 0, total: tot, firm };
}
function dailyPlan() {
  const ex = examInfo(), r = readiness(); const goal = S.user.goal;
  if (!ex || ex.days <= 0) return { n: goal, why: '' };
  const missing = Math.max(0, Math.ceil(r.total * 0.9) - r.firm);
  const need = Math.max(goal, Math.ceil((missing * 2.2) / Math.max(1, ex.days))); // cada questão firme pede ~2 a 3 revisões
  return { n: Math.min(60, need), why: need > goal ? 'para chegar a 90% até a prova' : 'mantém você no ritmo da prova' };
}
function examCard() {

  if (ex.days < 0) return `<button class="goalcard" data-act="exam-open"><span class="tile c-mint">${ico('trophy')}</span><div class="main"><b>${esc(ex.name)} já passou</b><span>Como foi? Defina o próximo objetivo</span></div>${chev()}</button>`;

}

document.addEventListener('submit', (e) => {

/* ---------- Baú do dia ---------- */
function chestReady() { const L = peekToday(); return L.n >= S.user.goal && S.chest !== dayKey(); }

function openChest() {
  if (!chestReady()) return;

/* ---------- Comemoração da sequência ---------- */
const STREAK_MARKS = [3, 7, 14, 30, 50, 100, 365];
function streakSheet(n) {

  const days = []; const today = new Date();
  for (let i = 6; i >= 0; i--) { const d = new Date(today.getTime() - i * DAY); const on = (S.log[dayKey(d)] || {}).n > 0; days.push(`<span class="${on ? 'on' : ''}${i === 0 ? ' today' : ''}"><i>${on ? ico('check') : ''}</i>${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'][d.getDay()]}</span>`); }
  ui.sheet = `<div class="reward streak"><div class="flame-big">${ico('flame')}<b class="num">${n}</b></div><h2>${n === 1 ? 'Sequência começou!' : n + ' dias seguidos!'}</h2>

    <div class="wk7">${days.join('')}</div>
    <div class="bar"><i class="o" style="width:${Math.round((n / next) * 100)}%"></i></div><span class="tiny">${n} de ${next} dias · ${S.freezes || 0} ${(S.freezes || 0) === 1 ? 'protetor guardado' : 'protetores guardados'}</span>

/* ---------- Lembrete diário (calendário) ---------- */
function reminderICS(hhmm) {
  const [h, m] = hhmm.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); if (d < new Date()) d.setDate(d.getDate() + 1);
  const pad2 = (n) => String(n).padStart(2, '0');
  const dt = `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}T${pad2(h)}${pad2(m)}00`;
  const url = /^https?:/.test(location.protocol) ? location.origin + location.pathname : '';

    'UID:memory-lembrete-' + Date.now() + '@memory', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', 'DTSTART:' + dt, 'DURATION:PT10M',
    'RRULE:FREQ=DAILY', 'SUMMARY:Memory · ' + S.user.goal + ' questões de hoje', 'DESCRIPTION:Mantenha sua sequência. ' + url, url ? 'URL:' + url : '',
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Hora do Memory', 'TRIGGER:-PT0M', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');

    <div class="seg" role="group">${['07:00', '12:00', '19:00', '21:00'].map((t) => `<button data-act="remind-pick" data-t="${t}" aria-pressed="${cur === t}">${t}</button>`).join('')}</div>
    <div class="field"><label for="rm-time">Outro horário</label><input id="rm-time" class="input" type="time" value="${cur}"></div>

/* ---------- Ações ---------- */

    setTimeout(() => URL.revokeObjectURL(url), 4000);

/* ================= Jornada da trilha (etapas em caminho) ================= */
// Cada trilha vira um caminho de etapas de 4 questões. A etapa fecha quando todas foram acertadas ao menos uma vez.
// As estrelas mostram a memória atual da etapa (caem com o tempo e voltam com a revisão).
const UNIT = 4;
function units(d) {
  const out = [];
  for (let i = 0; i < d.questions.length; i += UNIT) {
    const qs = d.questions.slice(i, i + UNIT);
    let ok = 0, seen = 0, rs = 0;
    for (const q of qs) { const c = S.cards[q.id]; if (c && c.s) { seen++; rs += retr(c); if (c.ok > 0) ok++; } }
    const done = ok === qs.length; const mem = seen ? rs / seen : 0;
    out.push({ n: out.length + 1, ids: qs.map((q) => q.id), topics: qs.map((q) => q.topic), done, seen, mem, stars: done ? (mem >= 0.9 ? 3 : mem >= 0.75 ? 2 : 1) : 0 });
  }
  const cur = out.findIndex((u) => !u.done);
  out.forEach((u, i) => { u.state = u.done ? 'done' : i === cur ? 'current' : 'todo'; });
  return out;
}
function journeyHTML(d) {
  const us = units(d); if (us.length < 2) return '';

  const doneN = us.filter((u) => u.done).length;
  const star = (on) => `<svg viewBox="0 0 24 24" class="jstar ${on ? 'on' : ''}" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>`;
  const nodes = us.map((u, i) => {
    const label = u.state === 'done' ? `Etapa ${u.n} concluída, ${u.stars} de 3 estrelas` : u.state === 'current' ? `Etapa ${u.n}, próxima etapa` : `Etapa ${u.n}`;
    const inner = u.state === 'done' ? ico('check') : u.state === 'current' ? `<b class="num">${u.n}</b>` : `<b class="num">${u.n}</b>`;
    return `<div class="jn ${u.state}" style="--x:${X[i % X.length]}px">
      ${u.state === 'current' ? `<span class="jn-tip">${u.seen ? 'Continuar' : 'Começar'}</span>` : ''}
      <button class="jn-btn" data-act="unit-start" data-id="${esc(d.id)}" data-n="${u.n}" aria-label="${label}">${inner}</button>
      ${u.state === 'done' ? `<span class="jn-stars">${star(u.stars >= 1)}${star(u.stars >= 2)}${star(u.stars >= 3)}</span>` : `<span class="jn-cap">${esc(u.topics[0])}</span>`}

  }).join('');
  return `<div class="blk"><div class="sec"><h2>Sua jornada</h2><span class="tiny num" style="font-weight:700">${doneN}/${us.length} etapas</span></div>

}

// Fecha a etapa ao fim do ciclo: comemora e dá moedas na primeira vez.
function checkUnit(s) {

  const u = units(dk)[p.n - 1];

// Próxima etapa: a etapa atual da trilha que você estudou por último (ou a primeira do seu plano).
function nextUnit() {
  const decks = personaDecks().map(deckById).filter(Boolean);
  let best = null, bestAt = -1;
  for (const d of decks) {
    let last = 0; for (const q of d.questions) { const c = S.cards[q.id]; if (c && c.last > last) last = c.last; }
    const u = units(d).find((x) => x.state === 'current');
    if (u && last > bestAt) { best = { d, u }; bestAt = last; }
  }
  return best;
}

/* ================= Plano de hoje =================
   Três passos curtos, sempre na mesma ordem: revisar o que está esquecendo, avançar uma etapa
   e bater a meta para abrir o baú. Dá um motivo concreto para abrir o app todo dia. */
function todayPlan() {
  const L = peekToday(), due = dueIds().length, g = S.user.goal, steps = [];
  const size = Math.max(5, Math.min(10, g));
  if (due || L.rev) steps.push({ done: !due, t: due ? 'Revisar ' + plural(Math.min(due, 20), 'questão', 'questões') : 'Revisões em dia', s: due ? 'Antes que a memória caia abaixo da meta' : plural(L.rev, 'revisão feita', 'revisões feitas') + ' hoje', act: 'review-all', cta: 'Revisar' });
  else steps.push({ done: L.cycles > 0, t: L.cycles ? 'Ciclo do dia feito' : 'Ciclo de ' + size + ' questões', s: L.cycles ? plural(L.n, 'questão respondida', 'questões respondidas') + ' hoje' : 'Leva uns 5 minutos', act: 'cycle-all', cta: 'Começar' });
  const nu = nextUnit();
  if (L.units) steps.push({ done: true, t: L.units > 1 ? L.units + ' etapas concluídas' : 'Etapa concluída', s: nu ? 'Próxima: etapa ' + nu.u.n + ' de ' + nu.d.title : 'Trilhas em dia' });
  else if (nu) steps.push({ done: false, t: 'Etapa ' + nu.u.n + ' · ' + nu.d.title, s: nu.u.topics.slice(0, 2).join(' e '), act: 'unit-start', ds: { id: nu.d.id, n: nu.u.n }, data: `data-id="${esc(nu.d.id)}" data-n="${nu.u.n}"`, cta: nu.u.seen ? 'Continuar' : 'Começar' });
  const opened = S.chest === dayKey(), ready = chestReady(), n = Math.min(L.n, g);
  steps.push({ done: opened, chest: true, t: opened ? 'Baú do dia aberto' : ready ? 'Abrir o baú do dia' : 'Bater a meta e abrir o baú', s: opened ? 'Volte amanhã para um novo' : n + ' de ' + g + ' questões', bar: opened ? 0 : n / g, act: ready ? 'chest-open' : 'cycle-all', cta: ready ? 'Abrir' : 'Estudar', hot: ready });
  return steps;
}
function planCard() {
  const steps = todayPlan(); const done = steps.filter((x) => x.done).length; const all = done === steps.length;
  const cur = steps.findIndex((x) => !x.done || false);
  const li = steps.map((x, i) => {
    const state = x.done ? 'done' : i === cur ? 'cur' : 'todo';
    const dot = x.done ? tickIco() : x.chest ? chestSVG(false) : `<b class="num">${i + 1}</b>`;
    const body = `<span class="ps-txt"><b>${esc(x.t)}</b><span>${esc(x.s)}</span>${x.bar ? `<span class="bar"><i class="o" style="width:${Math.round(x.bar * 100)}%"></i></span>` : ''}</span>`;
    const pill = state === 'cur' || x.hot ? `<span class="btn ${x.hot ? 'btn-orange' : 'btn-orange'} btn-sm">${esc(x.cta)}</span>` : x.done ? '' : chev();
    return x.done || !x.act ? `<li class="ps ${state}${x.chest ? ' is-chest' : ''}"><span class="ps-dot">${dot}</span>${body}</li>`
      : `<li class="ps ${state}${x.chest ? ' is-chest' : ''}"><button class="ps-btn" data-act="${x.act}" ${x.data || ''}><span class="ps-dot">${dot}</span>${body}${pill}</button></li>`;

const WD = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
function weekStats(back = 0) {
  const days = []; let n = 0, ok = 0, act = 0;
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() - (i + back * 7) * DAY); const L = S.log[dayKey(d)] || {};
    const x = { d, n: L.n || 0, ok: L.ok || 0 }; days.push(x); n += x.n; ok += x.ok; if (x.n) act++;
  }
  return { days, n, ok, act, acc: n ? Math.round((ok / n) * 100) : null };
}
function weekHeadline(w, p) {

// Pontos fracos: domínio = memória atual × confiança da última resposta.
function weakCards() {
  const conf = { 1: 0.25, 2: 0.55, 3: 0.85, 4: 1 };
  return seenIds().map((id) => { const c = S.cards[id]; const x = QINDEX[id]; return { id, dom: retr(c) * (conf[c.g] || 0.85), topic: x.q.topic, deck: x.deck }; })
    .filter((x) => x.dom < 0.8).sort((a, b) => a.dom - b.dom);
}

    <div class="card weak">${ws.slice(0, 5).map((x) => { const p = Math.round(x.dom * 100); return `<div class="wk"><div class="main"><b>${esc(x.topic)}</b><span>${esc(x.deck.title)}</span></div><div class="wk-m"><span class="bar"><i class="${p < 50 ? 'r' : 'o'}" style="width:${Math.max(6, p)}%"></i></span><span class="num">${p}%</span></div></div>`; }).join('')}

async function api(method, path, body, opts = {}) {

  let r;

document.addEventListener('submit', async (e) => {
  const f = e.target.dataset && e.target.dataset.form;
  if (f === 'pw') {
    e.preventDefault(); if (acct.busy) return;
    const cur = document.getElementById('pw-cur').value, nx = document.getElementById('pw-new').value;
    if (nx.length < 8) { acct.pwErr = 'A nova senha precisa ter pelo menos 8 caracteres.'; return render(); }
    acct.busy = true;
    try { await api('POST', 'auth/password', { current: cur, next: nx }); acct.pwOpen = false; acct.pwErr = ''; notify('Senha alterada. Os outros aparelhos foram desconectados.'); }
    catch (er) { acct.pwErr = er.message; }
    acct.busy = false; render();
  } else if (f === 'del') {
    e.preventDefault(); if (acct.busy) return;
    acct.busy = true;
    try { await api('DELETE', 'auth/me', { password: document.getElementById('del-pass').value }); notify('Conta excluída.'); setTimeout(logout, 600); }
    catch (er) { acct.delErr = er.message; acct.busy = false; render(); }
  }
});

function registerSW() {

    const offer = (w) => { if (w && hadController) showUpdate(w); };
    if (reg.waiting) offer(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') offer(w); }); });
    setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);

    API.on = true; API.db = !!j.db; API.ai = !!j.ai; API.email = !!j.email;
  } catch (e) { return; }
  if (API.db) {
    try { API.user = (await api('GET', 'auth/me')).user; } catch (e) { API.user = null; }
    if (API.user) await syncAll();
    else if (API.classes.length) { API.classes = []; saveClassesCache(); refreshClassDecks(); }
  }
  await handleLinks();
  await handleShortcut();
  await handleReset();
  registerSW();
  rerender();
}

/* ================= Inicialização ================= */
render();
initCloud();
initServer();
(async () => {
  try { if (window.claude && typeof window.claude.use === 'function') SAMPLE = await window.claude.use('sample'); } catch (e) { SAMPLE = null; }
  sampleChecked = true;
  if (S.user.onboarded && !ui.session) render();
})();

</script>
