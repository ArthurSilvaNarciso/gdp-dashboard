rdenadora quer saber quantos chamados abertos são de prioridade alta.","q":"Qual fórmula retorna essa contagem?","a":1,"src":"Excel: CONT.SES","o":[{"t":"=CONT.SE(A:A;\"Aberto\";B:B;\"Alta\")","p":"troca","w":"CONT.SE aceita só um intervalo e um critério. Com quatro argumentos, o Excel nem aceita a fórmula e avisa que há argumentos demais."},{"t":"=CONT.SES(A:A;\"Aberto\";B:B;\"Alta\")","p":"correta","w":"CONT.SES conta as linhas que atendem a todos os critérios ao mesmo tempo: status Aberto e prioridade Alta na mesma linha."},{"t":"=CONT.SE(A:A;\"Aberto\")+CONT.SE(B:B;\"Alta\")","p":"calculo","w":"Soma duas contagens separadas: conta duas vezes os abertos de prioridade alta e ainda inclui os fechados de prioridade alta."},{"t":"=CONT.VALORES(A:A)","p":"generalizacao","w":"CONT.VALORES conta qualquer célula preenchida, inclusive o cabeçalho e os chamados fechados. Não aplica critério nenhum."}]},{"id":"excel8","topic":"ÍNDICE e CORRESP","c":"Na planilha do RH da Construtora Horizonte, a coluna A tem a matrícula, a coluna B tem o nome e a coluna C tem o CPF. Em H2 você digita um CPF e quer que a matrícula correspondente apareça em I2.","q":"Qual fórmula deve ser escrita em I2?","a":3,"src":"Excel: ÍNDICE e CORRESP","o":[{"t":"=ÍNDICE(C:C;CORRESP(H2;A:A;0))","p":"inversao","w":"Trocou os papéis das colunas: procura o CPF na coluna de matrículas e devolveria um CPF. O CORRESP deve procurar em C e o ÍNDICE deve retornar de A."},{"t":"=PROCV(H2;A:C;1;FALSO)","p":"troca","w":"O PROCV sempre procura na primeira coluna da matriz, que aqui é a matrícula. Ele não busca o CPF na coluna C para retornar algo à esquerda, e daria #N/D."},{"t":"=ÍNDICE(A:A;CORRESP(H2;C:C;1))","p":"calculo","w":"O tipo 1 faz correspondência aproximada e exige dados em ordem crescente. Com CPFs fora de ordem, pode trazer a matrícula de outra pessoa. Use 0."},{"t":"=ÍNDICE(A:A;CORRESP(H2;C:C;0))","p":"correta","w":"CORRESP encontra a linha do CPF na coluna C (0 = correspondência exata) e ÍNDICE devolve a matrícula dessa mesma linha na coluna A, mesmo estando à esquerda."}]},{"id":"excel9","topic":"SEERRO","c":"Na planilha de vendas de uma rede de farmácias de Recife, a célula D2 tem =C2/B2 (faturamento dividido pela quantidade vendida). Nos produtos que não venderam nada no mês, B2 vale 0 e aparece #DIV/0!. O gerente quer ver 0 nesses casos.","q":"Qual solução atende ao pedido?","a":0,"src":"Excel: SEERRO","o":[{"t":"=SEERRO(C2/B2;0)","p":"correta","w":"SEERRO(valor; valor_se_erro) calcula C2/B2 e, se o resultado for um erro, mostra 0. Quando não há erro, mostra a divisão normalmente."},{"t":"=SEERRO(0;C2/B2)","p":"inversao","w":"Inverteu os argumentos. O primeiro é o valor testado; como 0 não é erro, a fórmula mostraria 0 em todas as linhas, inclusive nas que venderam."},{"t":"=SE(C2/B2=0;0;C2/B2)","p":"calculo","w":"Quando B2 é 0, a divisão já gera #DIV/0! dentro do próprio teste do SE, e o erro continua aparecendo. O teste correto seria sobre B2, não sobre o resultado."},{"t":"Formatar a coluna D como Número com duas casas decimais.","p":"troca","w":"A formatação muda só a aparência de valores válidos. Ela não transforma um erro em 0."}]},{"id":"excel10","topic":"Formatação condicional","c":"No controle de contas a pagar de um escritório em Curitiba, a tabela ocupa A2:F100 e a coluna E traz a data de vencimento. A coordenadora quer que as linhas com vencimento já passado fiquem vermelhas automaticamente, atualizando a cada dia.","q":"Qual regra de formatação condicional, aplicada a A2:F100, faz isso?","a":2,"src":"Excel: formatação condicional com fórmula","o":[{"t":"=$E2>HOJE()","p":"inversao","w":"O sinal está invertido. Essa regra pintaria as contas que ainda vão vencer, e não as vencidas."},{"t":"=E2<HOJE()","p":"calculo","w":"Sem o $ na coluna, a referência se desloca: a célula B2 testaria F2, a C2 testaria G2, e assim por diante. A linha não ficaria vermelha por inteiro."},{"t":"=$E2<HOJE()","p":"correta","w":"O $ trava a coluna E e deixa a linha variar, então cada célula da linha testa o vencimento da própria linha. HOJE() é recalculada todo dia."},{"t":"Em vez de regra, classificar a coluna E da data mais antiga para a mais nova.","p":"troca","w":"Classificar muda a ordem das linhas, mas não destaca nada e não diferencia o que já venceu do que ainda vai vencer."}]},{"id":"excel11","topic":"Validação de dados","c":"Na planilha de pedidos compartilhada pela equipe comercial de Belo Horizonte, a coluna C (Estado) recebe \"MG\", \"mg\", \"Minas\" e \"M.G.\", o que estraga os relatórios. Você quer impedir que alguém digite algo fora de uma lista de siglas.","q":"Qual recurso resolve o problema na origem?","a":3,"src":"Excel: Dados > Validação de Dados","o":[{"t":"Remover duplicadas na coluna C.","p":"troca","w":"Remover duplicadas apaga linhas com valores repetidos. Aqui apagaria pedidos legítimos do mesmo estado e não impediria novas digitações erradas."},{"t":"Usar Localizar e Substituir uma vez; assim os erros não voltam a acontecer.","p":"extrapolacao","w":"Localizar e Substituir corrige o que já foi digitado, mas não impede que alguém digite errado amanhã."},{"t":"Proteger a planilha inteira com senha.","p":"generalizacao","w":"Bloqueia tudo, inclusive o lançamento correto de pedidos. O objetivo é restringir os valores da coluna C, não travar a planilha."},{"t":"Validação de dados, permitindo apenas valores de uma Lista com as siglas dos estados.","p":"correta","w":"A validação com Lista cria um menu suspenso e recusa qualquer valor fora dele, padronizando a coluna já no momento da digitação."}]},{"id":"excel12","topic":"FILTRO","c":"No Microsoft 365, a base de chamados de uma prefeitura ocupa A2:D500 e a coluna C traz o setor responsável. Em outra aba, você quer que apareçam automaticamente todas as linhas do setor \"Obras\", atualizadas sempre que a base mudar.","q":"Qual fórmula faz isso?","a":0,"src":"Excel 365: FILTRO","o":[{"t":"=FILTRO(A2:D500;C2:C500=\"Obras\")","p":"correta","w":"FILTRO(matriz; incluir) devolve todas as linhas que atendem à condição. O resultado se espalha pelas células abaixo e se atualiza com a base."},{"t":"=FILTRO(C2:C500=\"Obras\";A2:D500)","p":"inversao","w":"Os argumentos estão invertidos. Primeiro vem o intervalo que será devolvido; depois, a condição que decide quais linhas entram."},{"t":"=PROCV(\"Obras\";C2:D500;2;FALSO)","p":"troca","w":"O PROCV devolve só a primeira ocorrência e só uma coluna. Não lista todas as linhas do setor."},{"t":"=FILTRO(A2:D500;C:C=\"Obras\")","p":"calculo","w":"A condição precisa ter a mesma altura da matriz. Comparar 499 linhas com a coluna inteira gera erro #VALOR!."}]}]},{"id":"hist","title":"História do Brasil","subtitle":"Da Colônia à República","tag":"Escola","blurb":"Do engenho de açúcar à Constituição Cidadã: interprete fontes e situações em vez de só decorar datas.","questions":[{"id":"hist1","topic":"Ciclo do açúcar","c":"Em “Cultura e Opulência do Brasil por suas Drogas e Minas” (1711), o jesuíta André João Antonil escreveu que os escravos eram “as mãos e os pés do senhor do engenho”.","q":"O que o trecho revela sobre a economia açucareira colonial?","a":1,"src":"Antonil, Cultura e Opulência do Brasil (1711)","o":[{"t":"A produção era voltada sobretudo ao mercado interno, e a metrópole comprava apenas o excedente.","p":"inversao","w":"Inverte o sentido da economia colonial. O açúcar era produzido em grandes propriedades para exportação à Europa."},{"t":"A produção de açúcar dependia do trabalho de africanos escravizados, base da economia dos engenhos.","p":"correta","w":"A metáfora mostra que todo o trabalho do engenho, da lavoura à moenda, era feito por pessoas escravizadas, sobretudo africanas."},{"t":"A base da produção era o trabalho assalariado de imigrantes europeus.","p":"troca","w":"Confunde períodos. A imigração europeia em larga escala para a lavoura ocorreu no fim do século XIX, sobretudo nos cafezais paulistas."},{"t":"Os indígenas nunca foram escravizados na colônia, por isso foi preciso trazer africanos.","p":"generalizacao","w":"Indígenas foram escravizados, sobretudo no início da colonização e em regiões como São Paulo. O “nunca” torna a afirmação falsa."}]},{"id":"hist2","topic":"Inconfidência Mineira","c":"Em 1789, os moradores de Vila Rica temiam a derrama, cobrança forçada dos impostos atrasados sobre o ouro. Um grupo formado sobretudo por membros da elite local, com a participação do alferes Tiradentes, planejava um levante contra a Coroa portuguesa.","q":"Qual afirmação sobre esse movimento está correta?","a":3,"src":"Autos de Devassa da Inconfidência Mineira","o":[{"t":"Foi uma revolta popular de escravizados, soldados e artesãos, conhecida como Revolta dos Alfaiates.","p":"troca","w":"Descreve a Conjuração Baiana (1798). A Inconfidência Mineira reuniu sobretudo membros da elite de Minas."},{"t":"Os conspiradores chegaram a proclamar uma república em Vila Rica, que durou alguns meses.","p":"extrapolacao","w":"O levante nunca chegou a acontecer. O movimento foi descoberto ainda na fase de planejamento."},{"t":"Todos os líderes foram condenados à forca e executados em 1792.","p":"generalizacao","w":"Outros réus também foram condenados à morte, mas só Tiradentes foi executado. Os demais tiveram a pena comutada, em geral em degredo na África."},{"t":"Foi delatado antes de começar, e Tiradentes foi enforcado em 1792, no Rio de Janeiro.","p":"correta","w":"Joaquim Silvério dos Reis denunciou a conspiração em 1789. Tiradentes foi executado em 21 de abril de 1792."}]},{"id":"hist3","topic":"Abertura dos portos","c":"Em janeiro de 1808, poucos dias depois de chegar a Salvador fugindo das tropas de Napoleão, o príncipe regente D. João assinou a carta régia de abertura dos portos. Comerciantes ingleses logo passaram a desembarcar mercadorias no Brasil.","q":"Qual mudança essa medida provocou?","a":0,"src":"Carta Régia de 28 de janeiro de 1808","o":[{"t":"Encerrou o monopólio comercial de Portugal e permitiu o comércio direto com nações amigas, sobretudo a Inglaterra.","p":"correta","w":"A abertura dos portos rompeu o exclusivo metropolitano, base do pacto colonial, e favoreceu principalmente os produtos britânicos."},{"t":"Reforçou o pacto colonial, obrigando o Brasil a comerciar apenas com Portugal.","p":"inversao","w":"Diz o oposto. Até 1808 vigorava o monopólio português; a carta régia acabou justamente com ele."},{"t":"Tornou o Brasil independente de Portugal, já que a colônia passou a comerciar livremente.","p":"extrapolacao","w":"Liberdade comercial não é independência política. A independência só foi proclamada em 1822."},{"t":"Abriu os portos somente aos navios portugueses que escapassem do bloqueio de Napoleão.","p":"restricao","w":"A medida não se limitou a navios portugueses: abriu os portos às nações amigas de Portugal."}]},{"id":"hist4","topic":"Independência","c":"Em 9 de janeiro de 1822, contrariando as Cortes de Lisboa, que exigiam sua volta, D. Pedro declarou: “Se é para o bem de todos e felicidade geral da nação, estou pronto: diga ao povo que fico.” Meses depois, em 7 de setembro, proclamou a independência.","q":"Qual característica marcou o processo de independência do Brasil?","a":2,"src":"Dia do Fico (1822); Tratado de 1825","o":[{"t":"Foi totalmente pacífica, sem conflitos armados em nenhuma província.","p":"generalizacao","w":"Houve guerras de independência, como na Bahia, que só expulsou as tropas portuguesas em 2 de julho de 1823."},{"t":"Instituiu a República, com D. Pedro como primeiro presidente do país.","p":"troca","w":"Confunde regimes. O Brasil tornou-se um Império, e D. Pedro foi aclamado imperador; a República só veio em 1889."},{"t":"Foi conduzida pelo próprio príncipe regente, herdeiro do trono português, e manteve a monarquia e a escravidão.","p":"correta","w":"A independência partiu da própria Casa de Bragança e preservou a estrutura social, inclusive a escravidão, abolida só em 1888."},{"t":"Foi reconhecida por Portugal no mesmo dia do grito do Ipiranga.","p":"extrapolacao","w":"Portugal só reconheceu a independência em 1825, em tratado que incluiu o pagamento de indenização pelo Brasil."}]},{"id":"hist5","topic":"Lei do Ventre Livre","c":"Joana, escravizada em uma fazenda de café do Vale do Paraíba, deu à luz um filho em novembro de 1871, poucas semanas depois da aprovação da Lei Rio Branco.","q":"Qual era a situação jurídica da criança?","a":3,"src":"Lei 2.040, de 28 de setembro de 1871","o":[{"t":"Continuava escravizada, pois só a Lei Áurea libertou os filhos de mulheres escravizadas.","p":"troca","w":"Confunde as leis. A Lei Áurea (1888) aboliu a escravidão; a liberdade dos que nasciam de mãe escravizada veio com a lei de 1871."},{"t":"Nascia livre, e a mãe também era libertada automaticamente no momento do parto.","p":"extrapolacao","w":"A lei de 1871 libertava apenas os filhos nascidos a partir dela. A mãe continuava escravizada."},{"t":"Só seria livre se o senhor recebesse indenização do governo no momento do parto.","p":"restricao","w":"A liberdade não dependia de indenização no parto. A indenização era uma opção do senhor quando a criança completasse 8 anos."},{"t":"Nascia livre, mas podia ficar sob a autoridade do senhor da mãe e prestar-lhe serviços até os 21 anos.","p":"correta","w":"A lei garantia a liberdade, mas deixava a criança com o senhor até os 8 anos; depois, ele podia usar seus serviços até os 21 ou entregá-la ao Estado."}]},{"id":"hist6","topic":"Proclamação da República","c":"Sobre o 15 de novembro de 1889, o jornalista republicano Aristides Lobo escreveu: “O povo assistiu àquilo bestializado, atônito, surpreso, sem conhecer o que significava. Muitos acreditavam sinceramente estar vendo uma parada.”","q":"O que o trecho sugere sobre a Proclamação da República?","a":1,"src":"Aristides Lobo, Diário Popular (1889)","o":[{"t":"Resultou de uma grande mobilização popular, que tomou as ruas e derrubou o imperador.","p":"inversao","w":"O trecho diz o oposto: a população assistiu sem entender o que acontecia, e não como protagonista."},{"t":"Foi um movimento conduzido por militares e elites, liderado por Deodoro da Fonseca, com pouca participação popular.","p":"correta","w":"A República foi proclamada por um movimento militar, com apoio de setores da elite. O povo “bestializado” indica distância do processo."},{"t":"Mostra que a população resistiu à República e tentou impedir a queda da monarquia.","p":"extrapolacao","w":"Estar surpreso e sem entender não é resistir. A alternativa tira do texto uma conclusão que ele não sustenta."},{"t":"Prova que nenhum brasileiro defendia ideias republicanas antes de 1889.","p":"generalizacao","w":"Já havia republicanos organizados, como mostram o Manifesto Republicano de 1870 e o Partido Republicano Paulista, de 1873."}]},{"id":"hist7","topic":"Era Vargas e CLT","c":"Em 1º de maio de 1943, durante o Estado Novo, Getúlio Vargas assinou o Decreto-Lei 5.452, que aprovou a Consolidação das Leis do Trabalho (CLT).","q":"Qual característica do governo Vargas a CLT ilustra?","a":2,"src":"Decreto-Lei 5.452/1943 (CLT)","o":[{"t":"Foi aprovada pelo Congresso após amplo debate democrático, típico do Estado Novo.","p":"inversao","w":"O Estado Novo foi uma ditadura, com o Congresso fechado. A CLT foi editada por decreto-lei, sem votação parlamentar."},{"t":"Estendeu desde logo os mesmos direitos aos trabalhadores rurais e domésticos.","p":"extrapolacao","w":"Pelo art. 7º do texto original, a CLT, em regra, não se aplicava aos empregados domésticos nem aos trabalhadores rurais."},{"t":"Reuniu as leis trabalhistas em um só texto e reforçou a intervenção do Estado nas relações de trabalho.","p":"correta","w":"A CLT consolidou leis já existentes e ampliou o papel do Estado, que também controlava os sindicatos, marca do trabalhismo varguista."},{"t":"Criou o 13º salário e o FGTS, marcas do governo Vargas.","p":"troca","w":"Atribui a Vargas medidas posteriores: o 13º salário é de 1962 (governo Goulart) e o FGTS, de 1966 (regime militar)."}]},{"id":"hist8","topic":"AI-5","c":"Em 13 de dezembro de 1968, o governo Costa e Silva editou o AI-5. Um de seus artigos dizia: “Fica suspensa a garantia de habeas corpus, nos casos de crimes políticos, contra a segurança nacional, a ordem econômica e social e a economia popular.”","q":"O que esse trecho revela sobre o momento político?","a":0,"src":"Ato Institucional nº 5 (1968), art. 10","o":[{"t":"O endurecimento da ditadura militar, que retirou garantias de quem fosse acusado de crimes políticos.","p":"correta","w":"O AI-5 permitiu fechar o Congresso, cassar mandatos e suspendeu o habeas corpus para crimes políticos, abrindo o período mais repressivo do regime."},{"t":"O fim do habeas corpus para todo e qualquer crime no país.","p":"generalizacao","w":"O próprio trecho limita a suspensão a certos crimes, como os políticos e contra a segurança nacional."},{"t":"O início da abertura política, com a devolução de poderes ao Congresso.","p":"inversao","w":"É o contrário: o AI-5 concentrou poderes no Executivo. A abertura veio no fim dos anos 1970, com a revogação dos atos institucionais."},{"t":"O golpe que derrubou João Goulart e deu início ao regime militar.","p":"troca","w":"O golpe ocorreu em 1964, e o primeiro ato institucional foi editado naquele ano. O AI-5 veio quatro anos depois."}]},{"id":"hist9","topic":"Diretas Já","c":"Em 1984, comícios em cidades como São Paulo e Rio de Janeiro reuniram multidões que pediam a aprovação da emenda Dante de Oliveira, que restabelecia a eleição direta para presidente.","q":"Qual foi o resultado imediato da campanha?","a":1,"src":"Emenda Dante de Oliveira (votação de 25/4/1984); Colégio Eleitoral de 1985","o":[{"t":"A emenda foi aprovada, e Tancredo Neves foi eleito presidente pelo voto direto em 1985.","p":"extrapolacao","w":"A emenda não foi aprovada. Tancredo venceu em 1985, mas no Colégio Eleitoral, por eleição indireta."},{"t":"A emenda não obteve dois terços na Câmara, e Tancredo Neves foi eleito de forma indireta em 1985.","p":"correta","w":"Em abril de 1984, a emenda teve maioria, mas não os dois terços exigidos. O presidente seguinte saiu do Colégio Eleitoral."},{"t":"As eleições diretas aconteceram ainda em 1985, e Fernando Collor foi eleito presidente.","p":"troca","w":"Collor venceu a primeira eleição direta após o regime militar, mas ela ocorreu em 1989."},{"t":"A campanha foi organizada pelos militares para dar legitimidade à continuidade do regime.","p":"inversao","w":"Inverte os papéis. As Diretas Já reuniram partidos de oposição e sociedade civil contra o regime militar."}]},{"id":"hist10","topic":"Constituição de 1988","c":"O deputado Ulysses Guimarães, presidente da Assembleia Nacional Constituinte, chamou de “Constituição Cidadã” a Carta promulgada em 5 de outubro de 1988, após o fim do regime militar.","q":"O que justifica esse apelido?","a":3,"src":"CF/88, art. 5º, XLII, e art. 14, §1º, II","o":[{"t":"Ter instituído pela primeira vez o direito de voto das mulheres no Brasil.","p":"troca","w":"O voto feminino veio com o Código Eleitoral de 1932 e foi incorporado à Constituição de 1934."},{"t":"Ter sido aprovada diretamente pela população em um plebiscito nacional.","p":"extrapolacao","w":"A Constituição foi elaborada e promulgada pela Assembleia Nacional Constituinte, sem plebiscito de aprovação."},{"t":"Garantir direitos apenas a quem tem título de eleitor, isto é, aos cidadãos em sentido estrito.","p":"restricao","w":"Os direitos fundamentais valem para todos, inclusive para quem não vota. O apelido se refere à ampliação de direitos, não a um limite."},{"t":"Ter ampliado direitos e garantias, como o voto facultativo aos 16 anos e o racismo como crime inafiançável e imprescritível.","p":"correta","w":"Após a ditadura, a Carta ampliou direitos civis, políticos e sociais. O voto aos 16 está no art. 14 e o racismo como crime, no art. 5º, XLII."}]}]},{"id":"info","title":"Informática para concursos","subtitle":"Windows, Office e internet","tag":"Concursos","blurb":"Atalhos, planilhas, protocolos, backup, nuvem e e-mail: o que mais cai nas provas de informática, em casos práticos do dia a dia.","questions":[{"id":"info1","topic":"Atalhos do Windows","c":"Marcos, servidor de uma prefeitura em Natal, vai sair para o almoço e deixará o computador ligado, com uma planilha aberta no meio do trabalho.","q":"Qual afirmação sobre atalhos do Windows está correta?","a":1,"src":"Microsoft: atalhos de teclado do Windows","o":[{"t":"Ctrl + Z refaz a última ação que foi desfeita.","p":"inversao","w":"É o contrário: Ctrl + Z desfaz a última ação. Para refazer, o atalho usual é Ctrl + Y."},{"t":"Win + L bloqueia a sessão sem fechar os programas abertos.","p":"correta","w":"Win + L bloqueia o computador na hora. Para voltar, é preciso a senha, e a planilha continua aberta do jeito que estava."},{"t":"Alt + Tab fecha a janela ativa.","p":"troca","w":"Alt + Tab alterna entre as janelas abertas. Quem fecha a janela ativa é Alt + F4."},{"t":"Win + L encerra a sessão e fecha todos os programas, como um logoff.","p":"extrapolacao","w":"Bloquear não é sair. O logoff encerra a sessão e fecha os programas; o bloqueio só protege a tela e mantém tudo aberto."}]},{"id":"info2","topic":"Quebra de página","c":"Paula está formatando um relatório no Word e, para começar cada capítulo em uma página nova, aperta Enter várias vezes. Sempre que ela edita o texto acima, os títulos saem do lugar.","q":"Qual é a solução adequada?","a":3,"src":"Microsoft Word: inserir quebra de página","o":[{"t":"Usar Shift + Enter no fim do capítulo, que cria uma página nova.","p":"troca","w":"Shift + Enter insere uma quebra de linha manual, sem criar parágrafo novo. Não leva o texto para a próxima página."},{"t":"Continuar usando Enter, mas só depois de terminar de editar todo o texto.","p":"restricao","w":"Funciona só até a próxima alteração. Qualquer revisão posterior volta a deslocar os títulos."},{"t":"Inserir uma quebra de página logo depois do título de cada capítulo.","p":"inversao","w":"A quebra no lugar errado separa o título do texto: o título fica no fim de uma página e o capítulo começa na seguinte."},{"t":"Inserir uma quebra de página antes de cada capítulo, com Ctrl + Enter.","p":"correta","w":"A quebra de página força o início do capítulo na página seguinte, não importa quanto texto haja antes. Ctrl + Enter funciona no Word e no Writer."}]},{"id":"info3","topic":"Referências mistas","c":"Na planilha de estoque do almoxarifado de um tribunal, a célula C3 contém a fórmula =A$1+$B2. O técnico copia C3 e cola em D5.","q":"Qual fórmula aparecerá em D5?","a":0,"src":"Planilhas: referências relativas, absolutas e mistas","o":[{"t":"=B$1+$B4","p":"correta","w":"De C3 para D5, anda 1 coluna e 2 linhas. Em A$1, a coluna vira B e a linha fica travada. Em $B2, a coluna fica travada e a linha vai de 2 para 4."},{"t":"=A$1+$B2","p":"generalizacao","w":"Supõe que qualquer $ trava a referência inteira. O $ trava só a parte que vem logo depois dele: a linha em A$1 e a coluna em $B2."},{"t":"=B$3+$C4","p":"calculo","w":"Deslocou linha e coluna de todas as referências, ignorando os $. As partes travadas não mudam ao copiar."},{"t":"=$A3+C$2","p":"inversao","w":"Inverteu o papel do $: travou o que estava livre e deslocou o que estava travado."}]},{"id":"info4","topic":"Protocolos de e-mail","c":"Juliana, analista de uma agência reguladora, lê o e-mail institucional no notebook, no celular e no computador do escritório. Ela quer que mensagens, pastas e marcações de lido fiquem iguais em todos, mantidas no servidor.","q":"Qual protocolo de recebimento atende melhor a essa necessidade?","a":2,"src":"Protocolos de e-mail: SMTP, POP3 e IMAP","o":[{"t":"POP3, que baixa as mensagens para o aparelho.","p":"troca","w":"O POP3 foi feito para baixar mensagens para um dispositivo. Ele não sincroniza pastas nem marcações entre vários aparelhos."},{"t":"SMTP, que é o protocolo usado para receber e-mails.","p":"inversao","w":"Inverteu a função. O SMTP é o protocolo de envio de mensagens; para receber, usam-se POP3 ou IMAP."},{"t":"IMAP, que mantém as mensagens no servidor e sincroniza os aparelhos.","p":"correta","w":"Com IMAP, as mensagens e pastas ficam no servidor, e cada aparelho apenas as acessa. Lido, movido ou apagado em um aparece igual nos outros."},{"t":"POP3, desde que ela use o mesmo programa de e-mail em todos os aparelhos.","p":"restricao","w":"Usar o mesmo programa não muda o funcionamento do protocolo. O POP3 continua sem sincronizar pastas e marcações."}]},{"id":"info5","topic":"RAM e armazenamento","c":"O computador de um cartório em Ribeirão Preto fica lento quando vários programas estão abertos, embora o SSD de 512 GB ainda tenha 300 GB livres. O técnico sugere aumentar a memória RAM de 4 GB para 16 GB.","q":"Por que a sugestão do técnico faz sentido?","a":2,"src":"Arquitetura de computadores: memória principal e secundária","o":[{"t":"Não faz sentido: com 300 GB livres no SSD, o computador já tem memória de sobra.","p":"troca","w":"Confunde armazenamento com RAM. O SSD guarda arquivos; os programas em execução precisam de espaço na RAM."},{"t":"Porque a RAM, ao contrário do SSD, mantém os dados mesmo com o computador desligado.","p":"inversao","w":"É o contrário. A RAM é volátil e perde o conteúdo ao desligar; o SSD é que guarda os dados de forma permanente."},{"t":"Porque a RAM guarda temporariamente os programas e dados em uso; com pouca RAM, o sistema recorre ao disco, que é mais lento.","p":"correta","w":"Quando a RAM acaba, o sistema usa parte do disco como extensão da memória, o que é bem mais lento. Mais RAM permite manter mais programas abertos com fluidez."},{"t":"Porque mais RAM aumenta também o espaço disponível para salvar arquivos.","p":"extrapolacao","w":"A RAM não é usada para salvar arquivos. O espaço de armazenamento continua sendo o do SSD."}]},{"id":"info6","topic":"Extensões de arquivo","c":"Um servidor de uma secretaria estadual recebe um e-mail com o anexo boleto_pagamento.pdf.exe e a mensagem \"segue o boleto em PDF\".","q":"Que tipo de arquivo é esse anexo?","a":0,"src":"Windows: extensões de nome de arquivo","o":[{"t":"Um executável, pois a extensão que vale é a última, depois do último ponto.","p":"correta","w":"A extensão real é .exe, que indica um programa. O .pdf no meio do nome é só parte do nome, um truque comum para enganar quem lê rápido."},{"t":"Um PDF, pois a extensão .pdf aparece no nome.","p":"inversao","w":"Leu a extensão na ordem errada. O que define o tipo é o trecho após o último ponto, que aqui é .exe."},{"t":"Um PDF e um executável ao mesmo tempo, que abre nos dois programas.","p":"extrapolacao","w":"Um arquivo tem uma única extensão efetiva. O Windows o trata como programa, por causa do .exe final."},{"t":"Só seria um executável se a extensão estivesse em maiúsculas, como .EXE.","p":"restricao","w":"No Windows, extensões não diferenciam maiúsculas de minúsculas. .exe e .EXE são a mesma coisa."}]},{"id":"info7","topic":"Backup diferencial","c":"Um escritório de contabilidade em Londrina faz backup completo no domingo e backups diferenciais de segunda a sábado. Na quinta de manhã, o servidor falha e é preciso recuperar os dados como estavam na quarta à noite.","q":"O que precisa ser restaurado?","a":3,"src":"Tipos de backup: completo, incremental e diferencial","o":[{"t":"O completo de domingo e os backups de segunda, terça e quarta.","p":"troca","w":"Esse é o procedimento do backup incremental, em que cada cópia só tem o que mudou desde o backup anterior."},{"t":"Apenas o diferencial de quarta, pois ele já contém tudo.","p":"extrapolacao","w":"O diferencial tem só o que mudou desde o último completo. Sem o completo de domingo, faltariam os arquivos que não mudaram."},{"t":"O diferencial de quarta e, depois dele, o completo de domingo.","p":"inversao","w":"A ordem está invertida. Restaurar o completo por último sobrescreveria as versões mais novas pelas de domingo."},{"t":"O completo de domingo e, depois, apenas o diferencial de quarta.","p":"correta","w":"Cada diferencial acumula tudo o que mudou desde o último completo. Basta o completo seguido do diferencial mais recente."}]},{"id":"info8","topic":"Modelos de nuvem","c":"Uma prefeitura em Maringá passou a usar e-mail, editor de textos e planilhas de um pacote on-line pelo navegador, sem instalar servidores nem cuidar das atualizações do software.","q":"Em qual modelo de serviço de nuvem isso se enquadra?","a":1,"src":"NIST SP 800-145: definição de computação em nuvem","o":[{"t":"IaaS, em que a prefeitura contrata só servidores virtuais e instala ela mesma os programas.","p":"troca","w":"No IaaS, o cliente recebe a infraestrutura e cuida do sistema e dos aplicativos. Não é o caso de quem só usa o software pronto."},{"t":"SaaS, em que o fornecedor entrega o software pronto e cuida da infraestrutura e das atualizações.","p":"correta","w":"No SaaS (software como serviço), o usuário só usa a aplicação, geralmente pelo navegador. Servidores, manutenção e atualizações ficam com o fornecedor."},{"t":"Nuvem privada, pois todo serviço usado por órgão público é privado por definição.","p":"generalizacao","w":"Ser órgão público não torna a nuvem privada. Um pacote on-line oferecido a muitos clientes é um serviço de nuvem pública."},{"t":"Não é nuvem, pois só há computação em nuvem quando os dados ficam em servidores no exterior.","p":"restricao","w":"A localização dos servidores não define a nuvem. O que importa é o acesso a recursos sob demanda, pela rede, oferecidos por um provedor."}]},{"id":"info9","topic":"Partes da URL","c":"No material de um curso, aparece o endereço https://loja.cafebrasil.com.br/produtos/moido, de uma empresa fictícia.","q":"Assinale a identificação correta das partes dessa URL.","a":0,"src":"RFC 3986: sintaxe de URI","o":[{"t":"https é o protocolo, cafebrasil.com.br é o domínio, loja é um subdomínio e /produtos/moido é o caminho.","p":"correta","w":"O protocolo vem antes de ://. Depois vem o nome do servidor (subdomínio + domínio) e, após a primeira barra, o caminho do recurso."},{"t":"O domínio é apenas .br, e cafebrasil é o nome da página.","p":"troca","w":".br é o domínio de primeiro nível, que indica o país. O domínio registrado pela empresa é cafebrasil.com.br."},{"t":"O domínio é /produtos/moido e loja.cafebrasil.com.br é o caminho.","p":"inversao","w":"Inverteu as partes. O nome do servidor vem antes da primeira barra; o caminho vem depois dela."},{"t":"Tudo o que vem depois de https:// faz parte do domínio.","p":"generalizacao","w":"O domínio termina na primeira barra. O que vem depois, como /produtos/moido, é o caminho dentro do site."}]},{"id":"info10","topic":"Cc e Cco","c":"A secretária de uma escola estadual em Belém vai enviar um comunicado por e-mail para 150 pais. Os pais não devem ver os endereços uns dos outros.","q":"Como ela deve endereçar a mensagem?","a":3,"src":"Clientes de e-mail: campos Para, Cc e Cco","o":[{"t":"Colocar os endereços dos pais em Cc, que esconde os destinatários.","p":"troca","w":"Cc (com cópia) mostra os endereços a todos que recebem. Quem oculta é o Cco (com cópia oculta)."},{"t":"Colocar os endereços em Cco, mas saber que cada pai verá os demais se clicar em Responder a todos.","p":"extrapolacao","w":"Os endereços em Cco não aparecem para os outros destinatários, nem ao responder a todos."},{"t":"Colocar todos em Para, pois os provedores ocultam a lista quando há mais de 100 destinatários.","p":"restricao","w":"Não existe essa regra. Endereços em Para ficam visíveis para todos, qualquer que seja a quantidade."},{"t":"Colocar os endereços dos pais em Cco (cópia oculta).","p":"correta","w":"No Cco, cada destinatário recebe a mensagem sem ver os demais endereços. Isso protege a privacidade dos pais."}]}]},{"id":"lgpd","questions":[{"id":"lgpd7","topic":"Controlador e operador","c":"A rede de academias FitSul, de Porto Alegre, decide quais dados dos alunos coletar e para quê. Ela contratou uma empresa de software que hospeda e processa esse cadastro seguindo as instruções da FitSul.","q":"Como cada empresa se classifica segundo a LGPD?","a":2,"src":"LGPD, art. 5º, VI e VII, e art. 39","o":[{"t":"A empresa de software é a controladora e a FitSul é a operadora.","p":"inversao","w":"Os papéis estão invertidos. Quem toma as decisões sobre o tratamento é a FitSul; quem trata os dados em nome dela é a empresa de software."},{"t":"As duas são controladoras, pois ambas têm acesso aos dados.","p":"generalizacao","w":"Ter acesso aos dados não torna ninguém controlador. O que define o controlador é a competência para decidir sobre o tratamento."},{"t":"A FitSul é a controladora e a empresa de software é a operadora.","p":"correta","w":"Controlador é a quem competem as decisões sobre o tratamento (art. 5º, VI). Operador é quem realiza o tratamento em nome do controlador e segundo suas instruções (art. 5º, VII, e art. 39)."},{"t":"A empresa de software passa a ser a encarregada (DPO) da FitSul.","p":"troca","w":"O encarregado é o canal de comunicação com titulares e ANPD. Prestar o serviço de processamento faz da empresa uma operadora, não encarregada."}]},{"id":"lgpd8","topic":"Pseudonimização","c":"Um hospital de Campinas trocou nomes e CPFs dos pacientes por códigos em uma planilha usada em um estudo interno. A tabela que liga cada código ao paciente fica guardada em outro sistema, protegido e separado.","q":"Como a LGPD trata esse procedimento?","a":0,"src":"LGPD, art. 5º, III e XI, art. 12 e art. 13, § 4º","o":[{"t":"É pseudonimização: como a tabela permite reidentificar os pacientes, os dados continuam sendo pessoais.","p":"correta","w":"Na pseudonimização, o dado só volta a ser associado à pessoa com uma informação adicional mantida em separado (art. 13, § 4º). Como é reversível, a proteção da LGPD continua valendo."},{"t":"É anonimização, e a LGPD deixa de se aplicar à planilha.","p":"troca","w":"Anonimização exige que o dado perca a possibilidade de associação ao indivíduo. Aqui a associação é possível pela tabela, então não é anonimização."},{"t":"É pseudonimização, e por isso o hospital fica dispensado de cumprir a LGPD nessa planilha.","p":"extrapolacao","w":"Acertou o nome, mas errou o efeito. A lei afasta a aplicação só para dados anonimizados de forma irreversível (art. 12), não para pseudonimizados."},{"t":"É anonimização, que é reversível; a pseudonimização é que não pode ser desfeita.","p":"inversao","w":"Os conceitos estão trocados. A anonimização busca impedir a reidentificação; a pseudonimização permite reidentificar com a informação guardada à parte."}]},{"id":"lgpd9","topic":"Dados de crianças","c":"Uma startup de Recife lançou um aplicativo de jogos educativos para crianças de 8 a 11 anos. Para liberar o jogo, ela exige nome completo, endereço, escola e foto da criança, embora o jogo só precise de um apelido e da idade.","q":"Essa exigência está de acordo com a LGPD?","a":3,"src":"LGPD, art. 14, § 4º","o":[{"t":"Sim, desde que os pais tenham aceitado os termos de uso do aplicativo.","p":"extrapolacao","w":"A concordância dos pais não autoriza exigir dados além do necessário. A vedação do art. 14, § 4º, vale mesmo com consentimento."},{"t":"Sim, porque a LGPD só protege dados de pessoas maiores de 18 anos.","p":"restricao","w":"A LGPD protege titulares de qualquer idade e tem um artigo próprio, o 14, para dados de crianças e adolescentes."},{"t":"Não, porque a LGPD proíbe qualquer tratamento de dados de crianças.","p":"generalizacao","w":"A lei não proíbe. Ela permite o tratamento, desde que no melhor interesse da criança e com as salvaguardas do art. 14."},{"t":"Não: o controlador não pode condicionar a participação da criança em jogos a dados além dos estritamente necessários.","p":"correta","w":"O art. 14, § 4º, proíbe condicionar a participação de crianças em jogos e aplicações de internet ao fornecimento de dados além dos estritamente necessários à atividade."}]},{"id":"lgpd10","topic":"Princípio da necessidade","c":"No cadastro para entrega, uma loja de móveis de Joinville pede nome, endereço e telefone, mas também renda mensal, estado civil e profissão do cliente. Essas três últimas informações não são usadas para nada.","q":"Qual princípio da LGPD a loja desrespeita mais diretamente?","a":1,"src":"LGPD, art. 6º, III","o":[{"t":"Livre acesso, que garante ao titular consultar seus dados.","p":"troca","w":"Livre acesso é o direito de consultar, de forma facilitada e gratuita, como os dados são tratados. O problema aqui é coletar dados demais."},{"t":"Necessidade, que limita o tratamento ao mínimo necessário para a finalidade.","p":"correta","w":"O princípio da necessidade exige dados pertinentes, proporcionais e não excessivos em relação à finalidade. Renda e estado civil não servem para uma entrega."},{"t":"Nenhum, pois qualquer dado fornecido voluntariamente pelo cliente pode ser coletado.","p":"generalizacao","w":"O fato de o cliente preencher o campo não dispensa os princípios. A coleta continua limitada ao que a finalidade exige."},{"t":"Segurança, pois o problema só existiria se esses dados vazassem.","p":"restricao","w":"Cria uma condição que não existe. Coletar dados excessivos já viola a lei, mesmo que nunca haja vazamento."}]},{"id":"lgpd11","topic":"Eliminação dos dados","c":"Logo após ser desligada de uma transportadora de Campinas, uma ex-funcionária pede que a empresa apague todos os dados dela, inclusive os registros trabalhistas e de pagamento.","q":"Como a empresa deve agir?","a":3,"src":"LGPD, art. 15, art. 16, I, e art. 18, VI","o":[{"t":"Apagar tudo imediatamente, pois após o término do tratamento os dados devem ser eliminados sem exceção.","p":"generalizacao","w":"A regra de eliminação tem exceções. O art. 16 autoriza conservar dados para cumprir obrigação legal ou regulatória."},{"t":"Manter todos os dados por tempo indeterminado, já que foram coletados de forma legal.","p":"extrapolacao","w":"Coleta legal não autoriza guardar tudo para sempre. Terminado o tratamento, o que não tiver base para conservação deve ser eliminado."},{"t":"Aguardar autorização da ANPD, que precisa aprovar cada pedido de eliminação.","p":"restricao","w":"Não existe essa etapa. O titular faz o pedido diretamente ao controlador, que responde sem precisar de aval da ANPD."},{"t":"Conservar os dados necessários para cumprir obrigações legais, como as trabalhistas, e eliminar os demais.","p":"correta","w":"O art. 16, I, permite manter dados para cumprimento de obrigação legal ou regulatória. O que não se enquadrar nas exceções deve ser eliminado."}]},{"id":"lgpd12","topic":"Transferência internacional","c":"Uma empresa de software de Florianópolis quer armazenar o banco de dados dos clientes brasileiros em servidores de um provedor de nuvem nos Estados Unidos.","q":"O que a LGPD diz sobre essa transferência internacional?","a":0,"src":"LGPD, art. 33 e art. 3º","o":[{"t":"É permitida se se enquadrar em uma das hipóteses do art. 33, como cláusulas-padrão contratuais ou consentimento específico do titular.","p":"correta","w":"O art. 33 lista os casos em que a transferência é permitida, entre eles garantias contratuais (como cláusulas-padrão) e o consentimento específico e em destaque do titular."},{"t":"É proibida, porque dados de brasileiros não podem sair do país.","p":"generalizacao","w":"A lei não proíbe a transferência. Ela a permite nas hipóteses do art. 33."},{"t":"É livre, porque a LGPD só vale para dados armazenados no Brasil.","p":"restricao","w":"O art. 3º diz que a LGPD se aplica independentemente do país onde os dados estejam, se a operação ocorrer no Brasil, visar pessoas localizadas aqui ou os dados tiverem sido coletados no país."},{"t":"Depende sempre de autorização prévia da ANPD, em todos os casos.","p":"extrapolacao","w":"A autorização da ANPD é só uma das hipóteses do art. 33 (inciso V). Há outras, como cláusulas contratuais e consentimento."}]}]},{"id":"logica","questions":[{"id":"logica7","topic":"Negação de “nenhum”","c":"No relatório de uma prova do concurso dos Correios, o fiscal escreveu: “Nenhum candidato da sala 12 faltou.” Depois, a coordenação constatou que o registro estava errado.","q":"Qual frase expressa a negação lógica do registro do fiscal?","a":2,"src":"Lógica de quantificadores: ~(nenhum A é B) ≡ algum A é B","o":[{"t":"Todo candidato da sala 12 faltou.","p":"inversao","w":"É a proposição contrária, não a negação. Para derrubar “nenhum”, basta um caso; não é preciso que todos tenham faltado."},{"t":"Todos os candidatos da sala 12 compareceram.","p":"troca","w":"Diz a mesma coisa que o registro original, com outras palavras. É uma equivalência, não uma negação."},{"t":"Algum candidato da sala 12 faltou.","p":"correta","w":"A negação de “nenhum A é B” é “algum A é B”. Basta que um candidato tenha faltado para o registro ser falso."},{"t":"Algum candidato da sala 12 não faltou.","p":"calculo","w":"Trocou o quantificador e também negou o verbo. “Algum não faltou” é compatível com o registro original, então não o nega."}]},{"id":"logica8","topic":"Bicondicional","c":"O gerente de uma agência bancária em Campinas anunciou: “Paulo receberá o bônus se, e somente se, bater a meta do mês.”","q":"Em qual situação a afirmação do gerente é falsa?","a":1,"src":"Bicondicional: p ↔ q é falsa quando p e q têm valores diferentes","o":[{"t":"Paulo bateu a meta e recebeu o bônus.","p":"calculo","w":"As duas partes são verdadeiras. Na bicondicional, V ↔ V resulta em verdadeiro."},{"t":"Paulo não bateu a meta, mas recebeu o bônus.","p":"correta","w":"A bicondicional é falsa quando as partes têm valores diferentes. O “somente se” proíbe receber o bônus sem bater a meta."},{"t":"Paulo não bateu a meta e não recebeu o bônus.","p":"troca","w":"Confunde com a conjunção, em que F e F dá falso. Na bicondicional, F ↔ F é verdadeiro, porque as partes têm o mesmo valor."},{"t":"Em nenhuma situação, pois a frase só garante o que acontece quando Paulo bate a meta.","p":"restricao","w":"Lê só a ida, como se fosse uma condicional. O “somente se” acrescenta a volta: receber o bônus sem bater a meta torna a frase falsa."}]},{"id":"logica9","topic":"Tautologia","c":"Em um simulado para o concurso do INSS, Lucas precisa identificar, entre quatro proposições, aquela que é verdadeira para quaisquer valores lógicos de p e q.","q":"Qual proposição é uma tautologia?","a":3,"src":"Tabela-verdade: tautologia e contradição","o":[{"t":"p → (p ∧ q)","p":"inversao","w":"Trocou antecedente e consequente. Com p verdadeira e q falsa, fica V → F, que é falso."},{"t":"p ∧ ~p","p":"troca","w":"É uma contradição: falsa em todas as linhas da tabela, o oposto de uma tautologia."},{"t":"(p ∨ q) → p","p":"calculo","w":"Falha na linha p = F e q = V: o antecedente fica verdadeiro e o consequente, falso. Uma única linha falsa já basta para não ser tautologia."},{"t":"(p ∧ q) → p","p":"correta","w":"Se p ∧ q é verdadeira, p também é, então nunca ocorre V → F. A proposição é verdadeira nas quatro linhas da tabela."}]},{"id":"logica10","topic":"Combinação simples","c":"A Secretaria de Saúde de Porto Alegre vai formar uma comissão de 3 servidores, escolhidos entre 8 candidatos. Na comissão não há cargos: todos têm a mesma função.","q":"Quantas comissões diferentes podem ser formadas?","a":0,"src":"Análise combinatória: C(n,p) = n! ÷ [p! (n − p)!]","o":[{"t":"56","p":"correta","w":"A ordem não importa, então é combinação: C(8,3) = (8 × 7 × 6) ÷ (3 × 2 × 1) = 336 ÷ 6 = 56."},{"t":"336","p":"troca","w":"É o arranjo A(8,3) = 8 × 7 × 6, que conta a ordem. Como não há cargos, escolher Ana, Bia e Caio forma a mesma comissão que Caio, Ana e Bia."},{"t":"512","p":"extrapolacao","w":"8³ = 512 permitiria escolher a mesma pessoa mais de uma vez, o que não faz sentido em uma comissão."},{"t":"112","p":"calculo","w":"Dividiu 336 por 3 em vez de 3! = 6. Cada grupo de 3 pessoas aparece em 6 ordens diferentes no arranjo."}]},{"id":"logica11","topic":"Casa dos pombos","c":"A coordenadora de um cursinho em Fortaleza quer montar uma turma com um número de alunos que garanta, com certeza, que pelo menos três deles façam aniversário no mesmo mês.","q":"Qual é o menor número de alunos que garante isso?","a":0,"src":"Princípio da casa dos pombos (Dirichlet)","o":[{"t":"25","p":"correta","w":"No pior caso, os alunos se espalham ao máximo: 2 por mês dá 24. O 25º aluno será obrigatoriamente o terceiro de algum mês: 2 × 12 + 1 = 25."},{"t":"24","p":"calculo","w":"Esqueceu o “+ 1”. Com 24 alunos é possível haver exatamente 2 por mês, sem nenhum mês com três."},{"t":"13","p":"troca","w":"É a resposta para “pelo menos dois no mesmo mês” (12 + 1). Para garantir três, cada mês pode receber dois alunos antes da coincidência obrigatória."},{"t":"36","p":"extrapolacao","w":"36 alunos garantem três no mesmo mês, mas não é o menor número. A pergunta pede o mínimo, e 25 já bastam."}]},{"id":"logica12","topic":"Verdades e mentiras","c":"Um notebook sumiu de uma repartição em Brasília, e um dos três estagiários o pegou. Ana disse: “Foi o Caio.” Bruno disse: “Não fui eu.” Caio disse: “A Ana está mentindo.” Apenas um deles diz a verdade.","q":"Quem pegou o notebook?","a":3,"src":"Raciocínio lógico: verdades e mentiras","o":[{"t":"Caio.","p":"inversao","w":"Acreditou na acusação de Ana. Se fosse Caio, Ana e Bruno diriam a verdade, mas só um deles pode dizer a verdade."},{"t":"Ana.","p":"calculo","w":"Se fosse Ana, Bruno (“não fui eu”) e Caio (“a Ana está mentindo”) diriam a verdade: seriam dois verdadeiros, o que contradiz o enunciado."},{"t":"Não é possível determinar com as informações dadas.","p":"extrapolacao","w":"As informações bastam. Ana e Caio se contradizem, então exatamente um deles diz a verdade; logo, Bruno mente, e foi ele."},{"t":"Bruno.","p":"correta","w":"Ana e Caio se contradizem, então um deles é o único que diz a verdade, e Bruno mente. Se “não fui eu” é falso, foi Bruno. Conferindo: Ana mente e Caio diz a verdade."}]}]},{"id":"mat","questions":[{"id":"mat7","topic":"Juros compostos","c":"Júlia aplicou R$ 2.000,00 a juros compostos de 10% ao mês durante 3 meses, sem fazer retiradas. O irmão dela garante que o rendimento total foi de 30%.","q":"Qual foi o rendimento total da aplicação no período?","a":2,"src":"Juros compostos: M = C × (1 + i)ᵗ","o":[{"t":"30%, ou seja, R$ 600,00 de juros, porque basta somar as taxas mensais.","p":"troca","w":"Somar as taxas é o raciocínio dos juros simples. Nos compostos, os juros de cada mês incidem também sobre os juros anteriores."},{"t":"21%, ou seja, R$ 420,00 de juros.","p":"calculo","w":"Elevou a 2 em vez de 3: 1,1² = 1,21. Isso corresponde a apenas dois meses de aplicação."},{"t":"33,1%, ou seja, R$ 662,00 de juros.","p":"correta","w":"M = 2.000 × 1,1³ = 2.000 × 1,331 = 2.662. Os juros são 2.662 − 2.000 = 662, que equivalem a 33,1% do capital."},{"t":"Exatamente 30%, porque em prazos de poucos meses juros simples e compostos sempre coincidem.","p":"generalizacao","w":"Só coincidem no primeiro período. A partir do segundo mês, os compostos já rendem mais, como mostra 1,1³ = 1,331."}]},{"id":"mat8","topic":"Probabilidade simples","c":"Na festa junina de uma escola em Salvador, foram vendidos 200 bilhetes de rifa, numerados de 1 a 200. Marina comprou 8 bilhetes. Será sorteado um único bilhete.","q":"Qual é a probabilidade de Marina ganhar a rifa?","a":0,"src":"Probabilidade: casos favoráveis ÷ casos possíveis","o":[{"t":"4%","p":"correta","w":"P = favoráveis ÷ possíveis = 8 ÷ 200 = 0,04 = 4%, o mesmo que 1 chance em 25."},{"t":"25%","p":"inversao","w":"Inverteu a razão: fez 200 ÷ 8 = 25. Probabilidade é favoráveis sobre possíveis, por isso nunca passa de 1 (100%)."},{"t":"8%","p":"calculo","w":"Tratou os 8 bilhetes como se fossem 8 em 100. O total de bilhetes é 200, e não 100."},{"t":"96%","p":"troca","w":"Essa é a probabilidade de Marina não ganhar: 192 ÷ 200. É o evento complementar."}]},{"id":"mat9","topic":"Função do 1º grau","c":"Em uma locadora de equipamentos de Goiânia, o gráfico do valor cobrado pelo aluguel de uma betoneira, em função do número de dias, é uma reta que passa pelos pontos (0; R$ 30) e (10; R$ 80).","q":"Quanto custa alugar a betoneira por 16 dias?","a":3,"src":"Função afim: f(x) = ax + b","o":[{"t":"R$ 128,00","p":"troca","w":"Usou regra de três direta (80 ÷ 10 × 16), como se a reta passasse pela origem. Há uma taxa fixa de R$ 30, então a função é afim, não linear."},{"t":"R$ 158,00","p":"calculo","w":"Calculou a taxa como 80 ÷ 10 = 8, ignorando que a reta começa em 30. A taxa é a variação: (80 − 30) ÷ 10 = 5."},{"t":"R$ 80,00, pois a partir de 10 dias o valor deixa de subir.","p":"restricao","w":"O gráfico é uma reta. Nada no enunciado indica um teto de preço depois de 10 dias."},{"t":"R$ 110,00","p":"correta","w":"Taxa a = (80 − 30) ÷ (10 − 0) = 5 por dia, e b = 30. Então f(16) = 5 × 16 + 30 = 80 + 30 = 110."}]},{"id":"mat10","topic":"Escala em mapas","c":"Em um mapa rodoviário de escala 1:250.000, a distância em linha reta entre duas cidades do interior paulista mede 8 cm.","q":"Qual é a distância real, em linha reta, entre as cidades?","a":1,"src":"Escala: distância no mapa ÷ distância real","o":[{"t":"200 km","p":"calculo","w":"Errou a conversão: 2.000.000 cm ÷ 10.000 = 200. O certo é dividir por 100.000, pois 1 km = 100.000 cm."},{"t":"20 km","p":"correta","w":"Cada 1 cm do mapa vale 250.000 cm reais. 8 × 250.000 = 2.000.000 cm = 20.000 m = 20 km."},{"t":"312,5 m","p":"inversao","w":"Dividiu em vez de multiplicar: 250.000 ÷ 8 = 31.250 cm. Na escala, a medida do mapa é multiplicada pelo denominador."},{"t":"2 km","p":"troca","w":"Chegou a 2.000.000, mas leu como milímetros. A unidade do mapa é centímetro, então são 2.000.000 cm = 20 km."}]},{"id":"mat11","topic":"Volume do cilindro","c":"A caixa-d'água de uma escola em Teresina tem formato de cilindro, com 2 m de diâmetro e 1,5 m de altura. Use π = 3 e lembre que 1 m³ = 1.000 litros.","q":"Qual é a capacidade máxima da caixa-d'água?","a":0,"src":"Volume do cilindro: V = π × r² × h","o":[{"t":"4.500 litros","p":"correta","w":"Raio = 2 ÷ 2 = 1 m. V = 3 × 1² × 1,5 = 4,5 m³. Como 1 m³ = 1.000 L, a capacidade é 4.500 litros."},{"t":"18.000 litros","p":"calculo","w":"Usou o diâmetro no lugar do raio: 3 × 2² × 1,5 = 18 m³. O raio é a metade do diâmetro."},{"t":"4,5 litros","p":"troca","w":"O volume calculado foi 4,5 m³, e não 4,5 litros. Faltou converter: cada metro cúbico tem 1.000 litros."},{"t":"6.750 litros","p":"inversao","w":"Trocou raio e altura na fórmula: 3 × 1,5² × 1 = 6,75 m³. O que vai ao quadrado é o raio da base."}]},{"id":"mat12","topic":"Teorema de Pitágoras","c":"Um eletricista em Porto Alegre vai passar um cabo em linha reta do canto inferior esquerdo ao canto superior direito de uma parede retangular de 6 m de altura por 8 m de largura.","q":"Qual é o comprimento mínimo do cabo?","a":3,"src":"Teorema de Pitágoras: a² = b² + c²","o":[{"t":"14 m","p":"calculo","w":"Somou os lados: 6 + 8. Esse seria o caminho pelas bordas da parede, e não pela diagonal."},{"t":"Cerca de 5,3 m","p":"inversao","w":"Tratou o lado de 8 m como hipotenusa: √(64 − 36) = √28 ≈ 5,3. A diagonal é a hipotenusa e deve ser maior que os dois lados."},{"t":"48 m","p":"troca","w":"Calculou a área da parede (6 × 8 = 48 m²), e não o comprimento da diagonal."},{"t":"10 m","p":"correta","w":"A diagonal é a hipotenusa de um triângulo retângulo de catetos 6 e 8: √(36 + 64) = √100 = 10 m."}]}]},{"id":"neuro","questions":[{"id":"neuro7","topic":"Intercalação","c":"Camila vai prestar o concurso do Banco do Brasil e precisa treinar problemas de porcentagem, juros simples e regra de três. Na prova, os três tipos aparecem misturados, sem aviso de qual método usar.","q":"Qual organização do treino tende a prepará-la melhor para a prova?","a":1,"src":"Rohrer & Taylor (2007), Instructional Science","o":[{"t":"Resolver em blocos (todos de porcentagem, depois todos de juros), porque assim ela acerta mais durante o treino.","p":"inversao","w":"O treino em blocos dá mais acertos na hora, mas no teste posterior a prática intercalada vence. Confunde desempenho durante o treino com aprendizagem."},{"t":"Misturar os três tipos na mesma sessão, para treinar também a escolha do método adequado a cada problema.","p":"correta","w":"É a intercalação: ao alternar tipos, o aluno precisa identificar qual estratégia usar, exatamente o que a prova exige. Em Rohrer & Taylor (2007), quem intercalou foi muito melhor no teste final."},{"t":"Dedicar um dia inteiro a cada tipo de problema, porque assim o estudo fica espaçado ao longo da semana.","p":"troca","w":"Confunde espaçamento com intercalação. Espaçar ajuda, mas cada sessão continua em bloco e não treina a escolha do método."},{"t":"Tanto faz a ordem, desde que ela resolva o mesmo número de exercícios.","p":"generalizacao","w":"Trata a quantidade como único fator. Com o mesmo número de exercícios, a ordem muda bastante o resultado no teste final."}]},{"id":"neuro8","topic":"Efeito de geração","c":"Em um cursinho de Recife, o professor Ricardo dividiu a turma em dois grupos. O grupo A leu pares de palavras prontos, como “quente – frio”. O grupo B viu “quente – f___” e teve de completar a segunda palavra.","q":"Qual resultado a pesquisa sobre o efeito de geração prevê para um teste de memória posterior?","a":3,"src":"Slamecka & Graf (1978), Journal of Experimental Psychology: Human Learning and Memory","o":[{"t":"O grupo A lembra mais, porque leu as palavras completas e não correu o risco de errar.","p":"inversao","w":"Inverte o efeito. Ler pronto exige menos processamento; ter de produzir a palavra é justamente o que fortalece a memória."},{"t":"O grupo B lembra mais, por causa do efeito de espaçamento entre as palavras.","p":"troca","w":"Acerta o grupo, mas erra o mecanismo. Não houve intervalo entre sessões; a vantagem vem de gerar a resposta, não de espaçar o estudo."},{"t":"O grupo B lembra mais, mas apenas se revisar os pares no dia seguinte.","p":"restricao","w":"Acrescenta uma condição que o efeito não tem. A vantagem de gerar a palavra aparece mesmo sem nenhuma revisão extra."},{"t":"O grupo B lembra mais, porque produzir a palavra exige um esforço que fortalece o registro na memória.","p":"correta","w":"É o efeito de geração, descrito por Slamecka & Graf (1978): informações que o próprio aluno gera são lembradas melhor do que as que ele apenas lê."}]},{"id":"neuro9","topic":"Sono e consolidação","c":"Na véspera do ENEM, Bruno decide virar a noite estudando um conteúdo de Química que ainda não tinha visto, para chegar à prova com tudo “fresco” na cabeça.","q":"O que a pesquisa sobre sono e memória indica sobre essa decisão?","a":0,"src":"Diekelmann & Born (2010), Nature Reviews Neuroscience","o":[{"t":"É ruim: o sono ajuda a consolidar o que foi estudado, e a privação de sono também prejudica a atenção e a capacidade de aprender.","p":"correta","w":"Durante o sono, o cérebro reativa e estabiliza memórias recentes. Sem dormir, Bruno consolida menos o conteúdo novo e ainda chega à prova com a atenção comprometida."},{"t":"É boa: estudar até a hora da prova mantém a informação recente e compensa a noite sem sono.","p":"inversao","w":"Inverte a lógica. A sensação de frescor não é consolidação, e a privação de sono piora justamente a atenção e a memória de que ele vai precisar."},{"t":"Só seria ruim se ele passasse duas ou mais noites seguidas sem dormir.","p":"restricao","w":"Inventa um limite. Uma única noite sem sono já prejudica a consolidação do que foi aprendido e o desempenho no dia seguinte."},{"t":"Vai fazê-lo esquecer tudo o que estudou ao longo do ano.","p":"extrapolacao","w":"Exagera o efeito. Uma noite em claro não apaga memórias já consolidadas; o prejuízo maior recai sobre o conteúdo novo e sobre a atenção."}]},{"id":"neuro10","topic":"Multitarefa","c":"Larissa estuda Direito Administrativo com o celular ao lado. A cada poucos minutos chega uma notificação do WhatsApp, e ela para para responder. Ela diz que consegue “fazer as duas coisas ao mesmo tempo”.","q":"O que a pesquisa sobre multitarefa indica?","a":2,"src":"Rubinstein, Meyer & Evans (2001), Journal of Experimental Psychology: Human Perception and Performance","o":[{"t":"Ela faz multitarefa de verdade: o cérebro divide a atenção igualmente e processa as duas tarefas em paralelo.","p":"troca","w":"Confunde alternância com processamento paralelo. Em tarefas que exigem atenção, o cérebro não processa as duas juntas: ele salta de uma para a outra."},{"t":"Alternar entre tarefas treina o cérebro e, com o tempo, deixa o estudo mais rápido.","p":"inversao","w":"Inverte o achado. Cada troca de tarefa tem custo de tempo e de precisão; interromper o estudo o tempo todo deixa o trabalho mais lento, não mais rápido."},{"t":"Ela alterna entre as tarefas, e cada troca custa tempo e atenção, o que piora a qualidade do estudo.","p":"correta","w":"Rubinstein, Meyer & Evans (2001) mostraram que alternar tarefas gera custos de troca, em tempo e em erros, que se somam a cada interrupção."},{"t":"O prejuízo só existe quando ela responde; deixar as notificações aparecendo na tela não atrapalha.","p":"restricao","w":"Acrescenta uma condição falsa. Estudos mostram que apenas receber a notificação, sem responder, já reduz o desempenho em tarefas de atenção."}]},{"id":"neuro11","topic":"Curva do esquecimento","c":"Thiago assistiu a uma aula de duas horas sobre Direito Penal na segunda-feira e não revisou o conteúdo durante o restante do mês.","q":"Segundo a curva do esquecimento de Ebbinghaus, como tende a evoluir o que ele retém?","a":3,"src":"Ebbinghaus (1885), Über das Gedächtnis","o":[{"t":"Ele esquece pouco nos primeiros dias e cada vez mais rápido com o passar das semanas.","p":"inversao","w":"Inverte o formato da curva. A perda é mais intensa logo após o estudo e depois desacelera."},{"t":"O esquecimento só começa depois de alguns dias sem contato com o conteúdo.","p":"restricao","w":"Inventa um período de carência. A queda começa já nas primeiras horas após a aula."},{"t":"Em uma semana ele terá esquecido absolutamente tudo, sem deixar nenhum vestígio.","p":"extrapolacao","w":"Vai além dos dados. Mesmo após um mês, Ebbinghaus reaprendia o material mais rápido do que da primeira vez, sinal de que algo permaneceu."},{"t":"A perda é rápida nas primeiras horas e dias e depois desacelera, formando uma curva que vai se achatando.","p":"correta","w":"Ebbinghaus (1885) mediu a própria memória para sílabas sem sentido e encontrou esse padrão. Revisões espaçadas servem para “reerguer” a curva antes que ela caia demais."}]},{"id":"neuro12","topic":"Codificação dupla","c":"Mariana estuda as fases do processo legislativo para o concurso da Câmara dos Deputados. Em vez de só ler o texto, ela desenha um fluxograma das etapas e escreve, ao lado de cada seta, o que acontece nela.","q":"Qual princípio melhor justifica a estratégia de Mariana?","a":0,"src":"Paivio (1971), Imagery and Verbal Processes","o":[{"t":"Codificação dupla: a informação fica registrada em forma verbal e visual, o que cria mais caminhos para lembrar.","p":"correta","w":"Paivio propôs que palavras e imagens são processadas por sistemas distintos. Combinar os dois, de forma integrada, oferece duas vias de recuperação."},{"t":"Estilos de aprendizagem: ela é uma aluna “visual” e por isso só aprende bem com desenhos.","p":"troca","w":"A ideia de ensinar conforme o “estilo” de cada aluno não tem respaldo em evidências (Pashler et al., 2008). O benefício de combinar texto e imagem vale para todos."},{"t":"Sobrecarga cognitiva: misturar texto e imagem divide a atenção, então ela deveria usar só o texto.","p":"inversao","w":"Inverte o efeito. Quando palavras e imagem se complementam e aparecem juntas, a combinação favorece a compreensão e a memória (Mayer, princípio multimídia)."},{"t":"Codificação dupla, e por isso qualquer imagem ajuda, mesmo decorativa e sem relação com o conteúdo.","p":"generalizacao","w":"Generaliza demais. Imagens decorativas, sem ligação com o conteúdo, não criam a segunda via de memória e podem até distrair."}]}]},{"id":"port","questions":[{"id":"port7","topic":"Concordância nominal","c":"A assessora Juliana, da Prefeitura de Campinas, revisa quatro frases de e-mails antes de enviá-los aos secretários municipais.","q":"Assinale a frase correta quanto à concordância nominal.","a":0,"src":"Concordância nominal: anexo, meio, bastante, é proibido","o":[{"t":"Seguem anexas as planilhas com o orçamento do trimestre.","p":"correta","w":"“Anexo” é adjetivo e concorda com o substantivo a que se refere: planilhas anexas. A locução “em anexo” é que fica invariável."},{"t":"A secretária ficou meia preocupada com o atraso do repasse.","p":"troca","w":"Aqui “meio” significa “um pouco” e é advérbio, portanto invariável: “meio preocupada”. Só varia como numeral ou adjetivo, como em “meia hora”."},{"t":"Havia bastante servidores aguardando o início da reunião.","p":"inversao","w":"Antes de substantivo, “bastante” é determinante (equivale a “muitos”) e concorda: “bastantes servidores”. Fica invariável só como advérbio: “estudaram bastante”."},{"t":"É proibida entrada de pessoas sem crachá.","p":"generalizacao","w":"Sem artigo ou outro determinante, a expressão fica invariável: “É proibido entrada”. Com artigo, concorda: “É proibida a entrada”."}]},{"id":"port8","topic":"Mau ou mal","c":"Um relatório da ouvidoria de um hospital público de Salvador precisa ser corrigido antes de seguir para a diretoria.","q":"Assinale a frase em que “mau” e “mal” estão empregados corretamente.","a":2,"src":"Mau (adjetivo, oposto de bom) x mal (advérbio, oposto de bem)","o":[{"t":"O mal atendimento na recepção gerou dezenas de reclamações.","p":"troca","w":"Antes de substantivo, com sentido de ruim, usa-se o adjetivo “mau”, oposto de “bom”: “mau atendimento”."},{"t":"O novo fluxo de triagem foi mau planejado desde o início.","p":"inversao","w":"Modificando um particípio, usa-se o advérbio “mal”, oposto de “bem”: “mal planejado”, como em “bem planejado”."},{"t":"Ele não é um mau profissional; apenas se expressou mal na reunião.","p":"correta","w":"“Mau profissional” (oposto de bom profissional) é adjetivo; “expressou-se mal” (oposto de bem) é advérbio. Os dois usos estão certos."},{"t":"A coordenadora chegou de mal humor e saiu ainda mais mal-humorada.","p":"generalizacao","w":"Estende a grafia de “mal-humorado” ao substantivo. “Humor” pede o adjetivo: “mau humor”, oposto de “bom humor”."}]},{"id":"port9","topic":"Onde ou aonde","c":"No balcão de atendimento do Fórum de Belo Horizonte, um estagiário prepara respostas padronizadas para as dúvidas mais comuns do público.","q":"Assinale a frase correta quanto ao uso de “onde” e “aonde”.","a":1,"src":"Onde (lugar em que) x aonde (a + onde, com verbos de movimento)","o":[{"t":"Aonde fica o setor de protocolo?","p":"inversao","w":"“Ficar” indica permanência e não pede a preposição “a”. O correto é “Onde fica o setor de protocolo?”."},{"t":"Aonde a senhora precisa ir para retirar a certidão?","p":"correta","w":"“Ir” pede a preposição “a” (ir a algum lugar). A + onde = aonde, forma usada com verbos de movimento."},{"t":"Não sei onde o oficial de justiça foi depois do almoço.","p":"restricao","w":"A regra não se limita às perguntas diretas: vale também na interrogativa indireta. Quem vai, vai a algum lugar: “Não sei aonde o oficial de justiça foi”."},{"t":"Vivemos uma época aonde quase tudo se resolve pela internet.","p":"extrapolacao","w":"“Onde” e “aonde” indicam lugar. Para tempo, a norma-padrão pede “em que”: “uma época em que quase tudo se resolve pela internet”."}]},{"id":"port10","topic":"Há ou a","c":"A assessoria de comunicação do Tribunal Regional Eleitoral de Pernambuco revisa os avisos que serão publicados no site.","q":"Assinale a frase correta quanto ao uso de “há” e “a”.","a":3,"src":"Há (tempo decorrido) x a (tempo futuro e distância)","o":[{"t":"A sessão de julgamento começará daqui há dez minutos.","p":"inversao","w":"Para tempo futuro, usa-se a preposição “a”: “daqui a dez minutos”. “Há” indica tempo já decorrido."},{"t":"O servidor trabalha neste cartório eleitoral a doze anos.","p":"troca","w":"Tempo decorrido se indica com o verbo “haver”, que equivale a “faz”: “trabalha há doze anos”."},{"t":"O novo posto de atendimento fica há dois quilômetros da sede.","p":"generalizacao","w":"Estende o “há” a qualquer medida. Ele só indica tempo decorrido; para distância, usa-se a preposição: “fica a dois quilômetros”."},{"t":"O edital foi publicado há duas semanas, e as inscrições terminam daqui a três dias.","p":"correta","w":"“Há duas semanas” indica tempo decorrido (faz duas semanas); “daqui a três dias” indica tempo futuro, com a preposição “a”."}]},{"id":"port11","topic":"Voz passiva sintética","c":"Uma imobiliária de Curitiba pediu a um revisor que conferisse os anúncios antes de publicá-los no jornal.","q":"Assinale a frase correta quanto à concordância do verbo acompanhado do pronome “se”.","a":1,"src":"Pronome se: partícula apassivadora x índice de indeterminação do sujeito","o":[{"t":"Vende-se apartamentos de dois quartos no Batel.","p":"troca","w":"“Vender” é transitivo direto, e o “se” é partícula apassivadora: “apartamentos” é o sujeito (apartamentos são vendidos). O verbo vai ao plural: “Vendem-se”."},{"t":"Alugam-se salas comerciais no centro da cidade.","p":"correta","w":"Voz passiva sintética: “salas comerciais” é o sujeito (salas são alugadas), e o verbo concorda com ele no plural."},{"t":"Precisam-se de corretores com experiência em vendas.","p":"generalizacao","w":"“Precisar de” é transitivo indireto. Aqui o “se” indetermina o sujeito, e o verbo fica no singular: “Precisa-se de corretores”."},{"t":"Divulgou-se, na edição de domingo, os preços do novo lançamento.","p":"calculo","w":"O sujeito (os preços) está distante do verbo, mas continua mandando na concordância: “Divulgaram-se os preços”."}]},{"id":"port12","topic":"Acentuação: novo acordo","c":"Uma editora de Belém atualiza um livro didático para o Acordo Ortográfico em vigor e precisa revisar a acentuação de algumas frases.","q":"Assinale a frase grafada de acordo com as regras de acentuação vigentes.","a":2,"src":"Acordo Ortográfico de 1990 (Decreto 6.583/2008), Bases VIII e IX","o":[{"t":"A plateia aplaudiu de pé o gesto heróico do bombeiro.","p":"generalizacao","w":"Nas paroxítonas, o ditongo aberto “oi” perdeu o acento: “heroico”. O acento continua só nas oxítonas e nos monossílabos, como em “herói”."},{"t":"Os papeis da reunião ficaram esquecidos sobre a mesa.","p":"inversao","w":"Inverte a regra. A queda do acento vale para as paroxítonas; nas oxítonas, o ditongo aberto mantém o acento: “papéis”."},{"t":"A assembleia aprovou a ideia de criar um voo direto para Belém.","p":"correta","w":"“Assembleia” e “ideia” perderam o acento (ditongo aberto em paroxítona), “voo” perdeu o circunflexo do hiato “oo”, e “Belém” é oxítona terminada em “em”, acentuada."},{"t":"Os alunos lêem os textos e vêem os mapas com atenção.","p":"troca","w":"“Leem” e “veem” perderam o circunflexo do hiato “ee”. Não confunda com “têm” e “vêm” (plural de ter e vir), que continuam acentuados."}]}]},{"id":"seg","title":"Segurança digital no trabalho","subtitle":"Golpes, senhas e boas práticas","tag":"Corporativo","blurb":"Phishing, golpe do falso chefe, senhas, ransomware e Wi-Fi público: como reconhecer as ameaças mais comuns no escritório e reagir a elas.","questions":[{"id":"seg1","topic":"Phishing por e-mail","c":"Fernanda, analista de uma distribuidora em Campinas, recebe um e-mail com o logotipo do banco da empresa. A mensagem diz que a conta será bloqueada em 24 horas se ela não confirmar os dados em um link, e o remetente é suporte@bancoo-seguranca.com.","q":"Qual é a atitude correta?","a":2,"src":"Cert.br, Cartilha de Segurança para Internet: Golpes","o":[{"t":"Clicar no link apenas para conferir a página, sem digitar nenhum dado.","p":"restricao","w":"Não digitar dados não torna o clique seguro. A página pode tentar instalar código malicioso e o clique confirma ao golpista que o endereço está ativo."},{"t":"Responder ao e-mail pedindo que o remetente comprove que é do banco.","p":"troca","w":"Responder abre uma conversa com o golpista, que vai inventar uma \"prova\". A verificação deve ser feita por canal oficial, nunca pela própria mensagem."},{"t":"Não clicar nem responder e reportar a mensagem à equipe de TI ou segurança pelo canal oficial da empresa.","p":"correta","w":"Urgência, ameaça e remetente com domínio estranho são sinais clássicos de phishing. Reportar permite que a TI bloqueie a mensagem para todos."},{"t":"Encaminhar o e-mail para os colegas, alertando para que não cliquem.","p":"inversao","w":"A intenção é proteger, mas o efeito é o contrário: o link malicioso chega a mais pessoas. O alerta deve partir da TI, depois do reporte."}]},{"id":"seg2","topic":"Golpe do falso chefe","c":"Um número desconhecido, com a foto do diretor financeiro no perfil, escreve no WhatsApp para um analista de uma empresa em Goiânia: \"Troquei de número. Estou em reunião, faça agora um Pix de R$ 8.000 para um fornecedor. Depois te explico.\"","q":"O que o analista deve fazer?","a":0,"src":"Cert.br, Cartilha de Segurança para Internet: Golpes","o":[{"t":"Confirmar o pedido com o diretor por um canal já conhecido, como o número antigo ou pessoalmente, antes de qualquer pagamento.","p":"correta","w":"Urgência, número novo e pedido de Pix fora do processo são a marca do golpe. A checagem precisa ser feita por um canal que o golpista não controla."},{"t":"Fazer o Pix, pois a foto e o nome do diretor no perfil comprovam a identidade.","p":"extrapolacao","w":"Qualquer pessoa pode copiar uma foto e um nome para um perfil. Isso não prova nada sobre quem está do outro lado."},{"t":"Confirmar fazendo uma pergunta pessoal ao próprio número novo.","p":"troca","w":"Verificar pelo mesmo canal suspeito não adianta: o golpista pode ter pesquisado a resposta ou inventar uma desculpa."},{"t":"Fazer o Pix só se o valor estiver abaixo do limite de aprovação do setor.","p":"restricao","w":"O valor não muda o fato de que o pedido pode ser falso. Pagamentos devem seguir o fluxo oficial, qualquer que seja o valor."}]},{"id":"seg3","topic":"Engenharia social por telefone","c":"A recepcionista de uma clínica em Manaus recebe a ligação de um homem que diz ser da empresa de TI terceirizada. Ele pede o login e a senha dela para \"corrigir um erro urgente no servidor\".","q":"Como ela deve agir?","a":3,"src":"Cert.br, Cartilha de Segurança para Internet: Senhas","o":[{"t":"Informar a senha, já que o suporte de TI tem acesso aos sistemas de qualquer forma.","p":"inversao","w":"O raciocínio está invertido: justamente por ter acesso administrativo, a TI de verdade não precisa da senha de ninguém."},{"t":"Informar apenas o login, pois um dado isolado nunca oferece risco.","p":"generalizacao","w":"O login é metade da credencial e ajuda o golpista a montar o ataque. E ceder qualquer parte confirma que a vítima está disposta a colaborar."},{"t":"Informar a senha e trocá-la logo depois da ligação.","p":"calculo","w":"Erro de procedimento: no intervalo, o golpista já pode entrar, copiar dados ou criar outros acessos."},{"t":"Não informar nada, encerrar a ligação e avisar a TI pelo canal interno oficial.","p":"correta","w":"Senha é pessoal e nenhum suporte legítimo deve pedi-la. Avisar a TI permite alertar os colegas, que podem receber a mesma ligação."}]},{"id":"seg4","topic":"Senhas e gerenciador","c":"Rodrigo, supervisor de uma loja em São Paulo, usa a senha Brasil@2024 no e-mail, no sistema de vendas e no banco. Ele acha que ela é segura porque tem letra maiúscula, símbolo e número.","q":"Qual é a melhor recomendação para ele?","a":1,"src":"Cert.br, Cartilha de Segurança para Internet: Senhas; NIST SP 800-63B","o":[{"t":"Manter a senha em todos os sistemas, pois ter maiúscula, símbolo e número já a torna forte.","p":"generalizacao","w":"Palavra comum mais ano é um padrão que programas de ataque testam cedo. E, se um serviço vazar, a mesma senha abre todos os outros."},{"t":"Usar senhas longas e diferentes em cada serviço, como frases-senha, guardadas em um gerenciador de senhas.","p":"correta","w":"Comprimento pesa mais que complexidade, e senha única impede que um vazamento se espalhe. O gerenciador guarda todas, e ele só precisa lembrar uma senha mestra."},{"t":"Trocar apenas o ano a cada vez: Brasil@2025, Brasil@2026, e assim por diante.","p":"calculo","w":"A variação é previsível. Quem conhece uma senha antiga descobre a nova em poucas tentativas."},{"t":"Criar senhas diferentes e anotá-las em um papel colado no monitor.","p":"troca","w":"Troca um cofre protegido por uma anotação à vista de qualquer pessoa que passe pela mesa."}]},{"id":"seg5","topic":"Autenticação em dois fatores","c":"O e-mail corporativo de uma empresa em Belo Horizonte passou a exigir, além da senha, um código gerado por um aplicativo autenticador no celular do funcionário.","q":"Qual é o benefício real dessa mudança?","a":1,"src":"Cert.br, Cartilha de Segurança para Internet: Verificação em duas etapas","o":[{"t":"A senha deixa de ser necessária, porque o código passa a substituí-la.","p":"troca","w":"O código é um fator a mais, não um substituto. O login passa a exigir as duas coisas: senha e código."},{"t":"Mesmo que a senha vaze, o invasor ainda precisa do segundo fator para entrar na conta.","p":"correta","w":"A verificação em duas etapas combina algo que você sabe (senha) com algo que você tem (celular). Só a senha não basta para entrar."},{"t":"A conta se torna impossível de invadir em qualquer situação.","p":"generalizacao","w":"Reduz muito o risco, mas não o elimina. Se o funcionário repassar o código a um golpista, por exemplo, a proteção cai."},{"t":"Só protege se o celular estiver conectado à internet no momento do login.","p":"restricao","w":"Aplicativos autenticadores geram os códigos no próprio aparelho, a partir da hora, e funcionam mesmo sem internet."}]},{"id":"seg6","topic":"Wi-Fi público","c":"No aeroporto de Brasília, a analista Carla vê duas redes abertas, Aeroporto_Free e Aeroporto-WiFi-Gratis, e precisa acessar o sistema financeiro da empresa antes do voo.","q":"Qual é a conduta mais segura?","a":3,"src":"Cert.br, Cartilha de Segurança para Internet: Redes","o":[{"t":"Conectar-se à rede de nome mais oficial, pois um nome igual ao do local garante que ela é legítima.","p":"extrapolacao","w":"Qualquer pessoa pode criar uma rede com o nome que quiser. Redes falsas com nomes convincentes são usadas justamente para capturar dados."},{"t":"Usar qualquer uma das redes, pois redes públicas são sempre monitoradas e protegidas pela administração.","p":"generalizacao","w":"Redes abertas, em geral, não criptografam o tráfego entre o aparelho e o roteador, e outras pessoas conectadas podem tentar interceptá-lo."},{"t":"Usar uma das redes abertas, mas acessar o sistema pela janela anônima do navegador.","p":"troca","w":"A janela anônima só evita guardar histórico e cookies no próprio aparelho. Ela não protege o tráfego na rede."},{"t":"Usar os dados móveis do celular ou a VPN corporativa para acessar o sistema.","p":"correta","w":"A rede móvel evita o Wi-Fi compartilhado, e a VPN cria um túnel criptografado até a empresa. As duas reduzem o risco de interceptação."}]},{"id":"seg7","topic":"Ransomware e backup","c":"Na segunda de manhã, os arquivos de um escritório de advocacia em Recife aparecem com uma extensão estranha, e um aviso na tela exige pagamento em criptomoeda para devolvê-los.","q":"Que medida, tomada antes do ataque, permitiria recuperar os arquivos sem depender dos criminosos?","a":0,"src":"Cert.br, Cartilha de Segurança para Internet (ransomware e backup)","o":[{"t":"Backups regulares, testados e guardados desconectados da rede.","p":"correta","w":"O ransomware cifra o que consegue alcançar. Uma cópia desconectada e testada permite restaurar os arquivos sem pagar resgate."},{"t":"Um backup em HD externo que fica sempre conectado ao servidor.","p":"troca","w":"Um disco sempre conectado pode ser cifrado junto com o servidor. Backup útil contra ransomware precisa ficar isolado."},{"t":"Um antivírus atualizado, que impede qualquer ransomware de agir.","p":"generalizacao","w":"O antivírus ajuda, mas não detecta todas as ameaças, principalmente as novas. Ele não substitui o backup."},{"t":"Sincronizar a pasta com a nuvem, pois a cópia sincronizada nunca é afetada.","p":"extrapolacao","w":"A sincronização replica as alterações, inclusive os arquivos cifrados. Sincronizar não é o mesmo que ter backup isolado."}]},{"id":"seg8","topic":"URL falsa","c":"Um funcionário recebe um SMS: \"Sua CNH será suspensa. Regularize em https://detran-sp.gov.br.regulariza-cnh.com/pagar\".","q":"Qual domínio realmente controla esse endereço?","a":2,"src":"Sistema de nomes de domínio (DNS); Cert.br, Cartilha: Golpes","o":[{"t":"detran-sp.gov.br, pois é o que aparece logo no início do endereço.","p":"inversao","w":"Leu na ordem errada. O domínio se lê da direita para a esquerda, a partir do fim do nome antes da primeira barra."},{"t":"gov.br, pois qualquer endereço que contenha gov.br é oficial.","p":"generalizacao","w":"Qualquer um pode criar subdomínios com o texto que quiser, inclusive \"gov.br\". O que conta é o domínio no final do nome."},{"t":"regulariza-cnh.com, o final do nome antes da primeira barra; o que vem antes são subdomínios criados pelo dono.","p":"correta","w":"O nome do servidor é detran-sp.gov.br.regulariza-cnh.com, e quem o controla é o dono de regulariza-cnh.com. O texto inicial é só disfarce."},{"t":"O endereço é confiável, porque começa com https.","p":"extrapolacao","w":"O https só indica que a conexão é criptografada. Sites de golpe também usam https e cadeado."}]},{"id":"seg9","topic":"Atualização de sistemas","c":"Há semanas, o notebook de um vendedor em Fortaleza mostra o aviso de uma atualização de segurança do Windows. Ele sempre adia, porque \"o computador está funcionando bem\".","q":"Por que adiar a atualização é arriscado?","a":3,"src":"Cert.br, Cartilha de Segurança para Internet (atualização de sistemas)","o":[{"t":"Não é arriscado: atualizações trazem só recursos novos, e a segurança depende apenas do antivírus.","p":"troca","w":"Atualizações de segurança corrigem falhas do próprio sistema, algo que o antivírus não faz."},{"t":"Só seria arriscado se o computador começasse a ficar lento.","p":"restricao","w":"Lentidão não tem relação com a falha estar aberta. Um sistema vulnerável pode funcionar perfeitamente até ser atacado."},{"t":"Instalar a atualização é que deixa o sistema vulnerável, porque altera arquivos do Windows.","p":"inversao","w":"É o contrário: a atualização fecha brechas. Quem fica vulnerável é o sistema desatualizado."},{"t":"As atualizações corrigem falhas já conhecidas, que criminosos exploram justamente em sistemas desatualizados.","p":"correta","w":"Quando uma correção é publicada, a falha fica conhecida. Atacantes passam a mirar quem ainda não aplicou a correção."}]},{"id":"seg10","topic":"Mesa e tela limpas","c":"Em uma repartição pública de Porto Alegre, um servidor sai para o café e deixa o computador desbloqueado, processos impressos com dados pessoais sobre a mesa e a senha anotada em um papel sob o teclado.","q":"Qual conduta segue a política de mesa limpa e tela limpa?","a":0,"src":"ABNT NBR ISO/IEC 27002: política de mesa limpa e tela limpa","o":[{"t":"Bloquear a tela (Win + L) e guardar documentos e anotações sensíveis sempre que se afastar, mesmo por pouco tempo.","p":"correta","w":"Bastam poucos minutos para alguém usar a sessão aberta, fotografar documentos ou copiar a senha. A regra vale para qualquer ausência."},{"t":"Bloquear o computador só em ausências longas, como o almoço, pois em pausas rápidas não há risco.","p":"restricao","w":"O risco não depende da duração da pausa. Uma sessão aberta por cinco minutos já basta para um acesso indevido."},{"t":"Deixar os papéis na mesa, pois o ambiente é interno e só há colegas por perto.","p":"generalizacao","w":"Ambient
