<style>
/* Layout: app mobile de uma coluna (390px de referência); no desktop aparece dentro de uma moldura de iPhone. */
:root {
  --stage: #E8EBF3;
  --bg: #F6F7FB;
  --surface: #FFFFFF;
  --line: #E8EBF3;
  --ink: #141A33;
  --ink-2: #596080;
  --ink-3: #676E8C;
  --navy: #1F2A6B;
  --navy-2: #2E3C8F;
  --on-navy: #FFFFFF;
  --btn: #1F2A6B;
  --on-btn: #FFFFFF;
  --link: #2E3C8F;
  --orange: #FF7A22;
  --orange-ink: #B84A08;
  --t-blue: #EAF0FF; --t-peach: #FFF0E4; --t-mint: #E4F6EE; --t-lilac: #EFECFF; --t-yellow: #FFF5D6; --t-pink: #FFE9EF;
  --i-blue: #2E5BDB; --i-peach: #B54907; --i-mint: #0D7A50; --i-lilac: #6648D8; --i-yellow: #A87A00; --i-pink: #CC3366;
  --ok: #14945A; --ok-soft: #E4F6EE; --bad: #D93A30; --bad-soft: #FDECEB;
  --heat-0: #ECEEF5; --heat-1: #FFD9BE; --heat-2: #FFA866; --heat-3: #FF7A22;
  --shadow: 0 1px 2px rgba(20, 26, 51, .04), 0 8px 24px rgba(20, 26, 51, .06);
  --display: "Poppins", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #05070F; --bg: #0B0F22; --surface: #151B36; --line: #232B50; --ink: #F1F3FB; --ink-2: #AEB4CF; --ink-3: #8A91B0;
    --navy: #18205A; --navy-2: #26318A; --btn: #FF7A22; --on-btn: #141B4D; --link: #9DAAFF;
    --orange: #FF8A3D; --orange-ink: #FFA466;
    --t-blue: rgba(110, 140, 255, .14); --t-peach: rgba(255, 138, 61, .14); --t-mint: rgba(60, 200, 140, .14); --t-lilac: rgba(150, 120, 255, .16); --t-yellow: rgba(255, 200, 60, .14); --t-pink: rgba(255, 90, 140, .14);
    --i-blue: #9DB2FF; --i-peach: #FFA466; --i-mint: #5ED9A2; --i-lilac: #B9A6FF; --i-yellow: #FFD45E; --i-pink: #FF8FB1;
    --ok: #3CCB88; --ok-soft: rgba(60, 203, 136, .14); --bad: #FF6A60; --bad-soft: rgba(255, 106, 96, .14);
    --heat-0: #1C2346; --heat-1: #5A3518; --heat-2: #B25A1E; --heat-3: #FF8A3D;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #05070F; --bg: #0B0F22; --surface: #151B36; --line: #232B50; --ink: #F1F3FB; --ink-2: #AEB4CF; --ink-3: #8A91B0;
  --navy: #18205A; --navy-2: #26318A; --btn: #FF7A22; --on-btn: #141B4D; --link: #9DAAFF;
  --orange: #FF8A3D; --orange-ink: #FFA466;
  --t-blue: rgba(110, 140, 255, .14); --t-peach: rgba(255, 138, 61, .14); --t-mint: rgba(60, 200, 140, .14); --t-lilac: rgba(150, 120, 255, .16); --t-yellow: rgba(255, 200, 60, .14); --t-pink: rgba(255, 90, 140, .14);
  --i-blue: #9DB2FF; --i-peach: #FFA466; --i-mint: #5ED9A2; --i-lilac: #B9A6FF; --i-yellow: #FFD45E; --i-pink: #FF8FB1;
  --ok: #3CCB88; --ok-soft: rgba(60, 203, 136, .14); --bad: #FF6A60; --bad-soft: rgba(255, 106, 96, .14);
  --heat-0: #1C2346; --heat-1: #5A3518; --heat-2: #B25A1E; --heat-3: #FF8A3D;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.d { font-family: var(--display); }

/* Palco e moldura de iPhone no desktop */
.statusbar { display: none; }
#app { height: 100%; max-width: 480px; margin: 0 auto; position: relative; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
#view { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
@media (min-width: 760px) and (min-height: 780px) {
  body { background: var(--stage); display: flex; align-items: center; justify-content: center; }
  #app { width: 390px; height: min(844px, calc(100% - 48px)); border-radius: 54px; box-shadow: 0 0 0 11px #0D0F18, 0 0 0 13px #2A2E3D, 0 40px 80px rgba(10, 14, 30, .35); flex: none; }
  .statusbar { display: flex; align-items: center; justify-content: space-between; height: 47px; padding: 0 30px 0 34px; flex: none; font-family: -apple-system, "SF Pro Text", var(--body); font-weight: 600; font-size: 16px; color: var(--ink); background: var(--bg); position: relative; z-index: 20; }
  .statusbar.on-navy { background: var(--navy); color: #fff; }
  .statusbar .island { position: absolute; left: 50%; top: 11px; transform: translateX(-50%); width: 122px; height: 35px; border-radius: 20px; background: #000; }
  .statusbar .sb-r { display: flex; gap: 6px; align-items: center; }
  .statusbar svg { display: block; }
}

.page { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 12px 32px; display: flex; flex-direction: column; gap: 24px; }
.blk { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sec h2 { font-size: 18px; }
.link { color: var(--link); font-weight: 700; font-size: 14px; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.tiny { font-size: 12px; color: var(--ink-3); }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 18px; height: 18px; }
.logo { width: 28px; height: 28px; flex: none; }

/* Cabeçalho azul com curva (referência TOTC) */
.hdr { background: var(--navy); color: var(--on-navy); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 14px 64px; border-radius: 0 0 50% 50% / 0 0 34px 34px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 20px; }
.hdr::before { content: ""; position: absolute; width: 240px; height: 240px; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); right: -90px; top: -60px; }
.hdr::after { content: ""; position: absolute; width: 130px; height: 130px; border-radius: 50%; background: var(--orange); right: -62px; top: 78px; opacity: .95; }
.memrow { position: relative; z-index: 2; }
.hdr > * { position: relative; z-index: 1; }
.hdr .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--orange); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 16px; flex: none; }
.hello { display: flex; align-items: center; gap: 12px; }
.hello small { display: block; font-size: 13px; color: rgba(255,255,255,.7); }
.hello b { font-family: var(--display); font-weight: 600; font-size: 17px; }
.glass { background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.2); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-radius: 14px; }
.gchip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; font-weight: 700; font-size: 14px; }
.gchip .ico { width: 17px; height: 17px; color: #FFB27A; }
.hdr h1 { font-size: 26px; line-height: 1.25; max-width: 13ch; }
.hdr h1 em { font-style: normal; color: #FFB27A; }
.memrow { display: flex; gap: 10px; }
.memrow .glass { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.memrow b { font-family: var(--display); font-size: 22px; font-weight: 600; line-height: 1.2; }
.memrow span { font-size: 12px; color: rgba(255,255,255,.75); }
.cta-float { margin-top: -40px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); position: relative; z-index: 2; }
/* Relatório da semana */
.wreport { background: var(--navy); color: #fff; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; box-shadow: var(--shadow); }
.wreport::after { content: ""; position: absolute; width: 150px; height: 150px; border-radius: 50%; background: var(--orange); right: -70px; top: -80px; opacity: .95; }
.wreport > * { position: relative; z-index: 1; }
.wr-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.wr-h small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: rgba(255,255,255,.72); }
.wr-h b { display: block; font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.3; margin-top: 2px; max-width: 220px; }
.wr-h .btn { flex: none; background: #fff; color: var(--navy); gap: 6px; }
.wr-h .btn svg { width: 16px; height: 16px; }
.wr-body { display: grid; grid-template-columns: 1fr 1.15fr; gap: 14px; align-items: end; }
.wr-nums { display: flex; flex-direction: column; gap: 8px; }
.wr-nums > div { display: flex; align-items: baseline; gap: 8px; }
.wr-nums b { font-family: var(--display); font-weight: 700; font-size: 22px; min-width: 54px; }
.wr-nums span { font-size: 12.5px; color: rgba(255,255,255,.75); display: flex; align-items: center; gap: 6px; }
.wr-nums em { white-space: nowrap; font-style: normal; font-weight: 800; font-size: 11.5px; padding: 2px 6px; border-radius: 99px; }
.wr-nums em.up { background: rgba(60,203,136,.22); color: #7FE7B5; } .wr-nums em.down { background: rgba(255,255,255,.12); color: rgba(255,255,255,.8); }
.wr-bars { position: relative; height: 112px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; }
.wb { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.wb .col { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.wb i { display: block; width: 100%; max-width: 22px; border-radius: 6px; background: #7C8BF0; }
.wb i.z { background: rgba(255,255,255,.16); }
.wb.hit i { background: var(--orange); }
.wb small { font-size: 11px; font-weight: 700; color: rgba(255,255,255,.65); line-height: 12px; }
.wb.today small { color: #fff; }
.wr-goal { position: absolute; left: 0; right: 0; border-top: 1.5px dashed rgba(255,255,255,.35); pointer-events: none; }
/* Pontos fracos */
.card.weak { padding: 6px 14px 14px; gap: 0; }
.wk { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.wk .main { flex: 1; min-width: 0; } .wk .main b { display: block; font-size: 14.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .wk .main span { font-size: 12.5px; color: var(--ink-2); }
.wk-m { display: flex; align-items: center; gap: 8px; flex: none; width: 112px; } .wk-m .bar { flex: 1; } .wk-m .num { font-size: 12.5px; font-weight: 800; width: 34px; text-align: right; }
.card.weak > p { margin: 12px 0 10px; }
.bar i.r { background: var(--bad); }
/* Compartilhar */
.share-sheet { display: flex; flex-direction: column; gap: 12px; }
.share-sheet h2 { font-size: 19px; }
.share-sheet a.btn { text-decoration: none; }
.share-prev { display: grid; place-items: center; min-height: 200px; }
.share-prev img { width: auto; max-width: 100%; height: min(52vh, 440px); border-radius: 18px; box-shadow: var(--shadow); }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--orange); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Plano de hoje */
.plan { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 14px 14px 8px; }
.plan-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 4px 10px; border-bottom: 1px solid var(--line); }
.plan-h small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--orange-ink); }
.plan-h b { font-family: var(--display); font-weight: 700; font-size: 17px; }
.plan-ring { --p: 0; width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--orange) calc(var(--p) * 1%), var(--line) 0); transition: background .4s; }
.plan-ring > span { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.plan.all .plan-ring { background: var(--ok); } .plan.all .plan-ring > span { color: var(--ok); }
.plan-steps { list-style: none; margin: 0; padding: 4px 0 0; }
.ps { position: relative; }
.ps:not(:last-child)::before { content: ""; position: absolute; left: 21px; top: 44px; bottom: -6px; width: 2px; border-radius: 2px; background: var(--line); }
.ps.done:not(:last-child)::before { background: var(--ok); opacity: .45; }
.ps-btn { all: unset; }
.ps-btn, .ps:has(> .ps-dot) { display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; padding: 9px 4px; border-radius: 14px; cursor: pointer; }
.ps:has(> .ps-dot) { cursor: default; }
.ps-btn:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
@media (hover: hover) { .ps-btn:hover { background: var(--bg); } }
.ps-dot { width: 34px; height: 34px; flex: none; margin-left: 4px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--ink-2); font-size: 14px; position: relative; z-index: 1; box-shadow: 0 0 0 4px var(--surface); }
.ps-dot svg { width: 18px; height: 18px; }
.ps.cur .ps-dot { background: var(--orange); color: #141B4D; box-shadow: 0 0 0 4px var(--surface), 0 0 0 7px rgba(255,122,34,.22); }
.ps.done .ps-dot { background: var(--ok); color: #fff; }
.ps.is-chest:not(.done) .ps-dot { background: var(--t-peach); }
.ps.is-chest:not(.done) .ps-dot svg { width: 24px; height: 24px; }
.ps-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ps-txt b { font-size: 14.5px; font-weight: 700; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ps-txt > span:not(.bar) { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ps-txt .bar { margin-top: 5px; height: 5px; }
.ps.done .ps-txt b { color: var(--ink-2); text-decoration: line-through; text-decoration-color: rgba(127,127,127,.5); }
.ps-btn > .btn { flex: none; pointer-events: none; }
.ps-btn > svg:last-child { flex: none; color: var(--ink-3); }
.plan-mini { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); }
.plan-mini small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--orange-ink); }
.plan-mini b { font-size: 14.5px; font-weight: 700; }
.ps-txt b { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.plan-foot { display: flex; align-items: center; gap: 6px; margin: 6px 4px 6px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--ok); }
.plan-foot svg { width: 16px; height: 16px; }
.cta-card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 14px; display: flex; align-items: center; gap: 14px; }
.cta-card .txt { flex: 1; min-width: 0; }
.cta-card .txt b { display: block; font-family: var(--display); font-weight: 600; font-size: 15px; }
.cta-card .txt span { font-size: 13px; color: var(--ink-2); }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 14px; font-family: var(--display); font-weight: 600; font-size: 15px; transition: transform .1s ease, opacity .15s; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn-primary { background: var(--btn); color: var(--on-btn); }
.btn-orange { background: var(--orange); color: #141B4D; }
.btn-soft { background: var(--t-blue); color: var(--link); }
.btn-ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn-text { background: none; color: var(--link); min-height: 44px; }
.btn-danger { background: var(--bad-soft); color: var(--bad); }
.btn-block { width: 100%; }
.btn-sm { min-height: 42px; padding: 0 16px; font-size: 14px; border-radius: 12px; }
.btn .ico { width: 18px; height: 18px; stroke-width: 2.2; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); flex: none; }
.icon-btn.flat { box-shadow: none; background: none; }

/* Tiles de ícone pastel */
.tile { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; font-family: var(--display); font-weight: 600; font-size: 14px; }
.tile .ico { width: 22px; height: 22px; }
.tile.round { border-radius: 50%; }
.c-blue { background: var(--t-blue); color: var(--i-blue); } .c-peach { background: var(--t-peach); color: var(--i-peach); } .c-mint { background: var(--t-mint); color: var(--i-mint); }
.c-lilac { background: var(--t-lilac); color: var(--i-lilac); } .c-yellow { background: var(--t-yellow); color: var(--i-yellow); } .c-pink { background: var(--t-pink); color: var(--i-pink); }

/* Cartões e listas */
.card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); min-width: 0; }
.card.pad { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.list { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; width: 100%; min-width: 0; position: relative; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 74px; right: 16px; height: 1px; background: var(--line); }
.item.noicon + .item.noicon::before { left: 16px; }
button.item:active { background: var(--bg); }
.item .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.item .main b { font-weight: 700; font-size: 15px; line-height: 1.35; }
.item .main span { font-size: 13px; color: var(--ink-3); line-height: 1.4; }
.item .end { display: flex; align-items: center; gap: 4px; color: var(--ink-3); font-size: 14px; font-weight: 600; flex: none; }
.chev { width: 18px; height: 18px; color: var(--ink-3); }
.bar { height: 6px; border-radius: 6px; background: var(--heat-0); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; border-radius: 6px; }
.bar .o { background: var(--orange); } .bar .n { background: var(--navy-2); } .bar .g { background: var(--ok); }
:root[data-theme="dark"] .bar .n { background: var(--link); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bar .n { background: var(--link); } }
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; color: #fff; }
.check.on { background: var(--ok); border-color: var(--ok); }
.check .ico { width: 14px; height: 14px; stroke-width: 3; }

/* Capas e cards de trilha (referências TOTC / Ezyskills) */
.cover { display: block; width: 100%; height: auto; border-radius: 14px; }
.hscroll { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -20px; padding: 4px 20px 16px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.ccard { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 10px; display: flex; flex-direction: column; gap: 10px; text-align: left; min-width: 0; }
.hscroll .ccard { flex: 0 0 236px; scroll-snap-align: start; }
.ccard .cb { padding: 0 4px 4px; display: flex; flex-direction: column; gap: 6px; }
.ccard h3 { font-size: 15px; line-height: 1.35; }
.ccard .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid2 .ccard h3 { font-size: 14px; }
.tag { display: inline-flex; align-self: flex-start; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.fchip { flex: none; padding: 8px 16px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 700; font-size: 14px; color: var(--ink-2); }
.fchip[aria-pressed="true"] { background: var(--orange); color: #141B4D; box-shadow: none; }
.search { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 0 14px; min-height: 50px; }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 15px; }
.search .ico { color: var(--ink-3); }
.empty { text-align: center; padding: 24px; color: var(--ink-3); font-size: 14px; }

/* Detalhe da trilha */
.dhead { position: relative; }
.dhead .cover { border-radius: 0 0 28px 28px; }
.dhead .bar-top { position: absolute; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; }
.stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.st { border-radius: 14px; padding: 10px 6px; text-align: center; }
.st b { display: block; font-family: var(--display); font-size: 18px; font-weight: 600; line-height: 1.3; }
.st span { font-size: 11px; font-weight: 700; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--heat-0); flex: none; }
.dot.l { background: var(--orange); } .dot.m { background: var(--navy-2); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Sessão */
.sess { min-height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.sess-head { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 8px 8px; display: flex; flex-direction: column; gap: 8px; }
.sess-head .r { display: flex; align-items: center; gap: 12px; }
.pline { flex: 1; height: 8px; border-radius: 8px; background: var(--heat-0); overflow: hidden; }
.pline i { display: block; height: 100%; background: var(--orange); border-radius: 8px; transition: width .4s ease; }
.steps4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-left: 6px; }
.steps4 span { font-size: 11px; font-weight: 700; color: var(--ink-3); text-align: center; padding: 5px 0; border-radius: 8px; }
.steps4 span.on { background: var(--navy); color: #fff; }
.steps4 span.past { color: var(--ink-2); }
.sess-body { flex: 1; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 8px 24px; display: flex; flex-direction: column; gap: 16px; }
.qmeta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; font-weight: 700; color: var(--ink-3); }
.case { background: var(--surface); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); display: flex; gap: 12px; font-size: 15px; color: var(--ink-2); line-height: 1.55; }
.case .tile { width: 36px; height: 36px; border-radius: 12px; }
.qtext { font-size: 20px; line-height: 1.35; }
.think { background: var(--t-blue); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.think b { font-family: var(--display); font-weight: 600; color: var(--i-blue); }
.think p { font-size: 14px; color: var(--ink-2); }
.think .timer { font-size: 13px; font-weight: 700; color: var(--i-blue); font-variant-numeric: tabular-nums; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; width: 100%; padding: 14px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 15px; line-height: 1.45; font-weight: 600; transition: box-shadow .15s, background .15s; }
.opt .L { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 14px; background: var(--t-blue); color: var(--i-blue); flex: none; }
.opt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--navy-2); background: var(--t-blue); }
.opt[aria-pressed="true"] .L { background: var(--navy-2); color: #fff; }
.opt.right { box-shadow: inset 0 0 0 2px var(--ok); background: var(--ok-soft); }
.opt.right .L { background: var(--ok); color: #fff; }
.opt.wrong { box-shadow: inset 0 0 0 2px var(--bad); background: var(--bad-soft); }
.opt.wrong .L { background: var(--bad); color: #fff; }
.opt.dim { opacity: .5; }
.opt[disabled] { cursor: default; }
.dock { position: sticky; bottom: 0; z-index: 6; background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(20, 26, 51, .06); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.dock .hint { text-align: center; font-size: 14px; color: var(--ink-3); padding: 14px 0; font-weight: 600; }
.dock .q { font-size: 13px; color: var(--ink-2); text-align: center; font-weight: 700; }
.conf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.conf button { min-height: 62px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--display); font-weight: 600; font-size: 14px; line-height: 1.2; text-align: center; }
.conf button small { font-family: var(--body); font-weight: 600; font-size: 11px; opacity: .75; margin-top: 3px; }
.conf button:active { transform: scale(.97); }
.verdict { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 18px; animation: rise .3s cubic-bezier(.2,.8,.2,1); }
.verdict.ok { background: var(--ok-soft); } .verdict.bad { background: var(--bad-soft); } .verdict.warn { background: var(--t-peach); }
.verdict .vi { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; }
.verdict.ok .vi { background: var(--ok); } .verdict.bad .vi { background: var(--bad); } .verdict.warn .vi { background: var(--orange); }
.verdict .vi .ico { width: 18px; height: 18px; stroke-width: 2.6; }
.verdict h3 { font-size: 16px; }
.verdict p { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
.verdict .xp { margin-left: auto; font-family: var(--display); font-weight: 600; font-size: 13px; color: var(--orange-ink); background: var(--surface); padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.callout { border-radius: 18px; padding: 16px; display: flex; gap: 12px; align-items: flex-start; }
.callout b { display: block; font-family: var(--display); font-weight: 600; font-size: 15px; }
.callout p { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
.alts { display: flex; flex-direction: column; gap: 10px; }
.alt { background: var(--surface); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: inset 0 0 0 1.5px var(--line); }
.alt .hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.alt .hd .L { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 12px; background: var(--heat-0); color: var(--ink-2); }
.alt .t { font-weight: 700; font-size: 15px; }
.alt .w { font-size: 14px; color: var(--ink-2); }
.alt.is-right { box-shadow: inset 0 0 0 2px var(--ok); }
.alt.is-right .L { background: var(--ok); color: #fff; }
.alt.is-picked { box-shadow: inset 0 0 0 2px var(--bad); }
.alt.is-picked .L { background: var(--bad); color: #fff; }
.tutor { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.tutor .hd { display: flex; align-items: center; gap: 12px; }
.bubble { max-width: 86%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.5; }
.bubble p + p { margin-top: 8px; }
.bubble.ai { background: var(--t-blue); align-self: flex-start; border-bottom-left-radius: 6px; }
.bubble.me { background: var(--navy-2); color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
.qchips { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip { padding: 8px 14px; border-radius: 99px; background: var(--t-peach); color: var(--i-peach); font-size: 13px; font-weight: 700; min-height: 36px; }
.composer { display: flex; gap: 8px; align-items: center; background: var(--bg); border-radius: 16px; padding: 4px 4px 4px 14px; }
.composer input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 15px; min-height: 40px; }
.composer button { width: 40px; height: 40px; border-radius: 12px; background: var(--orange); color: #fff; display: grid; place-items: center; flex: none; }
.composer button[disabled] { opacity: .35; }
.composer button .ico { width: 18px; height: 18px; stroke-width: 2.2; }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .25; } }
.timer-chip { font-family: var(--display); font-weight: 600; font-size: 14px; padding: 4px 12px; border-radius: 99px; background: var(--surface); box-shadow: var(--shadow); font-variant-numeric: tabular-nums; }
.timer-chip.low { color: var(--bad); }

/* Resultado */
.result { background: var(--navy); color: #fff; border-radius: 0 0 50% 50% / 0 0 34px 34px; padding: 28px 20px 54px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; overflow: hidden; }
.result::after { content: ""; position: absolute; width: 140px; height: 140px; border-radius: 50%; background: var(--orange); left: -60px; bottom: -40px; opacity: .9; }
.result > * { position: relative; z-index: 1; }
.result .big { font-family: var(--display); font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
.result .lbl { font-size: 13px; font-weight: 700; color: rgba(255,255,255,.7); text-transform: uppercase; letter-spacing: .08em; }
.result p { color: rgba(255,255,255,.85); font-size: 15px; max-width: 30ch; }
.rstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: -34px; position: relative; z-index: 2; padding: 0 20px; }
.rstats .card { padding: 12px 8px; text-align: center; }
.rstats b { display: block; font-family: var(--display); font-size: 20px; font-weight: 600; }
.rstats span { font-size: 12px; color: var(--ink-3); font-weight: 600; }
details.gab + details.gab { border-top: 1px solid var(--line); }
details.gab summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; font-weight: 700; font-size: 15px; }
details.gab summary::-webkit-details-marker { display: none; }
details.gab .body { padding: 0 16px 16px 58px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--ink-2); }
.gi { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; }
.gi.ok { background: var(--ok); } .gi.bad { background: var(--bad); }
.gi .ico { width: 15px; height: 15px; stroke-width: 2.8; }

/* Formulários */
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .flabel { font-size: 14px; font-weight: 700; color: var(--ink); }
.input, .textarea { width: 100%; background: var(--surface); border: 0; border-radius: 14px; box-shadow: inset 0 0 0 1.5px var(--line); padding: 14px 16px; font-size: 15px; outline: none; }
.textarea { min-height: 110px; resize: vertical; line-height: 1.45; }
.input:focus, .textarea:focus { box-shadow: inset 0 0 0 2px var(--navy-2); }
.input::placeholder, .textarea::placeholder { color: var(--ink-3); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); padding: 4px; border-radius: 14px; gap: 4px; }
.seg button { min-height: 38px; border-radius: 10px; font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--ink-2); text-align: center; }
.seg button[aria-pressed="true"] { background: var(--navy-2); color: #fff; }
.drop { border-radius: 20px; border: 2px dashed var(--line); padding: 26px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; background: var(--surface); cursor: pointer; }
.drop.over { border-color: var(--orange); background: var(--t-peach); }
.drop b { font-family: var(--display); font-weight: 600; }
.notice { padding: 12px 16px; border-radius: 14px; background: var(--t-blue); font-size: 14px; color: var(--ink-2); }
.notice.err { background: var(--bad-soft); color: var(--bad); }

/* Progresso */
.kgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.kcard { border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.kcard b { font-family: var(--display); font-size: 26px; font-weight: 600; line-height: 1.1; color: var(--ink); }
.kcard > span:not(.tile) { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.kcard b span { font: inherit; color: inherit; }
.chart { width: 100%; height: auto; display: block; }
.chart .g { stroke: var(--line); stroke-width: 1; }
.chart .tg { stroke: var(--ok); stroke-width: 1.4; stroke-dasharray: 4 4; }
.chart .ax { font-size: 10px; fill: var(--ink-3); font-family: var(--body); font-weight: 600; }
.chart .tgl { fill: var(--ok); font-weight: 700; }
.chart .ar { fill: var(--orange); opacity: .12; }
.chart .ln { fill: none; stroke: var(--orange); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--orange); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--heat-0); max-width: 100%; }
.heat i.h1 { background: var(--heat-1); } .heat i.h2 { background: var(--heat-2); } .heat i.h3 { background: var(--heat-3); }
.heat i.fut { background: transparent; }
.cal { display: grid; grid-template-columns: 110px 1fr 40px; gap: 12px; align-items: center; font-size: 14px; font-weight: 600; }
.badges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.badge { border-radius: 18px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; background: var(--surface); box-shadow: var(--shadow); }
.badge .tile { width: 46px; height: 46px; border-radius: 50%; }
.badge b { font-size: 12px; font-weight: 700; line-height: 1.3; }
.badge:not(.on) { box-shadow: none; background: transparent; outline: 1.5px dashed var(--line); outline-offset: -1.5px; }
.badge:not(.on) .tile { background: var(--heat-0); color: var(--ink-3); }
.badge:not(.on) b { color: var(--ink-3); }

/* Perfil (referência Profile Mobile UI) */
.pcard { background: var(--navy-2); color: #fff; border-radius: 22px; padding: 18px; display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden; }
.pcard::after { content: ""; position: absolute; width: 120px; height: 120px; border-radius: 50%; background: var(--orange); right: -44px; bottom: -60px; opacity: .9; }
.pcard > * { position: relative; z-index: 1; }
.pcard .avatar { width: 54px; height: 54px; font-size: 20px; box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
.pcard b { font-family: var(--display); font-weight: 600; font-size: 18px; display: block; }
.pcard span { font-size: 13px; color: rgba(255,255,255,.75); }
.pcard .edit { margin-left: auto; width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.16); display: grid; place-items: center; color: #fff; }
.switch { width: 50px; height: 30px; border-radius: 30px; background: var(--heat-0); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--orange); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
details.acc + details.acc { border-top: 1px solid var(--line); }
details.acc summary { list-style: none; padding: 14px 16px; display: flex; gap: 14px; align-items: center; cursor: pointer; font-weight: 700; font-size: 15px; }
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary .grow { flex: 1; }
details.acc[open] summary .chev { transform: rotate(90deg); }
details.acc .body { padding: 0 16px 16px 74px; font-size: 14px; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; }

/* Onboarding */
.onb { min-height: 100%; display: flex; flex-direction: column; }
.onb-art { background: var(--navy); border-radius: 0 0 50% 50% / 0 0 40px 40px; padding: 24px 20px 40px; display: flex; justify-content: center; }
.onb-art svg { width: 100%; max-width: 320px; height: auto; }
.onb-body { flex: 1; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 24px 24px; display: flex; flex-direction: column; gap: 22px; justify-content: space-between; }
.onb h1 { font-size: 28px; line-height: 1.2; }
.onb h1 em { font-style: normal; color: var(--orange-ink); }
.steps { display: flex; gap: 6px; justify-content: center; }
.steps i { height: 6px; width: 6px; border-radius: 6px; background: var(--line); transition: width .2s; }
.steps i.on { width: 22px; background: var(--orange); }
.pick[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--orange); }
.pick .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.pick[aria-pressed="true"] .radio { border: 7px solid var(--orange); }
.choice-list { display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); text-align: left; }
.choice .main { flex: 1; min-width: 0; }
.choice b { display: block; font-weight: 700; font-size: 15px; }
.choice span { font-size: 13px; color: var(--ink-3); }

/* Barra de abas */
#tabbar { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); box-shadow: 0 -6px 24px rgba(20, 26, 51, .06); border-radius: 24px 24px 0 0;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); padding-block: 8px 10px; position: relative; z-index: 8; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--ink-3); min-height: 50px; justify-content: center; text-align: center; }
.tab .ico { width: 24px; height: 24px; }
.tab .pip { width: 44px; height: 30px; border-radius: 12px; display: grid; place-items: center; }
.tab[aria-current="page"] { color: var(--orange-ink); }
.tab[aria-current="page"] .pip { background: var(--t-peach); }

/* Sheet e aviso */
.scrim { position: absolute; inset: 0; background: rgba(10, 14, 34, .45); z-index: 40; display: flex; align-items: flex-end; animation: fade .2s; }

/* ===== Movimento (sutil) ===== */

@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

@keyframes down { to { transform: translateY(60px); opacity: .4; } }

#view.screen-in .hdr, #view.screen-in .result, #view.screen-in .dhead, #view.screen-in .onb-art { animation: fadein .45s ease both; }

#view.screen-in .wd:nth-child(2) i { animation-delay: .03s; } #view.screen-in .wd:nth-child(3) i { animation-delay: .06s; } #view.screen-in .wd:nth-child(4) i { animation-delay: .09s; }
#view.screen-in .wd:nth-child(5) i { animation-delay: .12s; } #view.screen-in .wd:nth-child(6) i { animation-delay: .15s; } #view.screen-in .wd:nth-child(7) i { animation-delay: .18s; }
.opts.in .opt { animation: enter .38s cubic-bezier(.2,.8,.2,1) both; }
.opts.in .opt:nth-child(2) { animation-delay: .05s; } .opts.in .opt:nth-child(3) { animation-delay: .1s; } .opts.in .opt:nth-child(4) { animation-delay: .15s; } .opts.in .opt:nth-child(5) { animation-delay: .2s; }
.opt.right { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
.opt.wrong { animation: shake .42s ease; }

.tab .pip { transition: background .25s ease; }
.tab .pip.pop { animation: pipin .35s cubic-bezier(.2,1.4,.4,1); }
.ccard, .item, .opt, .choice, .fchip, .conf button, .icon-btn, .qchip { transition: transform .12s ease, box-shadow .2s ease, background .2s ease; }

@media (hover: hover) { .ccard:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(20,26,51,.05), 0 14px 32px rgba(20,26,51,.1); } }

/* ===== v5.2 · identidade própria: ícones com um acento laranja, blocos neutros ===== */

.ico .a { fill: var(--orange); stroke: none; }

.upd, .offline { position: absolute; left: 12px; right: 12px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; border-radius: 18px; padding: 10px 10px 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 700; box-shadow: 0 12px 32px rgba(20,26,51,.22); animation: fadeUp .3s ease both; }

/* ícones ilustrados (sprite) */

  const EXTRA = [{"id":"bio","title":"Biologia ENEM","subtitle":"Células, genética e ecologia","tag":"Escola","blurb":"Divisão celular, genética, imunologia e ecologia em casos do dia a dia, do jeito que o ENEM cobra.","questions":[{"id":"bio1","topic":"Mitose e meiose","c":"Em uma aula de um cursinho no Recife, a professora compara a divisão das células da pele que fecham um corte no braço com a divisão das células dos testículos que originam os espermatozoides. As células humanas do corpo têm 46 cromossomos.","q":"Qual afirmação descreve corretamente as duas divisões?","a":2,"src":"Divisão celular: mitose e meiose (espermatogênese)","o":[{"t":"Na cicatrização ocorre meiose, e nos testículos ocorre mitose, já que os espermatozoides são cópias idênticas da célula-mãe.","p":"inversao","w":"Inverte os processos. A cicatrização usa mitose, que gera células idênticas; os espermatozoides vêm da meiose e não são cópias da célula-mãe."},{"t":"Nos testículos, a meiose gera duas células com 23 cromossomos cada, pois ocorre uma única divisão.","p":"calculo","w":"A meiose tem duas divisões sucessivas (meiose I e II). Por isso uma célula origina quatro células haploides, e não duas."},{"t":"Na cicatrização, a mitose gera duas células com 46 cromossomos; nos testículos, a meiose gera quatro células com 23.","p":"correta","w":"A mitose mantém o número de cromossomos e serve ao crescimento e à reparação. A meiose reduz esse número à metade e forma os gametas."},{"t":"Nos dois casos ocorre meiose, porque toda divisão celular reduz o número de cromossomos pela metade.","p":"generalizacao","w":"Só a meiose reduz o número de cromossomos. Se toda divisão fizesse isso, as células da pele perderiam cromossomos a cada cicatrização."}]},{"id":"bio2","topic":"Fotossíntese e respiração","c":"Um produtor de alfaces de Holambra (SP) instalou um sensor de gás carbônico (CO2) em uma estufa bem fechada. Durante o dia, a concentração de CO2 cai; durante a noite, ela sobe.","q":"O que explica principalmente o aumento de CO2 durante a noite?","a":0,"src":"Fotossíntese e respiração celular nas plantas","o":[{"t":"Sem luz, a fotossíntese para, mas as plantas continuam a respiração celular, que libera CO2.","p":"correta","w":"A fotossíntese depende de luz e consome CO2. A respiração celular ocorre dia e noite e libera CO2, que se acumula quando a fotossíntese para."},{"t":"À noite as plantas fazem fotossíntese, que libera CO2, e durante o dia fazem respiração, que o consome.","p":"inversao","w":"Troca os papéis dos dois processos. A fotossíntese consome CO2 e libera O2; a respiração consome O2 e libera CO2."},{"t":"As plantas só respiram à noite; durante o dia, fazem apenas fotossíntese.","p":"restricao","w":"Cria um limite que não existe. As plantas respiram o tempo todo; de dia, a fotossíntese costuma superar a respiração e o saldo de CO2 cai."},{"t":"À noite as folhas intensificam a transpiração, que libera CO2 pelos estômatos.","p":"troca","w":"Transpiração é a perda de vapor de água pelas folhas, não a liberação de CO2. O processo que libera CO2 é a respiração celular."}]},{"id":"bio3","topic":"Cruzamento Aa x Aa","c":"Um casal de Belo Horizonte, ambos com pigmentação normal da pele, teve um filho albino. O albinismo oculocutâneo é uma condição autossômica recessiva.","q":"Qual é a probabilidade de o próximo filho do casal ser albino?","a":1,"src":"Primeira Lei de Mendel: cruzamento Aa x Aa","o":[{"t":"1/2, porque metade dos gametas de cada um dos pais carrega o alelo a.","p":"calculo","w":"Para o filho ser aa, precisa receber a de cada pai. As probabilidades se multiplicam: 1/2 x 1/2 = 1/4, e não 1/2."},{"t":"1/4, pois os dois pais são heterozigotos (Aa), e Aa x Aa gera 1 AA : 2 Aa : 1 aa.","p":"correta","w":"Pais normais com filho albino só podem ser Aa. Do cruzamento, 3/4 têm fenótipo normal e 1/4 é aa, ou seja, albino."},{"t":"3/4, porque a proporção 3:1 indica que três em cada quatro filhos terão a característica recessiva.","p":"inversao","w":"Inverte a proporção 3:1. Os três quartos correspondem ao fenótipo dominante (normal); só um quarto manifesta o recessivo."},{"t":"Zero, porque o casal já teve um filho albino e o próximo certamente será normal.","p":"extrapolacao","w":"Cada gestação é um evento independente. O resultado anterior não altera a chance de 1/4 para o próximo filho."}]},{"id":"bio4","topic":"Sistema ABO","c":"Um paciente com sangue tipo O chega a um hospital de Salvador precisando de transfusão de hemácias. O banco de sangue tem bolsas dos tipos A, B, AB e O.","q":"Considerando apenas o sistema ABO, quais bolsas podem ser usadas?","a":3,"src":"Sistema ABO: aglutinogênios e aglutininas","o":[{"t":"Qualquer uma, porque o tipo O é o receptor universal.","p":"inversao","w":"Inverte os papéis. O tipo O é o doador universal de hemácias; o receptor universal é o tipo AB."},{"t":"Tipo AB, porque o plasma do sangue AB não tem aglutininas anti-A nem anti-B.","p":"troca","w":"Confunde aglutinina com aglutinogênio. Na transfusão de hemácias importa o antígeno do doador: as hemácias AB têm A e B e seriam atacadas pelo receptor."},{"t":"Tipo O, mas somente se o doador for parente do paciente.","p":"restricao","w":"O parentesco não é critério de compatibilidade no sistema ABO. A alternativa acrescenta uma condição que não existe."},{"t":"Apenas tipo O, porque o plasma do paciente tem anticorpos anti-A e anti-B.","p":"correta","w":"Quem é O tem aglutininas anti-A e anti-B e reagiria a hemácias com antígeno A ou B. Por isso só recebe hemácias do tipo O."}]},{"id":"bio5","topic":"Níveis tróficos","c":"Em uma área do Pantanal, um estudo descreve a cadeia alimentar: capim → capivara → onça-pintada. Os pesquisadores observam que há muito mais capivaras do que onças na região.","q":"Qual afirmação sobre essa cadeia alimentar está correta?","a":1,"src":"Ecologia: fluxo de energia e níveis tróficos","o":[{"t":"A onça ocupa o 2º nível trófico, pois é o segundo animal da cadeia.","p":"calculo","w":"Os níveis tróficos começam pelo produtor. Capim é o 1º nível, a capivara o 2º e a onça o 3º."},{"t":"A capivara é consumidora primária (2º nível); a onça, consumidora secundária (3º nível), dispõe de menos energia.","p":"correta","w":"A cada nível, boa parte da energia é perdida, sobretudo como calor na respiração. Sobra pouca energia para o topo, que sustenta menos indivíduos."},{"t":"A energia aumenta a cada nível trófico, por isso a onça, no topo, concentra mais energia que o capim.","p":"inversao","w":"É o contrário: a energia disponível diminui a cada nível. Por isso as pirâmides de energia são sempre mais largas na base."},{"t":"A energia circula em ciclo: os decompositores a devolvem ao capim, que a reaproveita.","p":"troca","w":"Confunde ciclo da matéria com fluxo de energia. Os nutrientes são reciclados, mas a energia flui em um só sentido e se dissipa como calor."}]},{"id":"bio6","topic":"Vacina e soro","c":"Um trabalhador rural de Goiás foi picado por uma jararaca e levado ao hospital mais próximo poucas horas depois.","q":"Qual é o tratamento indicado e por quê?","a":0,"src":"Ministério da Saúde: soros antiofídicos e imunização passiva","o":[{"t":"Soro antiofídico específico (antibotrópico), que fornece anticorpos prontos e age de imediato.","p":"correta","w":"O soro é imunização passiva: traz anticorpos já produzidos que neutralizam o veneno na hora. É o indicado para quem já foi picado."},{"t":"Vacina contra o veneno, que estimula o organismo a produzir os próprios anticorpos.","p":"troca","w":"A vacina é preventiva: induz imunização ativa, que leva dias ou semanas. Para um envenenamento em curso, é preciso o soro."},{"t":"Soro, porque ele cria memória imunológica e protege o trabalhador contra picadas futuras.","p":"inversao","w":"Atribui ao soro uma característica da vacina. Os anticorpos do soro são eliminados com o tempo e não geram memória imunológica."},{"t":"Qualquer soro antiofídico, porque um mesmo soro neutraliza o veneno de todas as serpentes.","p":"generalizacao","w":"Os soros são específicos para os venenos de cada grupo de serpentes. Para a jararaca (gênero Bothrops), usa-se o soro antibotrópico."}]},{"id":"bio7","topic":"Estufa e ozônio","c":"Em um debate de uma escola de Porto Alegre, um aluno afirmou: “O buraco na camada de ozônio é a causa do aquecimento global.”","q":"Qual correção a professora deve fazer?","a":3,"src":"Protocolo de Montreal (1987); IPCC","o":[{"t":"O efeito estufa é que filtra a radiação ultravioleta, e a camada de ozônio é que retém o calor na Terra.","p":"inversao","w":"Troca as funções. A camada de ozônio filtra o ultravioleta; os gases de efeito estufa retêm parte do calor (radiação infravermelha)."},{"t":"O efeito estufa é sempre prejudicial e deveria ser eliminado por completo da atmosfera.","p":"generalizacao","w":"O efeito estufa natural mantém a Terra habitável. O problema é a sua intensificação pelas emissões humanas."},{"t":"O buraco na camada de ozônio é causado principalmente pelo CO2 emitido por carros e queimadas.","p":"troca","w":"A destruição do ozônio se deve sobretudo aos CFCs e gases semelhantes, controlados pelo Protocolo de Montreal. O CO2 está ligado ao efeito estufa."},{"t":"São fenômenos distintos: o aquecimento vem da intensificação do efeito estufa; o ozônio filtra o ultravioleta e foi afetado por CFCs.","p":"correta","w":"O aquecimento global decorre do acúmulo de gases como CO2 e metano. A camada de ozônio protege contra o ultravioleta e foi degradada sobretudo por CFCs."}]},{"id":"bio8","topic":"Darwin e Lamarck","c":"Um livro didático antigo dizia: “As girafas esticaram o pescoço para alcançar as folhas altas e passaram essa característica aos filhotes.” O professor de uma escola de Manaus pediu que a turma reescrevesse a frase segundo Darwin.","q":"Como a seleção natural explica o pescoço longo das girafas?","a":2,"src":"Darwin, A Origem das Espécies (1859)","o":[{"t":"O esforço de esticar o pescoço o alongou ao longo da vida, e essa mudança foi herdada pelos filhotes.","p":"troca","w":"Essa é a explicação de Lamarck (uso e desuso e herança dos caracteres adquiridos), justamente a da frase do livro antigo."},{"t":"A necessidade de alcançar as folhas fez surgir nas girafas a variação de pescoço longo.","p":"inversao","w":"Inverte a causa. Para Darwin, a variação já existe na população; o ambiente seleciona, mas não cria a variação por necessidade."},{"t":"Já havia variação no pescoço; as de pescoço mais longo sobreviviam e se reproduziam mais, e a característica se tornou comum.","p":"correta","w":"É a seleção natural: variação prévia, sobrevivência e reprodução diferenciais e aumento da frequência da característica favorável ao longo das gerações."},{"t":"Darwin explicou o fenômeno com base nas leis de Mendel e no papel do DNA na hereditariedade.","p":"extrapolacao","w":"Darwin não conhecia o trabalho de Mendel nem o DNA. A união da seleção natural com a genética veio depois, no século XX."}]},{"id":"bio9","topic":"Transcrição e tradução","c":"Em um laboratório de uma universidade de Campinas, um estudante analisa um trecho da fita molde de DNA de uma célula humana com a sequência TAC GGA.","q":"Qual é a sequência do RNA mensageiro transcrito e onde ele será traduzido?","a":0,"src":"Dogma central: DNA → RNA → proteína","o":[{"t":"AUG CCU, traduzido pelos ribossomos no citoplasma.","p":"correta","w":"Na transcrição, A pareia com U, T com A, C com G e G com C. O RNAm sai do núcleo e é traduzido nos ribossomos, no citoplasma."},{"t":"ATG CCT, traduzido pelos ribossomos no citoplasma.","p":"troca","w":"Usa timina, base exclusiva do DNA. No RNA, a timina é substituída pela uracila (U)."},{"t":"UAC GGA, traduzido pelos ribossomos no citoplasma.","p":"calculo","w":"Apenas trocou T por U na própria fita molde, sem fazer o pareamento de bases. O RNAm é complementar à fita molde."},{"t":"AUG CCU, mas a tradução só pode ocorrer dentro do núcleo, junto ao DNA.","p":"restricao","w":"A sequência está certa, mas a restrição não existe. Em células eucarióticas, a transcrição ocorre no núcleo e a tradução, no citoplasma."}]},{"id":"bio10","topic":"Dengue","c":"Agentes de combate a endemias de Campo Grande (MS) visitam casas e encontram larvas de mosquito em pratos de vasos de plantas com água parada.","q":"Qual afirmação sobre a dengue está correta?","a":3,"src":"Ministério da Saúde: dengue","o":[{"t":"É causada por um protozoário e transmitida pelo mosquito Anopheles, o mesmo da malária.","p":"troca","w":"Mistura a dengue com a malária. A malária é causada por um protozoário (Plasmodium) e transmitida pelo Anopheles; a dengue não."},{"t":"O vírus é o vetor da doença, e o mosquito é o seu agente causador.","p":"inversao","w":"Inverte os papéis. O agente causador é o vírus da dengue; o vetor, que o transmite, é o mosquito Aedes aegypti."},{"t":"Além da picada do mosquito, passa de pessoa para pessoa pela tosse e pelo espirro, como a gripe.","p":"extrapolacao","w":"A dengue não é transmitida pelo ar. A via de transmissão relevante é a picada do mosquito infectado."},{"t":"É causada por um vírus e transmitida pela picada da fêmea do Aedes aegypti, que se reproduz em água parada.","p":"correta","w":"Só a fêmea do Aedes aegypti se alimenta de sangue e transmite o vírus. Eliminar a água parada interrompe o ciclo do mosquito."}]}]},{"id":"dadm","title":"Direito Administrativo","subtitle":"Princípios, atos e servidores","tag":"Concursos","blurb":"Princípios, atos administrativos, servidores, improbidade e licitações em casos práticos, com o artigo exato de cada regra.","questions":[{"id":"dadm1","topic":"Princípios LIMPE","c":"O prefeito de um município do interior do Paraná mandou colocar seu nome e sua foto nas placas das obras e nas campanhas publicitárias da prefeitura, pagas com recursos públicos.","q":"Assinale a alternativa correta sobre a conduta do prefeito.","a":0,"src":"CF/88, art. 37, caput e §1º","o":[{"t":"Ofende a impessoalidade, pois a publicidade oficial não pode ter nomes, símbolos ou imagens que caracterizem promoção pessoal.","p":"correta","w":"O art. 37, §1º, exige caráter educativo, informativo ou de orientação social e veda a promoção pessoal de autoridades, expressão da impessoalidade."},{"t":"É lícita, pois o princípio da publicidade permite divulgar qualquer conteúdo sobre as obras do governo.","p":"generalizacao","w":"Publicidade significa transparência, não autorização para qualquer conteúdo. A própria CF limita a publicidade oficial no art. 37, §1º."},{"t":"Os princípios do art. 37 obrigam apenas a União e os estados; o município segue só a sua lei orgânica.","p":"restricao","w":"O caput do art. 37 alcança a administração direta e indireta de qualquer dos Poderes da União, dos estados, do DF e dos municípios."},{"t":"É irregular, e a CF determina a perda automática do mandato do prefeito por esse fato.","p":"extrapolacao","w":"A CF não prevê perda automática do mandato por essa conduta. Eventuais sanções dependem de processo e das leis aplicáveis."}]},{"id":"dadm2","topic":"Cargos em comissão","c":"Uma prefeitura de Minas Gerais quer nomear, sem concurso, 30 pessoas para cargos em comissão de “auxiliar administrativo”, com tarefas de protocolo, digitação e arquivo.","q":"Essas nomeações são compatíveis com a Constituição?","a":2,"src":"CF/88, art. 37, II e V","o":[{"t":"Sim, porque cargos em comissão dispensam concurso, qualquer que seja a atribuição.","p":"generalizacao","w":"Dispensam concurso, mas não servem para qualquer atribuição. O art. 37, V, limita esses cargos a direção, chefia e assessoramento."},{"t":"Sim, desde que os nomeados já ocupem cargo efetivo, como a CF exige para os cargos em comissão.","p":"troca","w":"Confunde com a função de confiança, que é exercida exclusivamente por servidores efetivos. Cargo em comissão pode ser ocupado por quem não é servidor, respeitado o percentual mínimo que a lei reservar a servidores de carreira."},{"t":"Não, pois cargos em comissão destinam-se apenas às atribuições de direção, chefia e assessoramento.","p":"correta","w":"Tarefas burocráticas e técnicas exigem cargo efetivo, provido por concurso (art. 37, II). O cargo em comissão é restrito ao que prevê o art. 37, V."},{"t":"Não, porque a CF proíbe a criação de cargos em comissão nos municípios.","p":"restricao","w":"A CF não faz essa proibição. Municípios podem criar cargos em comissão por lei, desde que para direção, chefia e assessoramento."}]},{"id":"dadm3","topic":"Acumulação de cargos","c":"Márcia é enfermeira efetiva de um hospital estadual em Fortaleza, no turno da manhã. Ela foi aprovada em concurso para enfermeira de uma unidade básica de saúde do município, no turno da tarde.","q":"Márcia pode acumular os dois cargos?","a":1,"src":"CF/88, art. 37, XVI, “c”","o":[{"t":"Não, porque a Constituição proíbe qualquer acumulação remunerada de cargos públicos.","p":"generalizacao","w":"A vedação tem exceções. Havendo compatibilidade de horários, o art. 37, XVI, permite três hipóteses de acumulação."},{"t":"Sim, pois a CF permite acumular dois cargos privativos de profissionais de saúde, com profissões regulamentadas, se houver compatibilidade de horários.","p":"correta","w":"É a hipótese da alínea “c” do art. 37, XVI. Os turnos distintos garantem a compatibilidade, observado o teto remuneratório do inciso XI."},{"t":"Sim, mas somente se os dois cargos forem do mesmo ente federativo.","p":"restricao","w":"A CF não exige que os cargos sejam do mesmo ente. Um cargo estadual e um municipal podem ser acumulados nas hipóteses permitidas."},{"t":"Sim, e ela poderia acumular ainda um terceiro cargo, de professora, se os horários permitissem.","p":"extrapolacao","w":"As exceções do art. 37, XVI, autorizam a acumulação de dois cargos, nunca de três."}]},{"id":"dadm4","topic":"Atributos do ato","c":"Fiscais da vigilância sanitária de Recife encontram alimentos com prazo de validade vencido em um supermercado. Eles apreendem e inutilizam os produtos no mesmo momento, sem pedir ordem judicial.","q":"Qual atributo do ato administrativo permite essa atuação imediata?","a":3,"src":"Di Pietro, Direito Administrativo: atributos do ato administrativo","o":[{"t":"Tipicidade, atributo que permite à Administração executar materialmente seus atos sem recorrer ao Judiciário.","p":"troca","w":"Tipicidade significa que o ato deve corresponder a uma figura definida em lei. Executar sem ordem judicial é outro atributo."},{"t":"Autoexecutoriedade, que dispensa o Judiciário em qualquer caso, inclusive na cobrança forçada de multas não pagas.","p":"generalizacao","w":"A autoexecutoriedade não é absoluta. A multa não paga, por exemplo, é cobrada por execução fiscal, no Judiciário."},{"t":"Imperatividade, que faz o ato obrigar o particular só depois que ele concorda com o seu conteúdo.","p":"inversao","w":"Inverte o conceito. Imperatividade é justamente a imposição do ato a terceiros, independentemente da concordância deles."},{"t":"Autoexecutoriedade, que permite à Administração executar suas decisões diretamente, sem prévia ordem judicial.","p":"correta","w":"Existe quando a lei autoriza ou em situação urgente, como o risco à saúde pública. A apreensão de alimentos vencidos é exemplo clássico."}]},{"id":"dadm5","topic":"Anulação e revogação","c":"Dois meses depois de conceder uma licença de funcionamento a uma empresa, uma secretaria estadual descobre que ela não apresentou um documento que a lei exige como requisito obrigatório.","q":"Segundo a Súmula 473 do STF, como a Administração deve agir?","a":2,"src":"STF, Súmula 473","o":[{"t":"Revogar a licença, já que a revogação é o instrumento para desfazer atos ilegais.","p":"troca","w":"Confunde os institutos. A revogação retira atos válidos por conveniência ou oportunidade; ato ilegal deve ser anulado."},{"t":"Pedir ao Judiciário que anule a licença, porque a Administração não pode anular os próprios atos.","p":"restricao","w":"Pela autotutela, a própria Administração pode anular seus atos ilegais, sem depender de ação judicial."},{"t":"Anular a licença por ilegalidade, no exercício da autotutela, ressalvada a apreciação judicial.","p":"correta","w":"A Súmula 473 diz que a Administração pode anular seus atos ilegais, “porque deles não se originam direitos”, ressalvada a apreciação judicial."},{"t":"Anular a licença, mas respeitar os direitos adquiridos da empresa, como a súmula exige na anulação.","p":"inversao","w":"Inverte a súmula. O respeito aos direitos adquiridos é exigido na revogação; de atos ilegais não se originam direitos."}]},{"id":"dadm6","topic":"Poder de polícia","c":"Fiscais da prefeitura de Curitiba interditam um bar que funcionava sem alvará e com som acima do limite permitido pela legislação municipal.","q":"Qual poder administrativo fundamenta a interdição?","a":0,"src":"CTN (Lei 5.172/66), art. 78","o":[{"t":"Poder de polícia, que limita direitos, interesses e liberdades individuais em favor do interesse público.","p":"correta","w":"O art. 78 do CTN define poder de polícia como a atividade que limita ou disciplina direitos e liberdades em razão do interesse público, como a tranquilidade e a segurança."},{"t":"Poder disciplinar, porque a prefeitura está punindo quem descumpriu a lei.","p":"troca","w":"O poder disciplinar pune servidores e quem tem vínculo especial com a Administração. O dono do bar é um particular sem esse vínculo."},{"t":"Poder de polícia, mas a interdição só é válida se precedida de autorização judicial.","p":"restricao","w":"Medidas de polícia previstas em lei podem ser executadas pela própria Administração, sem autorização judicial prévia."},{"t":"Poder de polícia, que permite impor qualquer restrição, mesmo sem previsão legal, se houver interesse público.","p":"generalizacao","w":"O poder de polícia se submete à legalidade e à proporcionalidade. Não autoriza restrições sem base em lei."}]},{"id":"dadm7","topic":"Responsabilidade civil objetiva","c":"Um ônibus de uma concessionária do transporte coletivo de Belo Horizonte bate no carro de Roberto, que estava parado no semáforo. Roberto não era passageiro do ônibus.","q":"Como fica a responsabilidade pelos danos ao carro de Roberto?","a":3,"src":"CF/88, art. 37, §6º","o":[{"t":"É subjetiva: Roberto precisa provar a culpa do motorista para ser indenizado.","p":"troca","w":"Troca a responsabilidade objetiva pela subjetiva. Pelo art. 37, §6º, basta provar o dano e o nexo com a atuação do agente."},{"t":"O art. 37, §6º, vale só para pessoas jurídicas de direito público; a concessionária não responde objetivamente.","p":"restricao","w":"O dispositivo inclui expressamente as pessoas jurídicas de direito privado prestadoras de serviços públicos, como a concessionária."},{"t":"A concessionária responde objetivamente e pode cobrar o valor do motorista em regresso, mesmo sem dolo ou culpa dele.","p":"extrapolacao","w":"A primeira parte está certa, mas o direito de regresso só existe nos casos de dolo ou culpa do agente."},{"t":"A concessionária responde objetivamente, sem que Roberto prove culpa, e tem regresso contra o motorista se houver dolo ou culpa.","p":"correta","w":"O art. 37, §6º, alcança as prestadoras privadas de serviço público. O STF (RE 591.874) aplica a regra também a terceiros não usuários, como Roberto."}]},{"id":"dadm8","topic":"Estabilidade do servidor","c":"Lucas foi aprovado em concurso público, nomeado para cargo efetivo de um órgão federal e está em efetivo exercício há dois anos.","q":"De acordo com a Constituição, Lucas já é estável?","a":1,"src":"CF/88, art. 41, caput, §1º e §4º","o":[{"t":"Sim, pois a estabilidade é adquirida após dois anos de efetivo exercício.","p":"troca","w":"Usa a regra anterior à EC 19/1998. Hoje, o art. 41 exige três anos de efetivo exercício."},{"t":"Não: a estabilidade exige três anos de efetivo exercício e aprovação em avaliação especial de desempenho.","p":"correta","w":"O art. 41 fixa três anos de efetivo exercício, e o §4º exige avaliação especial de desempenho por comissão instituída para essa finalidade."},{"t":"Não, e mesmo depois de estável ele nunca poderá perder o cargo.","p":"generalizacao","w":"O servidor estável pode perder o cargo por sentença transitada em julgado, processo administrativo ou avaliação periódica de desempenho (art. 41, §1º)."},{"t":"Não, porque além dos três anos a CF exige que ele tenha sido promovido pelo menos uma vez.","p":"restricao","w":"A Constituição não exige promoção para a estabilidade. A alternativa acrescenta um requisito inexistente."}]},{"id":"dadm9","topic":"Improbidade e dolo","c":"Em 2023, um servidor de uma prefeitura de Santa Catarina, por descuido e sem intenção, deixou de conferir um documento, o que causou prejuízo ao erário. Não há indício de má-fé.","q":"Pela Lei 8.429/92, com a redação da Lei 14.230/2021, essa conduta configura improbidade administrativa?","a":2,"src":"Lei 8.429/92, art. 1º, §§1º e 2º (redação da Lei 14.230/2021)","o":[{"t":"Sim, porque qualquer prejuízo ao erário configura improbidade, com ou sem intenção.","p":"generalizacao","w":"Desde a Lei 14.230/2021, só condutas dolosas configuram improbidade. Prejuízo sem dolo não basta."},{"t":"Sim, porque os atos que causam lesão ao erário (art. 10) ainda admitem a forma culposa.","p":"extrapolacao","w":"A modalidade culposa do art. 10 deixou de existir com a Lei 14.230/2021. Hoje todos os tipos dos arts. 9º, 10 e 11 exigem dolo."},{"t":"Não, pois só condutas dolosas configuram improbidade, e a mera voluntariedade do agente não basta.","p":"correta","w":"O art. 1º, §1º, fala em “condutas dolosas”, e o §2º define dolo como vontade livre e consciente de alcançar o resultado ilícito, não bastando a voluntariedade."},{"t":"Não, porque a lei de improbidade se aplica apenas a agentes políticos eleitos, e não a servidores.","p":"restricao","w":"A lei alcança todo agente público, inclusive servidores de carreira (art. 2º). O problema aqui é a ausência de dolo."}]},{"id":"dadm10","topic":"Modalidades de licitação","c":"Em 2025, um município de Goiás vai comprar cerca de R$ 800 mil em papel, canetas e outros materiais de escritório para as escolas, todos com especificações usuais de mercado.","q":"Qual modalidade de licitação deve ser usada, segundo a Lei 14.133/2021?","a":3,"src":"Lei 14.133/2021, art. 6º, XLI, art. 28 e art. 32","o":[{"t":"Convite, por ser a modalidade mais simples para compras de material de consumo.","p":"troca","w":"O convite era modalidade da Lei 8.666/93 e não existe na Lei 14.133/2021, assim como a tomada de preços."},{"t":"Leilão, porque é a modalidade em que vence quem oferece o menor preço.","p":"inversao","w":"Inverte a finalidade. O leilão serve para alienar bens, e vence o maior lance; não é usado para comprar."},{"t":"Diálogo competitivo, que o gestor pode escolher para qualquer contratação.","p":"generalizacao","w":"O diálogo competitivo é restrito às hipóteses do art. 32, como contratações que envolvam inovação tecnológica ou técnica."},{"t":"Pregão, obrigatório para a aquisição de bens e serviços comuns, com julgamento por menor preço ou maior desconto.","p":"correta","w":"É o que define o art. 6º, XLI. Pregão, concorrência, concurso, leilão e diálogo competitivo são as modalidades do art. 28."}]}]},{"id":"dconst","questions":[{"id":"dconst7","topic":"Habeas corpus","c":"Marcos, morador de Belém, soube por um policial que um delegado pretende prendê-lo na semana que vem, sem flagrante e sem ordem judicial. Ele quer agir antes que a prisão aconteça.","q":"Assinale a afirmação correta sobre a situação de Marcos.","a":3,"src":"CF/88, art. 5º, LXVIII","o":[{"t":"Ele deve aguardar a prisão, pois o habeas corpus só cabe depois que a coação já ocorreu.","p":"restricao","w":"A Constituição protege também quem “se achar ameaçado de sofrer” coação. Existe o habeas corpus preventivo, que busca impedir a prisão ilegal."},{"t":"Ele deve impetrar mandado de segurança, por se tratar de ato ilegal de autoridade pública.","p":"troca","w":"O mandado de segurança é residual: só cabe quando o direito não é amparado por habeas corpus ou habeas data. A liberdade de locomoção é protegida pelo habeas corpus."},{"t":"Ele pode impetrar habeas corpus, mas precisa obrigatoriamente contratar um advogado para isso.","p":"extrapolacao","w":"A impetração de habeas corpus não é atividade privativa de advogado (Lei 8.906/1994, art. 1º, § 1º), e a ação é gratuita (CF/88, art. 5º, LXXVII)."},{"t":"Ele pode impetrar habeas corpus preventivo, pois está ameaçado de sofrer coação ilegal em sua liberdade de locomoção.","p":"correta","w":"Pelo art. 5º, LXVIII, cabe habeas corpus sempre que alguém sofrer ou se achar ameaçado de sofrer violência ou coação na liberdade de locomoção, por ilegalidade ou abuso de poder."}]},{"id":"dconst8","topic":"Mandado de segurança","c":"Felipe foi aprovado no vestibular de uma universidade federal em Natal, mas a secretaria recusou sua matrícula exigindo um documento que não consta do edital. Ele tem prova documental de que cumpriu todos os requisitos.","q":"Assinale a afirmação correta.","a":0,"src":"CF/88, art. 5º, LXIX; Lei 12.016/2009, art. 23","o":[{"t":"Cabe mandado de segurança, pois há direito líquido e certo, não amparado por habeas corpus ou habeas data, violado por autoridade pública.","p":"correta","w":"É a hipótese do art. 5º, LXIX: o direito pode ser comprovado de plano por documentos, e o ato vem de autoridade de uma universidade federal."},{"t":"Cabe habeas data, porque o caso envolve documentos pessoais do candidato.","p":"troca","w":"O habeas data serve para conhecer ou retificar informações sobre o impetrante em bancos de dados públicos. Felipe não quer acessar dados, quer garantir a matrícula."},{"t":"Caberia mandado de segurança mesmo que o ato fosse de um particular sem nenhuma atribuição do Poder Público.","p":"generalizacao","w":"O mandado de segurança exige que o responsável seja autoridade pública ou agente de pessoa jurídica no exercício de atribuições do Poder Público. Não cabe contra qualquer particular."},{"t":"Cabe mandado de segurança, mas apenas se for impetrado em até 30 dias após a recusa.","p":"restricao","w":"Impõe um limite que a lei não prevê. O prazo para impetrar é de 120 dias, contados da ciência do ato (Lei 12.016/2009, art. 23)."}]},{"id":"dconst9","topic":"Mandado de injunção","c":"Renata, servidora pública em Goiânia, alega que um direito previsto na Constituição depende de uma lei regulamentadora que nunca foi editada, o que a impede de exercê-lo.","q":"Qual é o instrumento adequado segundo a Constituição?","a":2,"src":"CF/88, art. 5º, LXXI","o":[{"t":"Mandado de segurança, porque há direito líquido e certo violado por ato de autoridade.","p":"troca","w":"O mandado de segurança combate ato ilegal ou abusivo. Aqui o problema é a ausência de norma regulamentadora, ou seja, uma omissão."},{"t":"Mandado de injunção, mas apenas se o direito estiver ligado à nacionalidade, à soberania ou à cidadania.","p":"restricao","w":"Corta metade do texto. A Constituição também protege os “direitos e liberdades constitucionais” em geral, além das prerrogativas de nacionalidade, soberania e cidadania."},{"t":"Mandado de injunção, porque a falta de norma regulamentadora torna inviável o exercício de um direito constitucional.","p":"correta","w":"É exatamente a hipótese do art. 5º, LXXI: o mandado de injunção combate a omissão que torna inviável o exercício de direitos e liberdades constitucionais."},{"t":"Nenhum: enquanto a lei não for editada, o direito não pode ser levado ao Judiciário.","p":"inversao","w":"Inverte a finalidade do instituto. O mandado de injunção existe justamente para que a falta de lei não anule um direito previsto na Constituição."}]},{"id":"dconst10","topic":"Ação popular","c":"Joaquim, eleitor em Teresina, descobriu que a prefeitura contratou um show por um valor muito acima do de mercado e quer propor uma ação popular para anular o contrato.","q":"Assinale a afirmação correta.","a":1,"src":"CF/88, art. 5º, LXXIII","o":[{"t":"Ele não pode propor a ação, pois só o Ministério Público tem legitimidade para defender o patrimônio público.","p":"troca","w":"Confunde com a ação civil pública. Na ação popular, a Constituição dá legitimidade a qualquer cidadão."},{"t":"Ele pode propor a ação como cidadão e, salvo comprovada má-fé, ficará isento de custas judiciais e do ônus da sucumbência.","p":"correta","w":"É o texto do art. 5º, LXXIII: qualquer cidadão pode propor ação popular para anular ato lesivo ao patrimônio público, e a isenção só cai se houver má-fé comprovada."},{"t":"Ele ficará isento de custas em qualquer hipótese, mesmo que fique provada a sua má-fé.","p":"generalizacao","w":"A isenção não é absoluta. A própria Constituição ressalva a hipótese de comprovada má-fé do autor."},{"t":"Ele só pode propor a ação se comprovar que sofreu prejuízo pessoal e direto com o contrato.","p":"restricao","w":"A Constituição não exige prejuízo pessoal. Basta ser cidadão e apontar ato lesivo ao patrimônio público, à moralidade administrativa, ao meio ambiente ou ao patrimônio histórico e cultural."}]},{"id":"dconst11","topic":"Brasileiro nato","c":"Sophie nasceu em Florianópolis, filha de um casal de franceses que estava no Brasil a turismo. Nenhum dos pais estava a serviço da França.","q":"Como a Constituição classifica Sophie quanto à nacionalidade brasileira?","a":3,"src":"CF/88, art. 12, I, a","o":[{"t":"Ela não é brasileira, porque para ser brasileiro nato é preciso ter ao menos um dos pais brasileiro.","p":"restricao","w":"Acrescenta um requisito que o art. 12, I, a, não tem. Quem nasce no Brasil é brasileiro nato, ainda que de pais estrangeiros."},{"t":"Ela só seria brasileira nata se os pais estivessem a serviço da França.","p":"inversao","w":"Inverte a exceção. Estar a serviço do país de origem é justamente o que afasta a nacionalidade brasileira de quem nasce aqui de pais estrangeiros."},{"t":"Ela é brasileira, mas naturalizada, porque os pais são estrangeiros.","p":"troca","w":"Confunde nato com naturalizado. A naturalização depende de requerimento e requisitos (art. 12, II); Sophie é nata pelo simples nascimento no território."},{"t":"Ela é brasileira nata, porque nasceu no Brasil e os pais estrangeiros não estavam a serviço de seu país.","p":"correta","w":"O art. 12, I, a, adota o critério do território: são natos os nascidos no Brasil, ainda que de pais estrangeiros, desde que estes não estejam a serviço de seu país."}]},{"id":"dconst12","topic":"Sigilo das comunicações","c":"Um delegado da Polícia Civil de São Paulo investiga uma quadrilha de roubo de cargas e quer interceptar as ligações telefônicas de um dos suspeitos.","q":"O que a Constituição exige para que a interceptação seja lícita?","a":1,"src":"CF/88, art. 5º, XII; Lei 9.296/1996, art. 3º","o":[{"t":"Autorização do Ministério Público, que é o titular da ação penal.","p":"troca","w":"O Ministério Público e a autoridade policial podem pedir a interceptação, mas quem a determina é o juiz (Lei 9.296/1996, art. 3º)."},{"t":"Ordem judicial, nas hipóteses e na forma da lei, para fins de investigação criminal ou instrução processual penal.","p":"correta","w":"É o que diz o art. 5º, XII: as comunicações telefônicas podem ser interceptadas por ordem judicial, para fins penais, nas hipóteses e na forma que a lei estabelecer."},{"t":"Ordem judicial, que também poderia ser concedida para instruir uma ação civil de cobrança contra o suspeito.","p":"extrapolacao","w":"A Constituição limita a interceptação telefônica a fins de investigação criminal ou instrução processual penal. O processo civil fica de fora."},{"t":"Nada a torna lícita: o sigilo das comunicações telefônicas é absoluto.","p":"generalizacao","w":"A própria Constituição abre exceção para as comunicações telefônicas, por ordem judicial e para fins penais."}]}]},{"id":"excel","questions":[{"id":"excel7","topic":"CONT.SES","c":"Na planilha de chamados do suporte de uma empresa de Campinas, a coluna A traz o status (\"Aberto\" ou \"Fechado\") e a coluna B traz a prioridade (\"Alta\", \"Média\" ou \"Baixa\"). A coo
