font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}.ed-chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink-3);background:none;display:grid;place-items:center;flex:none;color:#fff;cursor:pointer}.ed-chk[aria-checked=true]{background:#1f9d6a;border-color:#1f9d6a}.ed-chk .ico{width:16px;height:16px}.ed-week{display:flex;gap:8px;margin:0 -16px 10px;padding:2px 16px 6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.ed-week::-webkit-scrollbar{display:none}.ed-week .ed-day{flex:0 0 116px;scroll-snap-align:start}.ed-day{border:1px solid var(--line, #E3E6F0);border-radius:14px;padding:9px 10px;min-height:74px}.ed-day.today{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}.ed-day small{font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}.ed-day.today small{color:var(--orange-ink)}.ed-day p{margin:4px 0 0;font-size:12.5px;line-height:1.35}.ed-weak{width:100%;text-align:left;border:0;cursor:pointer}.review-badge{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--i-mint);background:var(--t-mint);border-radius:14px;padding:9px 12px}.review-badge .ico{width:17px;height:17px;flex:none}.review-badge.warn{color:var(--i-peach);background:var(--t-peach)}.law-alert{background:var(--t-peach)}.ai-usage{display:grid;gap:3px;padding:12px 14px;border-radius:14px;background:var(--t-blue, rgba(0,0,0,.04));margin-bottom:10px}</style>

<script>
const PATTERNS={correta:{l:"Correta",d:"A alternativa que responde exatamente ao que foi pedido."},inversao:{l:"Invers\xE3o",d:"Troca o sentido, a ordem ou a rela\xE7\xE3o de causa e efeito."},generalizacao:{l:"Generaliza\xE7\xE3o",d:"Transforma uma regra com exce\xE7\xF5es em regra absoluta: sempre, nunca, qualquer."},restricao:{l:"Restri\xE7\xE3o indevida",d:"Acrescenta uma condi\xE7\xE3o ou um limite que a regra n\xE3o tem."},extrapolacao:{l:"Extrapola\xE7\xE3o",d:"Vai al\xE9m do que a regra diz e soma algo plaus\xEDvel, mas inexistente."},troca:{l:"Troca de conceito",d:"Usa um conceito vizinho, parecido, no lugar do correto."},calculo:{l:"Erro de procedimento",d:"Aplica o m\xE9todo certo de forma errada ou pula uma etapa."}},BUILTIN_DECKS=[{id:"neuro",title:"Hackeando o estudo",subtitle:"Ci\xEAncia da aprendizagem",blurb:"Comece por aqui. Entenda por que ler n\xE3o \xE9 estudar e como o seu c\xE9rebro realmente guarda informa\xE7\xE3o.",color:"navy",tag:"Recomendado",questions:[{id:"neuro1",topic:"Ilus\xE3o de compet\xEAncia",c:"Ana releu o mesmo resumo tr\xEAs vezes na v\xE9spera da prova. Ao final, sentia que dominava tudo. Na prova, deu branco em quest\xF5es sobre exatamente aquele conte\xFAdo.",q:"Qual fen\xF4meno explica melhor a sensa\xE7\xE3o de Ana antes da prova?",a:0,src:"Projeto Memory, pilar II",o:[{t:"Ilus\xE3o de compet\xEAncia: a familiaridade com o texto foi confundida com a capacidade de lembrar.",p:"correta",w:"Reler gera flu\xEAncia (\u201Cisso me parece conhecido\u201D), mas reconhecer n\xE3o \xE9 recuperar. S\xF3 o esfor\xE7o de lembrar sem olhar mostra o que voc\xEA de fato sabe."},{t:"Efeito de espa\xE7amento: ela estudou com intervalos longos demais.",p:"troca",w:"O espa\xE7amento \xE9 uma estrat\xE9gia que melhora a reten\xE7\xE3o. Al\xE9m disso, Ana estudou tudo na v\xE9spera, ou seja, sem espa\xE7amento algum."},{t:"Efeito de testagem: fazer testes antes da prova a deixou insegura.",p:"inversao",w:"Inverte a ci\xEAncia. O efeito de testagem \xE9 justamente o rem\xE9dio: testar-se aumenta a reten\xE7\xE3o. Ana n\xE3o se testou, s\xF3 releu."},{t:"Interfer\xEAncia proativa: um conte\xFAdo antigo apagou o novo.",p:"extrapolacao",w:"Nada no caso indica um conte\xFAdo anterior competindo com o novo. A alternativa cria uma causa que o enunciado n\xE3o sustenta."}]},{id:"neuro2",topic:"Pr\xE1tica de recupera\xE7\xE3o",c:"Um estudo publicado na revista Science (Karpicke & Blunt, 2011) comparou estudantes que liam um texto e depois faziam mapas conceituais com estudantes que liam e depois tentavam lembrar o conte\xFAdo sem consultar.",q:"Qual grupo teve melhor desempenho na avalia\xE7\xE3o posterior?",a:1,src:"Karpicke & Blunt (2011), Science",o:[{t:"O grupo do mapa conceitual, porque organizar visualmente fixa melhor.",p:"inversao",w:"\xC9 a intui\xE7\xE3o comum, e o estudo mostrou o contr\xE1rio. A pr\xE1tica de recupera\xE7\xE3o superou o mapeamento, inclusive em testes que pediam um mapa conceitual."},{t:"O grupo da pr\xE1tica de recupera\xE7\xE3o, que tentou lembrar sem consultar.",p:"correta",w:"O esfor\xE7o ativo de buscar a resposta na mem\xF3ria fortaleceu o aprendizado mais do que elaborar mapas com o material \xE0 vista."},{t:"Os dois grupos tiveram resultado igual, j\xE1 que ambos estudaram ativamente.",p:"generalizacao",w:"Trata toda atividade \u201Cativa\u201D como equivalente. O que fez diferen\xE7a foi recuperar da mem\xF3ria, n\xE3o apenas mexer no material."},{t:"Nenhum dos dois: s\xF3 a releitura repetida melhorou a reten\xE7\xE3o.",p:"extrapolacao",w:"A releitura nem era um dos grupos comparados na pergunta, e \xE9 a estrat\xE9gia de menor efeito na literatura."}]},{id:"neuro3",topic:"Repeti\xE7\xE3o espa\xE7ada",c:"Jo\xE3o tem 6 horas dispon\xEDveis para estudar um conte\xFAdo cobrado em uma prova daqui a tr\xEAs semanas.",q:"Qual distribui\xE7\xE3o tende a gerar a maior reten\xE7\xE3o no dia da prova?",a:2,src:"Pilar: repeti\xE7\xE3o espa\xE7ada",o:[{t:"Seis horas seguidas na v\xE9spera, com o conte\xFAdo fresco na mem\xF3ria.",p:"inversao",w:"Concentrar o estudo (massed practice) d\xE1 sensa\xE7\xE3o de dom\xEDnio no curto prazo, mas \xE9 esquecido r\xE1pido. \xC9 o oposto do que a ci\xEAncia recomenda."},{t:"Tr\xEAs horas nos dois \xFAltimos dias, relendo o material.",p:"restricao",w:"Divide um pouco, mas comprime tudo no fim e usa releitura, que \xE9 passiva. Perde o efeito do espa\xE7amento e da recupera\xE7\xE3o."},{t:"Seis sess\xF5es de uma hora, espa\xE7adas ao longo das semanas, testando-se em cada uma.",p:"correta",w:"Combina os dois efeitos mais robustos da aprendizagem: espa\xE7amento entre sess\xF5es e recupera\xE7\xE3o ativa em cada sess\xE3o."},{t:"Tanto faz a distribui\xE7\xE3o, porque o total de horas \xE9 o mesmo.",p:"generalizacao",w:"O total de horas \xE9 igual, mas o resultado n\xE3o. A forma de distribuir o tempo muda bastante a reten\xE7\xE3o de longo prazo."}]},{id:"neuro4",topic:"Feedback imediato",c:"Em um app de quest\xF5es, o aluno erra uma resposta e s\xF3 descobre o gabarito uma semana depois, ao conferir uma lista.",q:"Qual \xE9 o principal risco desse feedback tardio?",a:3,src:"Thorndike (Lei do Efeito)",o:[{t:"Nenhum: o importante \xE9 receber o gabarito em algum momento.",p:"generalizacao",w:"Ignora o tempo como vari\xE1vel. Durante a semana, a resposta errada fica livre para se fixar."},{t:"O aluno ficar ansioso por n\xE3o saber o resultado.",p:"troca",w:"A ansiedade pode at\xE9 existir, mas n\xE3o \xE9 o principal problema de aprendizagem. A quest\xE3o \xE9 o que acontece com o conceito errado na mem\xF3ria."},{t:"O aluno esquecer a pergunta e n\xE3o conseguir mais refaz\xEA-la.",p:"extrapolacao",w:"Esquecer a pergunta n\xE3o \xE9 o risco central. Mesmo lembrando dela, o erro j\xE1 teve tempo de se consolidar."},{t:"A resposta errada se consolidar na mem\xF3ria e passar a competir com a correta.",p:"correta",w:"Sem corre\xE7\xE3o imediata, o erro se fortalece (interfer\xEAncia proativa). O feedback na hora pega o c\xE9rebro no pico da d\xFAvida e corrige a rota."}]},{id:"neuro5",topic:"Procrastina\xE7\xE3o",c:"Pedro sabe que precisa estudar, mas toda noite decide come\xE7ar \u201Camanh\xE3\u201D. No momento em que adia, sente al\xEDvio imediato.",q:"Segundo a l\xF3gica do desconto temporal, por que o adiamento vence?",a:0,src:"Projeto Memory, desconto hiperb\xF3lico",o:[{t:"O c\xE9rebro supervaloriza o al\xEDvio imediato e desvaloriza a recompensa distante.",p:"correta",w:"\xC9 o desconto hiperb\xF3lico: quanto mais distante a recompensa (a aprova\xE7\xE3o), menor o peso dela agora. O al\xEDvio de adiar \xE9 instant\xE2neo, por isso vence."},{t:"Pedro tem um problema de gest\xE3o do tempo e precisa de uma agenda melhor.",p:"troca",w:"\xC9 o \u201Cerro de diagn\xF3stico\u201D da apresenta\xE7\xE3o. Procrastina\xE7\xE3o \xE9 principalmente regula\xE7\xE3o emocional, n\xE3o falta de agenda."},{t:"Pedro \xE9 pregui\xE7oso e falta for\xE7a de vontade.",p:"extrapolacao",w:"Trata um mecanismo biol\xF3gico como falha de car\xE1ter. O caso descreve um ciclo de al\xEDvio, n\xE3o pregui\xE7a."},{t:"A recompensa futura \xE9 maior, por isso o c\xE9rebro escolhe esperar por ela.",p:"inversao",w:"Inverte a l\xF3gica. Se o c\xE9rebro priorizasse a recompensa futura, Pedro estudaria hoje."}]},{id:"neuro6",topic:"A batalha interna",c:"Diante de uma tarefa dif\xEDcil, duas regi\xF5es do c\xE9rebro \u201Cdisputam\u201D o controle: uma busca prazer imediato e fuga da dor, outra planeja e sustenta objetivos de longo prazo.",q:"Qual regi\xE3o est\xE1 mais associada ao planejamento e aos objetivos de longo prazo?",a:1,src:"Projeto Memory, a batalha interna",o:[{t:"O sistema l\xEDmbico.",p:"inversao",w:"\xC9 o lado oposto da disputa: emocional e reativo, busca prazer imediato e interpreta a tarefa dif\xEDcil como amea\xE7a."},{t:"O c\xF3rtex pr\xE9-frontal.",p:"correta",w:"\xC9 a regi\xE3o do planejamento, do controle inibit\xF3rio e da regra \u201Cdesconforto hoje, conforto amanh\xE3\u201D."},{t:"O cerebelo.",p:"troca",w:"O cerebelo est\xE1 ligado principalmente \xE0 coordena\xE7\xE3o motora e ao equil\xEDbrio, n\xE3o ao planejamento de metas."},{t:"O hipocampo.",p:"troca",w:"O hipocampo \xE9 central na forma\xE7\xE3o de mem\xF3rias, mas n\xE3o \xE9 a regi\xE3o que planeja e sustenta objetivos."}]}]},{id:"port",title:"Portugu\xEAs para concursos",subtitle:"Gram\xE1tica que mais cai",blurb:"Crase, concord\xE2ncia, reg\xEAncia, pontua\xE7\xE3o e coloca\xE7\xE3o pronominal no formato das bancas.",color:"orange",tag:"Concursos",questions:[{id:"port1",topic:"Crase",c:"Um analista revisa um relat\xF3rio antes de envi\xE1-lo \xE0 diretoria.",q:"Assinale a frase em que o acento grave est\xE1 empregado corretamente.",a:2,src:"Norma-padr\xE3o: crase",o:[{t:"Entregou o relat\xF3rio \xE0 ela no fim do dia.",p:"generalizacao",w:"N\xE3o h\xE1 crase antes de pronome pessoal (ela). A regra \u201Ca + a\u201D n\xE3o vale aqui porque \u201Cela\u201D n\xE3o aceita artigo."},{t:"A equipe chegou \xE0 uma conclus\xE3o r\xE1pida.",p:"generalizacao",w:"N\xE3o se usa crase antes de artigo indefinido (uma). A exce\xE7\xE3o \xE9 a indica\xE7\xE3o de horas: \u201C\xE0 uma hora\u201D."},{t:"Refiro-me \xE0s normas internas da empresa.",p:"correta",w:"Quem se refere, refere-se a algo (preposi\xE7\xE3o \u201Ca\u201D) + artigo \u201Cas\u201D de \u201Cas normas\u201D = \xE0s."},{t:"O gerente voltou \xE0 p\xE9 para o escrit\xF3rio.",p:"troca",w:"\u201CP\xE9\u201D \xE9 palavra masculina e n\xE3o admite o artigo \u201Ca\u201D. Sem artigo feminino, n\xE3o h\xE1 crase."}]},{id:"port2",topic:"Concord\xE2ncia verbal",c:"Em um e-mail corporativo, o redator precisa escolher a forma correta dos verbos impessoais.",q:"Assinale a frase correta segundo a norma-padr\xE3o.",a:1,src:"Verbos impessoais: haver e fazer",o:[{t:"Fazem dois anos que trabalho neste setor.",p:"generalizacao",w:"\u201CFazer\u201D indicando tempo decorrido \xE9 impessoal e fica no singular: \u201CFaz dois anos\u201D."},{t:"Faz dois anos que trabalho neste setor.",p:"correta",w:"Verbo \u201Cfazer\u201D no sentido de tempo \xE9 impessoal, n\xE3o tem sujeito, e por isso permanece no singular."},{t:"Houveram muitos problemas na entrega.",p:"generalizacao",w:"\u201CHaver\u201D no sentido de existir \xE9 impessoal: \u201CHouve muitos problemas\u201D."},{t:"Devem haver solu\xE7\xF5es mais baratas.",p:"calculo",w:"Quando \u201Chaver\u201D impessoal vem em locu\xE7\xE3o, o auxiliar tamb\xE9m fica no singular: \u201CDeve haver solu\xE7\xF5es\u201D."}]},{id:"port3",topic:"Reg\xEAncia verbal",c:"O RH redige um comunicado sobre o treinamento obrigat\xF3rio.",q:"Qual frase respeita a reg\xEAncia verbal da norma-padr\xE3o?",a:3,src:"Reg\xEAncia: assistir, obedecer, aspirar, preferir",o:[{t:"Prefiro mais o treinamento presencial do que o online.",p:"extrapolacao",w:"O verbo \u201Cpreferir\u201D j\xE1 indica compara\xE7\xE3o. A forma correta \xE9 \u201Cprefiro uma coisa a outra\u201D, sem \u201Cmais\u201D e sem \u201Cdo que\u201D."},{t:"Todos devem obedecer o regulamento interno.",p:"troca",w:"\u201CObedecer\u201D \xE9 transitivo indireto: obedece-se a algo. O correto \xE9 \u201Cobedecer ao regulamento\u201D."},{t:"Ele aspira o cargo de coordenador.",p:"troca",w:"No sentido de desejar, \u201Caspirar\u201D pede a preposi\xE7\xE3o \u201Ca\u201D: \u201Caspira ao cargo\u201D. Sem preposi\xE7\xE3o, significa inalar."},{t:"Os candidatos assistiram ao treinamento inteiro.",p:"correta",w:"No sentido de ver ou presenciar, \u201Cassistir\u201D \xE9 transitivo indireto: assistir a algo. \u201CAo treinamento\u201D est\xE1 correto."}]},{id:"port4",topic:"Pontua\xE7\xE3o",c:"Uma ata de reuni\xE3o precisa ser revisada antes de ser publicada.",q:"Assinale a frase pontuada corretamente.",a:0,src:"V\xEDrgula: aposto e sujeito",o:[{t:"Maria, a nova gerente, apresentou o plano \xE0 equipe.",p:"correta",w:"\u201CA nova gerente\u201D \xE9 aposto explicativo e deve vir entre v\xEDrgulas."},{t:"O diretor da empresa, aprovou o projeto ontem.",p:"calculo",w:"N\xE3o se separa o sujeito (o diretor da empresa) do verbo (aprovou) por v\xEDrgula."},{t:"Os funcion\xE1rios que chegaram cedo, foram liberados.",p:"calculo",w:"Todo o trecho \u201Cos funcion\xE1rios que chegaram cedo\u201D \xE9 o sujeito. A v\xEDrgula o separa indevidamente do verbo."},{t:"A empresa comprou, cadeiras e mesas novas.",p:"calculo",w:"N\xE3o h\xE1 v\xEDrgula entre o verbo e o seu complemento (cadeiras e mesas)."}]},{id:"port5",topic:"Coloca\xE7\xE3o pronominal",c:"Na norma-padr\xE3o, algumas palavras \u201Catraem\u201D o pronome obl\xEDquo para antes do verbo.",q:"Assinale a frase correta quanto \xE0 coloca\xE7\xE3o do pronome.",a:2,src:"Pr\xF3clise obrigat\xF3ria",o:[{t:"Me disseram que a reuni\xE3o foi adiada.",p:"generalizacao",w:"Na norma-padr\xE3o, n\xE3o se inicia ora\xE7\xE3o com pronome obl\xEDquo \xE1tono. O correto seria \u201CDisseram-me\u201D."},{t:"N\xE3o disseram-me nada sobre a reuni\xE3o.",p:"troca",w:"Palavras negativas (n\xE3o) atraem o pronome: a pr\xF3clise \xE9 obrigat\xF3ria. O correto \xE9 \u201CN\xE3o me disseram\u201D."},{t:"Ningu\xE9m me avisou sobre a mudan\xE7a de sala.",p:"correta",w:"Pronomes indefinidos como \u201Cningu\xE9m\u201D atraem o pronome para antes do verbo. Pr\xF3clise correta."},{t:"Ningu\xE9m avisou-me sobre a mudan\xE7a de sala.",p:"troca",w:"\u201CNingu\xE9m\u201D \xE9 palavra atrativa. Com ela, a \xEAnclise (avisou-me) est\xE1 incorreta."}]},{id:"port6",topic:"Uso dos porqu\xEAs",c:"Os quatro porqu\xEAs s\xE3o uma das pegadinhas mais comuns em provas de portugu\xEAs.",q:"Assinale a frase em que o porqu\xEA est\xE1 empregado corretamente.",a:1,src:"Por que, por qu\xEA, porque, porqu\xEA",o:[{t:"Voc\xEA faltou \xE0 reuni\xE3o porque?",p:"troca",w:"No fim de pergunta, usa-se \u201Cpor qu\xEA\u201D, separado e com acento."},{t:"N\xE3o sei por que ele saiu t\xE3o cedo.",p:"correta",w:"\u201CPor que\u201D separado e sem acento equivale a \u201Cpor qual motivo\u201D, inclusive em perguntas indiretas como esta."},{t:"Ele saiu cedo por qu\xEA estava cansado.",p:"troca",w:"Para explicar uma causa, usa-se \u201Cporque\u201D, junto e sem acento."},{t:"Ningu\xE9m entendeu o por que da decis\xE3o.",p:"troca",w:"Como substantivo (o motivo), escreve-se \u201Co porqu\xEA\u201D, junto e com acento."}]}]},{id:"dconst",title:"Direito Constitucional",subtitle:"Art. 5\xBA da CF/88",blurb:"Direitos e garantias fundamentais cobrados em casos pr\xE1ticos, do jeito que as bancas gostam.",color:"navy",tag:"Concursos",questions:[{id:"dc1",topic:"Inviolabilidade do domic\xEDlio",c:"\xC0s 23h, policiais com mandado judicial de busca e apreens\xE3o chegam \xE0 casa de Carlos. N\xE3o h\xE1 flagrante delito, desastre ou pedido de socorro, e Carlos n\xE3o autoriza a entrada.",q:"Os policiais podem entrar na casa nesse momento?",a:2,src:"CF/88, art. 5\xBA, XI",o:[{t:"Sim, porque o mandado judicial autoriza a entrada a qualquer hora.",p:"generalizacao",w:"A determina\xE7\xE3o judicial s\xF3 autoriza o ingresso durante o dia. \u201CA qualquer hora\u201D transforma a regra em absoluta."},{t:"Sim, desde que estejam acompanhados de um advogado do morador.",p:"extrapolacao",w:"A Constitui\xE7\xE3o n\xE3o prev\xEA essa condi\xE7\xE3o. A alternativa inventa um requisito plaus\xEDvel."},{t:"N\xE3o, pois a entrada por determina\xE7\xE3o judicial s\xF3 pode ocorrer durante o dia.",p:"correta",w:"O art. 5\xBA, XI, permite a entrada sem consentimento em flagrante, desastre, para prestar socorro ou, durante o dia, por determina\xE7\xE3o judicial."},{t:"N\xE3o, pois a casa nunca pode ser invadida sem o consentimento do morador.",p:"restricao",w:"Ignora as exce\xE7\xF5es. Em flagrante delito, desastre ou socorro, a entrada \xE9 permitida at\xE9 \xE0 noite e sem consentimento."}]},{id:"dc2",topic:"Rem\xE9dios constitucionais",c:"Luana descobriu que um \xF3rg\xE3o p\xFAblico mant\xE9m em seu cadastro informa\xE7\xF5es erradas sobre ela e quer ter acesso a esses dados para corrigi-los.",q:"Qual \xE9 a a\xE7\xE3o constitucional adequada?",a:0,src:"CF/88, art. 5\xBA, LXXII",o:[{t:"Habeas data.",p:"correta",w:"Serve para conhecer e retificar informa\xE7\xF5es relativas \xE0 pessoa do impetrante em registros ou bancos de dados de entidades governamentais ou de car\xE1ter p\xFAblico."},{t:"Habeas corpus.",p:"troca",w:"Protege a liberdade de locomo\xE7\xE3o (ir, vir e permanecer), n\xE3o o acesso a dados pessoais."},{t:"Mandado de seguran\xE7a.",p:"troca",w:"\xC9 residual: protege direito l\xEDquido e certo n\xE3o amparado por habeas corpus ou habeas data. Aqui cabe o habeas data."},{t:"Mandado de injun\xE7\xE3o.",p:"troca",w:"\xC9 usado quando falta norma regulamentadora que torne vi\xE1vel um direito constitucional. N\xE3o \xE9 o caso."}]},{id:"dc3",topic:"Direito de reuni\xE3o",c:"Um grupo de moradores quer fazer uma manifesta\xE7\xE3o pac\xEDfica, sem armas, em uma pra\xE7a p\xFAblica. N\xE3o h\xE1 outra reuni\xE3o convocada para o mesmo local.",q:"O que a Constitui\xE7\xE3o exige do grupo?",a:3,src:"CF/88, art. 5\xBA, XVI",o:[{t:"Autoriza\xE7\xE3o pr\xE9via da prefeitura.",p:"inversao",w:"A reuni\xE3o independe de autoriza\xE7\xE3o. Exigir autoriza\xE7\xE3o inverte a l\xF3gica da garantia."},{t:"Autoriza\xE7\xE3o judicial, por se tratar de local p\xFAblico.",p:"extrapolacao",w:"N\xE3o h\xE1 qualquer exig\xEAncia de autoriza\xE7\xE3o judicial para reuni\xF5es pac\xEDficas em locais abertos ao p\xFAblico."},{t:"Nada: o direito de reuni\xE3o n\xE3o tem nenhuma condi\xE7\xE3o.",p:"generalizacao",w:"H\xE1 condi\xE7\xF5es: ser pac\xEDfica, sem armas, n\xE3o frustrar reuni\xE3o anterior no mesmo local e dar pr\xE9vio aviso."},{t:"Apenas pr\xE9vio aviso \xE0 autoridade competente.",p:"correta",w:"O art. 5\xBA, XVI, dispensa autoriza\xE7\xE3o e exige somente pr\xE9vio aviso \xE0 autoridade competente."}]},{id:"dc4",topic:"Liberdade de associa\xE7\xE3o",c:"Uma associa\xE7\xE3o de bairro est\xE1 sendo acusada de desviar recursos. O poder p\xFAblico quer encerrar suas atividades definitivamente.",q:"O que a Constitui\xE7\xE3o exige para a dissolu\xE7\xE3o compuls\xF3ria da associa\xE7\xE3o?",a:1,src:"CF/88, art. 5\xBA, XIX",o:[{t:"Um ato administrativo fundamentado da prefeitura.",p:"troca",w:"Associa\xE7\xF5es s\xF3 podem ser dissolvidas ou ter atividades suspensas por decis\xE3o judicial, nunca por ato administrativo."},{t:"Decis\xE3o judicial transitada em julgado.",p:"correta",w:"Para a dissolu\xE7\xE3o compuls\xF3ria, exige-se decis\xE3o judicial com tr\xE2nsito em julgado. Para a mera suspens\xE3o, basta decis\xE3o judicial."},{t:"Decis\xE3o judicial liminar, por se tratar de urg\xEAncia.",p:"restricao",w:"Liminar poderia, no m\xE1ximo, suspender atividades. A dissolu\xE7\xE3o exige o tr\xE2nsito em julgado."},{t:"Vota\xE7\xE3o da maioria dos associados.",p:"troca",w:"Isso seria dissolu\xE7\xE3o volunt\xE1ria. A pergunta trata de dissolu\xE7\xE3o compuls\xF3ria, imposta de fora."}]},{id:"dc5",topic:"Retroatividade da lei penal",c:"Marcos foi condenado definitivamente. Anos depois, entra em vigor uma lei que reduz a pena do crime que ele cometeu.",q:"A nova lei pode beneficiar Marcos?",a:2,src:"CF/88, art. 5\xBA, XL",o:[{t:"N\xE3o, porque a lei penal nunca retroage.",p:"generalizacao",w:"A regra tem exce\xE7\xE3o expressa: a lei penal retroage para beneficiar o r\xE9u."},{t:"N\xE3o, porque a condena\xE7\xE3o j\xE1 transitou em julgado.",p:"restricao",w:"A retroatividade ben\xE9fica alcan\xE7a inclusive fatos j\xE1 decididos por senten\xE7a condenat\xF3ria transitada em julgado."},{t:"Sim, porque a lei penal retroage para beneficiar o r\xE9u.",p:"correta",w:"O art. 5\xBA, XL, diz que a lei penal n\xE3o retroagir\xE1, salvo para beneficiar o r\xE9u."},{t:"Sim, mas somente se ele pedir dentro de 30 dias.",p:"extrapolacao",w:"N\xE3o existe esse prazo na Constitui\xE7\xE3o. A alternativa cria uma condi\xE7\xE3o que n\xE3o existe."}]},{id:"dc6",topic:"Crimes imprescrit\xEDveis",c:"Em um simulado, o professor pede que os alunos identifiquem crimes que a Constitui\xE7\xE3o considera, ao mesmo tempo, inafian\xE7\xE1veis e imprescrit\xEDveis.",q:"Qual dos crimes abaixo \xE9 imprescrit\xEDvel?",a:0,src:"CF/88, art. 5\xBA, XLII e XLIII",o:[{t:"Racismo.",p:"correta",w:"A pr\xE1tica do racismo \xE9 crime inafian\xE7\xE1vel e imprescrit\xEDvel. A outra hip\xF3tese \xE9 a a\xE7\xE3o de grupos armados contra a ordem constitucional."},{t:"Tortura.",p:"troca",w:"Tortura \xE9 inafian\xE7\xE1vel e insuscet\xEDvel de gra\xE7a ou anistia, mas n\xE3o \xE9 imprescrit\xEDvel."},{t:"Tr\xE1fico il\xEDcito de entorpecentes.",p:"troca",w:"Segue o mesmo regime da tortura: inafian\xE7\xE1vel, sem gra\xE7a ou anistia, mas prescrit\xEDvel."},{t:"Crimes hediondos.",p:"troca",w:"Tamb\xE9m est\xE3o no inciso XLIII: inafian\xE7\xE1veis e sem gra\xE7a ou anistia, mas n\xE3o imprescrit\xEDveis."}]}]},{id:"logica",title:"Racioc\xEDnio L\xF3gico",subtitle:"Proposi\xE7\xF5es e contagem",blurb:"Nega\xE7\xF5es, equival\xEAncias, sequ\xEAncias e probabilidade, com as pegadinhas cl\xE1ssicas desmontadas.",color:"orange",tag:"Concursos",questions:[{id:"rl1",topic:"Nega\xE7\xE3o de \u201Ctodo\u201D",c:"Um diretor afirmou: \u201CTodo servidor do setor \xE9 pontual.\u201D Um colega quer provar que a afirma\xE7\xE3o \xE9 falsa.",q:"Qual \xE9 a nega\xE7\xE3o l\xF3gica da frase do diretor?",a:3,src:"L\xF3gica de quantificadores",o:[{t:"Nenhum servidor do setor \xE9 pontual.",p:"inversao",w:"\xC9 a proposi\xE7\xE3o contr\xE1ria, n\xE3o a nega\xE7\xE3o. Para derrubar \u201Ctodo\u201D, basta um contraexemplo."},{t:"Todo servidor do setor n\xE3o \xE9 pontual.",p:"inversao",w:"Equivale a \u201Cnenhum \xE9 pontual\u201D. Continua exigindo demais para negar a frase."},{t:"Algum servidor do setor \xE9 pontual.",p:"troca",w:"Isso \xE9 compat\xEDvel com a frase original. N\xE3o a contradiz."},{t:"Algum servidor do setor n\xE3o \xE9 pontual.",p:"correta",w:"A nega\xE7\xE3o de \u201Ctodo A \xE9 B\u201D \xE9 \u201Calgum A n\xE3o \xE9 B\u201D. Basta um servidor impontual para a frase ser falsa."}]},{id:"rl2",topic:"Nega\xE7\xE3o da conjun\xE7\xE3o",c:"Um aluno afirma: \u201CEstudo e passo na prova.\u201D",q:"Qual \xE9 a nega\xE7\xE3o dessa proposi\xE7\xE3o?",a:1,src:"Leis de De Morgan",o:[{t:"N\xE3o estudo e n\xE3o passo na prova.",p:"calculo",w:"Negou as partes, mas esqueceu de trocar o \u201Ce\u201D pelo \u201Cou\u201D. \xC9 o erro mais comum em De Morgan."},{t:"N\xE3o estudo ou n\xE3o passo na prova.",p:"correta",w:"Pela Lei de De Morgan, ~(p \u2227 q) \u2261 ~p \u2228 ~q: nega as duas partes e troca \u201Ce\u201D por \u201Cou\u201D."},{t:"Estudo ou n\xE3o passo na prova.",p:"calculo",w:"Negou s\xF3 uma das partes. As duas precisam ser negadas."},{t:"N\xE3o estudo e passo na prova.",p:"calculo",w:"\xC9 s\xF3 um dos cen\xE1rios que tornam a frase falsa, n\xE3o a nega\xE7\xE3o completa."}]},{id:"rl3",topic:"Nega\xE7\xE3o da condicional",c:"Considere a proposi\xE7\xE3o: \u201CSe chove, ent\xE3o levo guarda-chuva.\u201D",q:"Qual \xE9 a nega\xE7\xE3o dessa proposi\xE7\xE3o?",a:0,src:"Condicional: ~(p \u2192 q) \u2261 p \u2227 ~q",o:[{t:"Chove e n\xE3o levo guarda-chuva.",p:"correta",w:"A condicional s\xF3 \xE9 falsa quando o antecedente \xE9 verdadeiro e o consequente \xE9 falso. Por isso, ~(p \u2192 q) \u2261 p \u2227 ~q."},{t:"Se n\xE3o chove, ent\xE3o n\xE3o levo guarda-chuva.",p:"inversao",w:"Essa \xE9 a inversa da condicional, n\xE3o a sua nega\xE7\xE3o. A nega\xE7\xE3o nem \xE9 uma condicional."},{t:"N\xE3o chove e levo guarda-chuva.",p:"inversao",w:"Nesse cen\xE1rio a condicional original \xE9 verdadeira, ent\xE3o n\xE3o pode ser a nega\xE7\xE3o."},{t:"Se levo guarda-chuva, ent\xE3o chove.",p:"inversao",w:"Essa \xE9 a rec\xEDproca. Tamb\xE9m n\xE3o equivale \xE0 nega\xE7\xE3o."}]},{id:"rl4",topic:"Contrapositiva",c:"Considere: \u201CSe \xE9 concursado, ent\xE3o tem estabilidade.\u201D",q:"Qual proposi\xE7\xE3o \xE9 logicamente equivalente a essa?",a:2,src:"p \u2192 q \u2261 ~q \u2192 ~p",o:[{t:"Se tem estabilidade, ent\xE3o \xE9 concursado.",p:"inversao",w:"\xC9 a rec\xEDproca (q \u2192 p). N\xE3o equivale \xE0 original: h\xE1 quem tenha estabilidade por outros motivos."},{t:"Se n\xE3o \xE9 concursado, ent\xE3o n\xE3o tem estabilidade.",p:"inversao",w:"\xC9 a inversa (~p \u2192 ~q), tamb\xE9m n\xE3o equivalente."},{t:"Se n\xE3o tem estabilidade, ent\xE3o n\xE3o \xE9 concursado.",p:"correta",w:"\xC9 a contrapositiva: troca a ordem e nega as duas partes. \xC9 sempre equivalente \xE0 condicional original."},{t:"\xC9 concursado e tem estabilidade.",p:"troca",w:"Uma conjun\xE7\xE3o afirma as duas coisas como fato. A condicional s\xF3 afirma uma rela\xE7\xE3o."}]},{id:"rl5",topic:"Sequ\xEAncias",c:"Observe a sequ\xEAncia: 2, 6, 12, 20, 30, ...",q:"Qual \xE9 o pr\xF3ximo termo?",a:3,src:"Diferen\xE7as sucessivas",o:[{t:"40",p:"calculo",w:"Somou 10 de novo, repetindo a \xFAltima diferen\xE7a. As diferen\xE7as crescem de 2 em 2."},{t:"36",p:"calculo",w:"Somou 6, como se o padr\xE3o recome\xE7asse. As diferen\xE7as s\xE3o 4, 6, 8, 10 e a pr\xF3xima \xE9 12."},{t:"44",p:"calculo",w:"Somou 14, pulando uma etapa do padr\xE3o."},{t:"42",p:"correta",w:"As diferen\xE7as s\xE3o 4, 6, 8, 10, a pr\xF3xima \xE9 12: 30 + 12 = 42. Tamb\xE9m vale n \xD7 (n + 1): 6 \xD7 7 = 42."}]},{id:"rl6",topic:"Probabilidade",c:"Uma urna tem 3 bolas azuis e 2 vermelhas. Retiram-se 2 bolas, uma ap\xF3s a outra, sem reposi\xE7\xE3o.",q:"Qual \xE9 a probabilidade de as duas bolas serem azuis?",a:1,src:"Probabilidade condicional",o:[{t:"9/25",p:"troca",w:"Esse seria o resultado com reposi\xE7\xE3o (3/5 \xD7 3/5). Sem reposi\xE7\xE3o, a segunda retirada muda."},{t:"3/10",p:"correta",w:"Primeira azul: 3/5. Segunda azul, com 4 bolas restantes e 2 azuis: 2/4. 3/5 \xD7 2/4 = 6/20 = 3/10."},{t:"3/5",p:"calculo",w:"\xC9 a probabilidade de s\xF3 a primeira bola ser azul. Faltou multiplicar pela segunda retirada."},{t:"2/5",p:"calculo",w:"Corresponde a 2 azuis sobre 5 bolas, mistura indevida dos dados do problema."}]}]},{id:"excel",title:"Excel no trabalho",subtitle:"Treinamento corporativo",blurb:"PROCV, SOMASES, refer\xEAncias e tabela din\xE2mica em situa\xE7\xF5es reais de escrit\xF3rio. Ideal para onboarding.",color:"navy",tag:"Corporativo",questions:[{id:"xl1",topic:"PROCV e #N/D",c:"A f\xF3rmula =PROCV(A2;Produtos!A:D;3;FALSO) retorna #N/D, mesmo com o c\xF3digo 00123 aparecendo nas duas planilhas. Em uma delas o c\xF3digo est\xE1 alinhado \xE0 esquerda e, na outra, \xE0 direita.",q:"Qual \xE9 a causa mais prov\xE1vel do erro?",a:2,src:"Excel: PROCV",o:[{t:"Faltou fixar a refer\xEAncia com $ na matriz.",p:"troca",w:"Fixar com $ evita erros ao copiar a f\xF3rmula, mas n\xE3o explica o #N/D na pr\xF3pria linha em que ela foi escrita."},{t:"O \xFAltimo argumento deveria ser VERDADEIRO.",p:"inversao",w:"VERDADEIRO faz correspond\xEAncia aproximada e pode trazer o valor errado. Para c\xF3digos, FALSO (exata) \xE9 o correto."},{t:"Os c\xF3digos est\xE3o como texto em uma planilha e como n\xFAmero na outra.",p:"correta",w:'O alinhamento diferente denuncia tipos diferentes. "00123" (texto) e 123 (n\xFAmero) n\xE3o s\xE3o iguais para o PROCV.'},{t:"O \xEDndice de coluna 3 \xE9 maior do que a matriz.",p:"troca",w:"A matriz A:D tem 4 colunas, ent\xE3o 3 \xE9 v\xE1lido. \xCDndice maior que a matriz geraria #REF!, n\xE3o #N/D."}]},{id:"xl2",topic:"Refer\xEAncias absolutas",c:"Na coluna B est\xE3o os valores das vendas e na c\xE9lula C1 est\xE1 a taxa de comiss\xE3o, que vale para todas as linhas. A f\xF3rmula ser\xE1 escrita em C2 e copiada para baixo.",q:"Qual f\xF3rmula deve ser escrita em C2?",a:1,src:"Excel: refer\xEAncias",o:[{t:"=$B$2*C1",p:"inversao",w:"Fixou a c\xE9lula errada. Ao copiar, todas as linhas usariam B2 e a taxa se deslocaria."},{t:"=B2*$C$1",p:"correta",w:"B2 deve variar a cada linha e a taxa em C1 deve ficar fixa. $C$1 trava linha e coluna."},{t:"=B2*$C1",p:"calculo",w:"Travou s\xF3 a coluna. Ao copiar para baixo, a linha muda para C2, C3... e a taxa se perde."}  m\xE9dia ponderada de tr\xEAs provas: P1 com peso 1, P2 com peso 2 e P3 com peso 3. Bia tirou 6, 7 e 8, respectivamente.",q:"Qual \xE9 a nota final de Bia, aproximadamente?",a:3,src:"M\xE9dia ponderada",o:[{t:"7,0",p:"troca",w:"Essa \xE9 a m\xE9dia aritm\xE9tica simples. Com pesos, a prova de maior peso puxa a m\xE9dia."},{t:"7,5",p:"calculo",w:"Valor sem base no c\xE1lculo. Some notas \xD7 pesos e divida pela soma dos pesos."},{t:"8,0",p:"extrapolacao",w:"Considerou s\xF3 a prova de maior peso, como se as outras n\xE3o contassem."},{t:"7,3",p:"correta",w:"(6\xD71 + 7\xD72 + 8\xD73) \xF7 (1+2+3) = (6 + 14 + 24) \xF7 6 = 44 \xF7 6 \u2248 7,33."}]},{id:"mt4",topic:"Juros simples",c:"Carlos aplicou R$ 1.000,00 a juros simples de 2% ao m\xEAs durante 6 meses.",q:"Qual \xE9 o montante ao final do per\xEDodo?",a:1,src:"Juros simples: J = C \xD7 i \xD7 t",o:[{t:"R$ 120,00",p:"troca",w:"Esse \xE9 s\xF3 o valor dos juros. O montante soma juros e capital: 1.000 + 120."},{t:"R$ 1.120,00",p:"correta",w:"J = 1.000 \xD7 0,02 \xD7 6 = 120. Montante = 1.000 + 120 = 1.120."},{t:"R$ 1.126,16",p:"troca",w:"Esse seria o montante a juros compostos (1.000 \xD7 1,02\u2076). O enunciado diz juros simples."},{t:"R$ 1.012,00",p:"calculo",w:"Usou 2% de forma errada, como se fosse 0,2% ao m\xEAs."}]},{id:"mt5",topic:"\xC1rea de figuras",c:"Um terreno retangular mede 12 m por 8 m. O dono vai gramar todo o terreno, exceto um canteiro circular de 3 m de raio. Use \u03C0 = 3.",q:"Qual \xE9 a \xE1rea que ser\xE1 gramada?",a:0,src:"\xC1rea do ret\xE2ngulo e do c\xEDrculo",o:[{t:"69 m\xB2",p:"correta",w:"Ret\xE2ngulo: 12 \xD7 8 = 96. C\xEDrculo: \u03C0 \xD7 r\xB2 = 3 \xD7 9 = 27. \xC1rea gramada: 96 \u2212 27 = 69 m\xB2."},{t:"78 m\xB2",p:"troca",w:"Subtraiu o comprimento da circunfer\xEAncia (2\u03C0r = 18) no lugar da \xE1rea do c\xEDrculo."},{t:"87 m\xB2",p:"calculo",w:"Subtraiu s\xF3 r\xB2 = 9 e esqueceu de multiplicar por \u03C0."},{t:"96 m\xB2",p:"calculo",w:"Calculou a \xE1rea total e esquece <p>Esta pol\xEDtica explica quais dados o Memory trata, por que, com quem compartilha e como voc\xEA exerce seus direitos, conforme a Lei Geral de Prote\xE7\xE3o de Dados (Lei 13.709/2018, LGPD). Controlador: <b>${esc(LEGAL.org)}</b>${LEGAL.doc?", "+esc(LEGAL.doc):""}. Contato do encarregado: ${legalContact()}.</p>
<h3>1. Sem conta, tudo fica no seu aparelho</h3>
<p>Voc\xEA pode usar o Memory sem criar conta. Nesse caso, nome, objetivo, respostas, progresso e avatar ficam salvos apenas no armazenamento local do navegador e n\xE3o s\xE3o enviados aos nossos servidores.</p>
<h3>2. Dados que tratamos quando voc\xEA cria conta</h3>
<ul>
<li><b>Cadastro:</b> nome, e-mail e senha. A senha \xE9 guardada s\xF3 como hash (bcrypt), nunca em texto.</li>
<li><b>Estudo:</b> respostas, n\xEDvel de confian\xE7a, progresso, sequ\xEAncia, moedas, avatar, trilhas que voc\xEA cria e turmas de que participa.</li>
<li><b>Material enviado para a IA:</b> o texto de PDFs ou anota\xE7\xF5es que voc\xEA escolhe enviar para gerar quest\xF5es, e as perguntas feitas ao tutor.</li>
<li><b>Seguran\xE7a:</b> endere\xE7o IP, data e hora de acessos e de a\xE7\xF5es importantes (login, troca de senha, exclus\xE3o).</li>
<li><b>Notifica\xE7\xF5es:</b> se voc\xEA ativar, o endere\xE7o de entrega de notifica\xE7\xF5es do seu navegador e o hor\xE1rio escolhido.</li>
<li><b>Erros do app:</b> quando algo quebra no seu aparelho, registramos a mensagem t\xE9cnica do erro, a tela, a vers\xE3o do app e o tipo de navegador, sem nome, e-mail ou conte\xFAdo seu, para corrigir o problema. Esses registros s\xE3o apagados em 90 dias.</li>
<li><b>Estat\xEDsticas an\xF4nimas:</b> contamos, por dia, quantas vezes algumas a\xE7\xF5es acontecem no app (por exemplo, ciclos conclu\xEDdos e aulas estudadas), sem ligar a contagem a nenhuma pessoa. Voc\xEA pode desligar no Perfil.</li>
</ul>
<p>N\xE3o usamos cookies de publicidade nem ferramentas de rastreamento de terceiros. O \xFAnico cookie \xE9 o de sess\xE3o, necess\xE1rio para manter voc\xEA conectado.</p>
<h3>3. Para que usamos e com qual base legal</h3>
<ul>
<li>Criar e manter sua conta, sincronizar o progresso e oferecer turmas e ligas: <b>execu\xE7\xE3o de contrato</b> (art. 7\xBA, V).</li>
<li>Gerar quest\xF5es e respostas com IA a partir do material que voc\xEA envia: <b>execu\xE7\xE3o de contrato</b>, a seu pedido.</li>
<li>Prevenir fraudes, abuso e acessos indevidos: <b>leg\xEDtimo interesse</b> (art. 7\xBA, IX) e <b>cumprimento de obriga\xE7\xE3o legal</b> (art. 7\xBA, II; Marco Civil da Internet, art. 15).</li>
<li>Enviar lembretes de estudo: <b>consentimento</b> (art. 7\xBA, I), que voc\xEA pode retirar a qualquer momento no Perfil.</li>
</ul>
<h3>4. Com quem compartilhamos</h3>
<p>S\xF3 com fornecedores necess\xE1rios para o servi\xE7o funcionar, que tratam os dados em nosso nome: hospedagem (Vercel), banco de dados (Neon), intelig\xEAncia artificial (Anthropic, apenas o conte\xFAdo enviado para gerar quest\xF5es ou falar com o tutor) e envio de e-mails de recupera\xE7\xE3o de senha. Alguns ficam fora do Brasil; a transfer\xEAncia internacional segue o art. 33 da LGPD. Professores das turmas que voc\xEA entra veem seu nome, avatar e desempenho naquela turma. Participantes da sua liga semanal veem seu primeiro nome, avatar e XP da semana. N\xE3o vendemos dados.</p>
<h3>5. Por quanto tempo guardamos</h3>
<p>Enquanto a conta existir. Ao excluir a conta, apagamos cadastro, progresso, trilhas e participa\xE7\xE3o em turmas e ligas. Registros de acesso s\xE3o mantidos por no m\xEDnimo 6 meses, como exige o Marco Civil da Internet (art. 15), e apagados ap\xF3s 12 meses.</p>
<h3>6. Seus direitos (art. 18)</h3>
<p>Voc\xEA pode confirmar e acessar seus dados, corrigir, pedir portabilidade, eliminar, revogar consentimentos e obter informa\xE7\xF5es sobre compartilhamento. No pr\xF3prio app: <b>Perfil \u2192 Conta \u2192 Baixar meus dados</b> (c\xF3pia completa em JSON) e <b>Excluir conta</b>. Para outros pedidos, fale com o encarregado ${legalContact()}. Voc\xEA tamb\xE9m pode reclamar \xE0 ANPD.</p>
<h3>7. Seguran\xE7a</h3>
<p>Conex\xE3o sempre criptografada (HTTPS), senhas com hash, sess\xF5es revog\xE1veis, limite de tentativas de login e registro de a\xE7\xF5es sens\xEDveis. Em caso de incidente com risco relevante, voc\xEA e a ANPD ser\xE3o comunicados (art. 48).</p>
<h3>8. Crian\xE7as e adolescentes</h3>
<p>Menores de 12 anos s\xF3 podem criar conta com consentimento de um dos pais ou respons\xE1vel (art. 14, \xA7 1\xBA). Adolescentes devem usar o app com conhecimento dos respons\xE1veis.</p>
<p class="tiny">Atualizada em ${esc(LEGAL.updated)}. Mudan\xE7as relevantes ser\xE3o avisadas no app.</p>`}),termos:()=>({title:"Termos de uso",body:`
<p>Ao usar o Memory, voc\xEA concorda com estes termos. Servi\xE7o mantido por <b>${esc(LEGAL.org)}</b>${LEGAL.doc?", "+esc(LEGAL.doc):""}.</p>
<h3>1. O que \xE9 o Memory</h3>
<p>Um app de estudo por recupera\xE7\xE3o ativa e repeti\xE7\xE3o espa\xE7ada, com quest\xF5es pr\xF3prias, trilhas criadas por voc\xEA, turmas, ligas e recursos de intelig\xEAncia artificial. As quest\xF5es s\xE3o autorais e de car\xE1ter educativo: n\xE3o s\xE3o quest\xF5es oficiais de bancas nem garantem aprova\xE7\xE3o.</p>
<h3>2. Sua conta</h3>
<p>Use dados verdadeiros, guarde sua senha e n\xE3o compartilhe a conta. Voc\xEA \xE9 respons\xE1vel pelo que acontece nela. Podemos suspender contas usadas para fraude, abuso, spam ou para burlar limites.</p>
<h3>3. Conte\xFAdo que voc\xEA envia</h3>
<p>Voc\xEA mant\xE9m os direitos sobre PDFs, anota\xE7\xF5es e trilhas que cria e declara ter direito de us\xE1-los. Ao compartilhar uma trilha por c\xF3digo ou com uma turma, autoriza quem recebe a estud\xE1-la no app. N\xE3o envie conte\xFAdo ilegal, ofensivo, protegido sem autoriza\xE7\xE3o ou com dados pessoais de terceiros.</p>
<h3>4. Intelig\xEAncia artificial</h3>
<p>Quest\xF5es e explica\xE7\xF5es geradas por IA podem conter erros. Confira com o material oficial e use o bot\xE3o <b>Reportar problema</b> quando encontrar algo errado. H\xE1 limites di\xE1rios de uso para manter o servi\xE7o est\xE1vel.</p>
<h3>5. Turmas e ligas</h3>
<p>Professores podem ver o desempenho dos alunos da turma. Nas ligas, seu primeiro nome, avatar e XP da semana aparecem para os participantes. Respeite os outros usu\xE1rios.</p>
<h3>6. Disponibilidade</h3>
<p>Trabalhamos para manter o app no ar e seus dados seguros, mas o servi\xE7o \xE9 oferecido como est\xE1, podendo passar por manuten\xE7\xE3o, mudan\xE7as ou interrup\xE7\xF5es. Recomendamos baixar seus dados periodicamente.</p>
<h3>7. Encerramento</h3>
<p>Voc\xEA pode excluir sua conta quando quiser em Perfil \u2192 Conta. Estes termos podem ser atualizados; mudan\xE7as relevantes ser\xE3o avisadas no app. Fica eleito o foro do domic\xEDlio do usu\xE1rio, nos termos do C\xF3digo de Defesa do Consumidor.</p>
<p class="tiny">Atualizados em ${esc(LEGAL.updated)}. D\xFAvidas: ${legalContact()}.</p>`})};function legalSheet(doc){const d=(LEGAL_DOCS[doc]||LEGAL_DOCS.privacidade)();return`<div class="legal"><div class="sec"><h2>${d.title}</h2></div><div class="legal-body">${d.body}</div>
